theme {
  name = "dark"

  ui {
    foreground = "#F5F7FA"
    background = "#0B0F14"
    cursor = "#F4D03F"
    border = "#2F3B4A"
    muted = "#7B8794"
    placeholder = "#52606D"

    highlighted {
      foreground = "#0B0F14"
      background = "#5DADE2"
      style { bold = false, italic = false, underline = false }
    }

    menu-item {
      foreground = "#F5F7FA"
      background = "#1F2933"
      style { bold = false, italic = false, underline = false }
    }

    panel {
      foreground = "#F5F7FA"
      background = "#111821"
      style { bold = false, italic = false, underline = false }
    }

    error {
      foreground = "#FF6B6B"
      background = "#2B1215"
      style {
        bold = true
        italic = false
        underline = false
      }
    }
  }

  syntax {
    keyword {
      foreground = "#5DADE2"
      style {
        bold = true
        italic = false
        underline = false
      }
    }

    string {
      foreground = "#58D68D"
      style { bold = false, italic = false, underline = false }
    }

    comment {
      foreground = "#808080"
      style { bold = false, italic = true, underline = false }
    }

    number {
      foreground = "#F39C12"
      style { bold = false, italic = false, underline = false }
    }

    operator {
      foreground = "#E74C3C"
      style { bold = false, italic = false, underline = false }
    }

    identifier {
      foreground = "#FFFFFF"
      style { bold = false, italic = false, underline = false }
    }

    typ {
      foreground = "#AF7AC5"
      style { bold = true, italic = false, underline = false }
    }

    delimiter {
      foreground = "#D5D8DC"
      style { bold = false, italic = false, underline = false }
    }

    whitespace {
      foreground = "#0B0F14"
      style { bold = false, italic = false, underline = false }
    }

    error {
      foreground = "#FF6B6B"
      background = "#2B1215"
      style { bold = true, italic = false, underline = true }
    }

    normal {
      foreground = "#FFFFFF"
      style { bold = false, italic = false, underline = false }
    }
  }
}
