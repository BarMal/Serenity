theme {
  name = "dark"
  ui {
    foreground = "#F5F7FA"
    background = "#0B0F14"
    cursor = "#F4D03F"
    border = "#37566A"
    panel-border = "#5C8498"
    margin = "#0B0F14"
    muted = "#7B8794"
    placeholder = "#9AA5B1"
    highlighted {
      foreground = "#F5F7FA"
      background = "#24556D"
      style {
        bold = false
        italic = false
        underline = false
      }
    }
    menu-item {
      foreground = "#F5F7FA"
      background = "#182734"
      style {
        bold = false
        italic = false
        underline = false
      }
    }
    panel {
      foreground = "#F5F7FA"
      background = "#111821"
      alpha = 0.94
      style {
        bold = false
        italic = false
        underline = false
      }
    }
    error {
      foreground = "#FF6B6B"
      background = "#2B1215"
      style {
        bold = false
        italic = false
        underline = false
      }
    }
    warning {
      foreground = "#F0B429"
      background = "#2B2000"
      style {
        bold = false
        italic = false
        underline = false
      }
    }
  }
  syntax {
    keyword {
      foreground = "#5DADE2"
      background = "#0B0F14"
      style {
        bold = true
        italic = false
        underline = false
      }
    }
    string {
      foreground = "#58D68D"
      background = "#0B0F14"
      style {
        bold = false
        italic = false
        underline = false
      }
    }
    comment {
      foreground = "#808B96"
      background = "#0B0F14"
      style {
        bold = false
        italic = true
        underline = false
      }
    }
    number {
      foreground = "#F5B041"
      background = "#0B0F14"
      style {
        bold = false
        italic = false
        underline = false
      }
    }
    operator {
      foreground = "#EC7063"
      background = "#0B0F14"
      style {
        bold = false
        italic = false
        underline = false
      }
    }
    identifier {
      foreground = "#F5F7FA"
      background = "#0B0F14"
      style {
        bold = false
        italic = false
        underline = false
      }
    }
    typ {
      foreground = "#AF7AC5"
      background = "#0B0F14"
      style {
        bold = true
        italic = false
        underline = false
      }
    }
    delimiter {
      foreground = "#D5D8DC"
      background = "#0B0F14"
      style {
        bold = false
        italic = false
        underline = false
      }
    }
    whitespace {
      foreground = "#0B0F14"
      background = "#0B0F14"
      style {
        bold = false
        italic = false
        underline = false
      }
    }
    error {
      foreground = "#FF6B6B"
      background = "#2B1215"
      style {
        bold = true
        italic = false
        underline = true
      }
    }
    normal {
      foreground = "#F5F7FA"
      background = "#0B0F14"
      style {
        bold = false
        italic = false
        underline = false
      }
    }
  }
}
