theme {
  name = "dark"

  colors {
    foreground = "#FFFFFF"  // White text
    background = "#000000"  // Black background
    cursor = "#FFFF00"      // Yellow cursor
  }

  syntax {
    keyword {
      foreground = "#5DADE2"     // Light blue for keywords (def, val, if, etc.)
      background = "#000000"
      style {
        bold = true
        italic = false
        underline = false
      }
    }

    string {
      foreground = "#58D68D"     // Light green for strings
      background = "#000000"
      style {
        bold = false
        italic = false
        underline = false
      }
    }
    
    comment {
      foreground = "#808080"     // Gray for comments
      background = "#000000"  
      style {
        bold = false
        italic = true
        underline = false
      }
    }
    
    number {
      foreground = "#F39C12"     // Orange for numbers
      background = "#000000"
      style {
        bold = false
        italic = false
        underline = false
      }
    }
    
    operator {
      foreground = "#E74C3C"     // Red for operators (+, -, *, etc.)
      background = "#000000"
      style {
        bold = false
        italic = false
        underline = false
      }
    }
    
    identifier {
      foreground = "#FFFFFF"     // White for variables/identifiers
      background = "#000000"
      style {
        bold = false
        italic = false
        underline = false
      }
    }
    
    typ {
      foreground = "#AF7AC5"     // Purple for types
      background = "#000000"
      style {
        bold = true
        italic = false
        underline = false
      }
    }
    
    delimiter {
      foreground = "#D5D8DC"     // Light gray for brackets, braces, etc.
      background = "#000000"
      style {
        bold = false
        italic = false
        underline = false
      }
    }
    
    whitespace {
      foreground = "#000000"     // Black (invisible)
      background = "#000000"
      style {
        bold = false
        italic = false
        underline = false
      }
    }
    
    error {
      foreground = "#FF0000"     // Bright red for errors
      background = "#000000"
      style {
        bold = true
        italic = false
        underline = true
      }
    }
    
    normal {
      foreground = "#FFFFFF"     // White for normal text
      background = "#000000"
      style {
        bold = false
        italic = false
        underline = false
      }
    }
  }
}