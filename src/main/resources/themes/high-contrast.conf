theme {
  name = "high-contrast"
  ui {
    foreground = "#FFFFFF"
    background = "#000000"
    cursor = "#FF0000"
    border = "#FFFF00"
    panel-border = "#00FFFF"
    margin = "#000000"
    muted = "#BFBFBF"
    placeholder = "#D9D9D9"
    highlighted {
      foreground = "#000000"
      background = "#00FFFF"
      style {
        bold = true
        italic = false
        underline = false
      }
    }
    menu-item {
      foreground = "#FFFFFF"
      background = "#000000"
      style {
        bold = false
        italic = false
        underline = false
      }
    }
    panel {
      foreground = "#FFFFFF"
      background = "#000000"
      style {
        bold = false
        italic = false
        underline = false
      }
    }
    error {
      foreground = "#FF8080"
      background = "#000000"
      style {
        bold = true
        italic = false
        underline = true
      }
    }
    warning {
      foreground = "#FFD700"
      background = "#000000"
      style {
        bold = true
        italic = false
        underline = false
      }
    }
  }
  syntax {
    keyword {
      foreground = "#00FFFF"
      background = "#000000"
      style {
        bold = true
        italic = false
        underline = false
      }
    }
    string {
      foreground = "#66FF66"
      background = "#000000"
      style {
        bold = false
        italic = false
        underline = false
      }
    }
    comment {
      foreground = "#BFBFBF"
      background = "#000000"
      style {
        bold = false
        italic = true
        underline = false
      }
    }
    number {
      foreground = "#FFA500"
      background = "#000000"
      style {
        bold = false
        italic = false
        underline = false
      }
    }
    operator {
      foreground = "#FF99CC"
      background = "#000000"
      style {
        bold = false
        italic = false
        underline = false
      }
    }
    identifier {
      foreground = "#FFFFFF"
      background = "#000000"
      style {
        bold = false
        italic = false
        underline = false
      }
    }
    typ {
      foreground = "#D9A0FF"
      background = "#000000"
      style {
        bold = true
        italic = false
        underline = false
      }
    }
    delimiter {
      foreground = "#E0E0E0"
      background = "#000000"
      style {
        bold = false
        italic = false
        underline = false
      }
    }
    whitespace {
      foreground = "#A0A0A0"
      background = "#000000"
      style {
        bold = false
        italic = false
        underline = false
      }
    }
    error {
      foreground = "#FF8080"
      background = "#000000"
      style {
        bold = true
        italic = false
        underline = true
      }
    }
    normal {
      foreground = "#FFFFFF"
      background = "#000000"
      style {
        bold = false
        italic = false
        underline = false
      }
    }
  }
}
