theme {
  name = "light"

  ui {
    foreground = "#102A43"
    background = "#FDFDFD"
    cursor = "#0066CC"
    border = "#BCCCDC"
    muted = "#61758A"
    placeholder = "#829AB1"

    highlighted {
      foreground = "#FDFDFD"
      background = "#0066CC"
      style { bold = false, italic = false, underline = false }
    }

    menu-item {
      foreground = "#102A43"
      background = "#D9E2EC"
      style { bold = false, italic = false, underline = false }
    }

    panel {
      foreground = "#102A43"
      background = "#EFF3F8"
      style { bold = false, italic = false, underline = false }
    }

    error {
      foreground = "#B00020"
      background = "#FDECEC"
      style {
        bold = true
        italic = false
        underline = false
      }
    }
  }

  syntax {
    keyword {
      foreground = "#0033CC"
      style {
        bold = true
        italic = false
        underline = false
      }
    }

    string {
      foreground = "#009900"
      style { bold = false, italic = false, underline = false }
    }

    comment {
      foreground = "#666666"
      style { bold = false, italic = true, underline = false }
    }

    number {
      foreground = "#CC6600"
      style { bold = false, italic = false, underline = false }
    }

    operator {
      foreground = "#CC0000"
      style { bold = false, italic = false, underline = false }
    }

    identifier {
      foreground = "#000000"
      style { bold = false, italic = false, underline = false }
    }

    typ {
      foreground = "#7A0099"
      style {
        bold = true
        italic = false
        underline = false
      }
    }

    delimiter {
      foreground = "#333333"
      style { bold = false, italic = false, underline = false }
    }

    whitespace {
      foreground = "#FDFDFD"
      style { bold = false, italic = false, underline = false }
    }

    error {
      foreground = "#B00020"
      background = "#FDECEC"
      style { bold = true, italic = false, underline = true }
    }

    normal {
      foreground = "#000000"
      style { bold = false, italic = false, underline = false }
    }
  }
}
