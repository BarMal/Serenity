theme {
  name = "light"
  ui {
    foreground = "#102A43"
    background = "#FDFDFD"
    cursor = "#0066CC"
    border = "#B0C4D0"
    panel-border = "#7995A8"
    margin = "#FDFDFD"
    muted = "#61758A"
    placeholder = "#486581"
    highlighted {
      foreground = "#FDFDFD"
      background = "#365F78"
      style {
        bold = false
        italic = false
        underline = false
      }
    }
    menu-item {
      foreground = "#102A43"
      background = "#E7EDF3"
      style {
        bold = false
        italic = false
        underline = false
      }
    }
    panel {
      foreground = "#102A43"
      background = "#EFF3F8"
      alpha = 0.94
      style {
        bold = false
        italic = false
        underline = false
      }
    }
    error {
      foreground = "#B00020"
      background = "#FDECEC"
      style {
        bold = false
        italic = false
        underline = false
      }
    }
    warning {
      foreground = "#945802"
      background = "#FFFAEC"
      style {
        bold = false
        italic = false
        underline = false
      }
    }
  }
  syntax {
    keyword {
      foreground = "#0033CC"
      background = "#FDFDFD"
      style {
        bold = true
        italic = false
        underline = false
      }
    }
    string {
      foreground = "#00875A"
      background = "#FDFDFD"
      style {
        bold = false
        italic = false
        underline = false
      }
    }
    comment {
      foreground = "#66788A"
      background = "#FDFDFD"
      style {
        bold = false
        italic = true
        underline = false
      }
    }
    number {
      foreground = "#CC6600"
      background = "#FDFDFD"
      style {
        bold = false
        italic = false
        underline = false
      }
    }
    operator {
      foreground = "#CC0000"
      background = "#FDFDFD"
      style {
        bold = false
        italic = false
        underline = false
      }
    }
    identifier {
      foreground = "#102A43"
      background = "#FDFDFD"
      style {
        bold = false
        italic = false
        underline = false
      }
    }
    typ {
      foreground = "#7A0099"
      background = "#FDFDFD"
      style {
        bold = true
        italic = false
        underline = false
      }
    }
    delimiter {
      foreground = "#334E68"
      background = "#FDFDFD"
      style {
        bold = false
        italic = false
        underline = false
      }
    }
    whitespace {
      foreground = "#FDFDFD"
      background = "#FDFDFD"
      style {
        bold = false
        italic = false
        underline = false
      }
    }
    error {
      foreground = "#B00020"
      background = "#FDECEC"
      style {
        bold = true
        italic = false
        underline = true
      }
    }
    normal {
      foreground = "#102A43"
      background = "#FDFDFD"
      style {
        bold = false
        italic = false
        underline = false
      }
    }
  }
}
