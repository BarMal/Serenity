theme {
  name = "light"
  
  colors {
    foreground = "black"
    background = "white"
    cursor = "#0066CC"
  }
  
  syntax {
    keyword {
      foreground = "#0033CC"     // Dark blue for keywords (def, val, if, etc.)
      background = "#FFFFFF"
      style {
        bold = true
        italic = false
        underline = false
      }
    }
    
    string {
      foreground = "#009900"     // Dark green for strings
      background = "#FFFFFF"
      style {
        bold = false
        italic = false
        underline = false
      }
    }
    
    comment {
      foreground = "#666666"     // Dark gray for comments
      background = "#FFFFFF"
      style {
        bold = false
        italic = true
        underline = false
      }
    }
    
    number {
      foreground = "#CC6600"     // Dark orange for numbers
      background = "#FFFFFF"
      style {
        bold = false
        italic = false
        underline = false
      }
    }
    
    operator {
      foreground = "#CC0000"     // Dark red for operators
      background = "#FFFFFF"
      style {
        bold = false
        italic = false
        underline = false
      }
    }
    
    identifier {
      foreground = "#000000"     // Black for variables/identifiers
      background = "#FFFFFF"
      style {
        bold = false
        italic = false
        underline = false
      }
    }
    
    typ {
      foreground = "#7A0099"     // Dark purple for types
      background = "#FFFFFF"
      style {
        bold = true
        italic = false
        underline = false
      }
    }
    
    delimiter {
      foreground = "#333333"     // Dark gray for brackets, braces, etc.
      background = "#FFFFFF"
      style {
        bold = false
        italic = false
        underline = false
      }
    }
    
    whitespace {
      foreground = "#FFFFFF"     // White (invisible)
      background = "#FFFFFF"
      style {
        bold = false
        italic = false
        underline = false
      }
    }
    
    error {
      foreground = "#FF0000"     // Bright red for errors
      background = "#FFCCCC"     // Light red background
      style {
        bold = true
        italic = false
        underline = true
      }
    }
    
    normal {
      foreground = "#000000"     // Black for normal text
      background = "#FFFFFF"
      style {
        bold = false
        italic = false
        underline = false
      }
    }
  }
}