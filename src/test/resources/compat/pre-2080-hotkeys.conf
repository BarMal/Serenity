# Serenity Editor Configuration
config.version = 1

editor.word_wrap = false

# Hotkey overrides
hotkey.save = ["ctrl+s"]
hotkey.quit = ["ctrl+q", "eof"]
hotkey.undo = ["ctrl+z"]
hotkey.redo = ["ctrl+y"]
hotkey.copy = ["ctrl+c"]
hotkey.paste = ["ctrl+v"]
hotkey.cut = ["ctrl+x"]
hotkey.select_all = ["ctrl+a"]
hotkey.toggle_syntax_highlighting = ["ctrl+shift+h"]
hotkey.open_file = ["ctrl+o"]
hotkey.command_palette = ["ctrl+p", "ctrl+ctrl"]
hotkey.contextual_toolbar = ["ctrl+shift+t"]
hotkey.new_tab = ["ctrl+t"]
hotkey.close_tab = ["ctrl+w"]
hotkey.split_pane_horizontal = ["ctrl+d"]
hotkey.split_pane_vertical = ["ctrl+shift+d"]
hotkey.close_pane = ["ctrl+shift+w"]
hotkey.file_search = ["ctrl+shift+f"]
hotkey.go_to_file = ["ctrl+e"]
hotkey.next_tab = ["ctrl+tab"]
hotkey.previous_tab = ["ctrl+shift+tab", "ctrl+reverse-tab"]
hotkey.move_tab_left = ["ctrl+shift+pageup"]
hotkey.move_tab_right = ["ctrl+shift+pagedown"]
hotkey.find = ["ctrl+f"]
hotkey.replace = ["ctrl+h"]
hotkey.go_to_line = ["ctrl+g"]
hotkey.save_as = ["ctrl+shift+s"]
hotkey.toggle_shortcuts_help = ["f1"]
hotkey.focus_left = ["alt+left"]
hotkey.focus_right = ["alt+right"]
hotkey.focus_up = ["alt+up"]
hotkey.focus_down = ["alt+down"]
hotkey.toggle_chapter_ghosts = ["ctrl+shift+g"]
hotkey.open_chapter_note = ["ctrl+shift+n"]
hotkey.toggle_notes_pin = ["ctrl+shift+l"]

# Keys for any palette command, by its id: hotkey.command.<id> = ["ctrl+alt+k"]; [] unbinds it
hotkey.command.bold = ["ctrl+b"]
hotkey.command.italic = ["ctrl+i"]
hotkey.command.underline = ["ctrl+u"]
