# Serenity Editor Configuration
config.version = 1

# Workspace: code or prose mode (filters which settings are shown and gates code-only tooling: LSP,
# project build/run/test/debug), and pane layout
workspace.mode = code
# Show every setting regardless of the mode filter above
workspace.show_all_settings = false
workspace.minimum_pane_width = 50

# Editor: what the text area shows
editor.syntax_highlighting = false
editor.smart_punctuation = false
editor.word_wrap = true
editor.visual_line_navigation = true
# Keep the cursor's line vertically centred (typewriter scrolling), padding past the document's end
editor.typewriter_scrolling = false
# E-reader-style column layout: as many columns as fit the target width (in cells) plus the gap between them. Only takes effect while word wrap is also on
editor.column_mode = false
editor.column_target_width = 80
editor.column_gap = 2
editor.column_count = auto
editor.line_numbers = true
# Line-number placement (left, right, both) and cell spacing: margin from the panel edge to the counter, padding between the counter and the content
editor.line_number_side = left
editor.line_number_margin_left = auto
editor.line_number_margin_right = 0
editor.line_number_padding = auto
# Where document comments are shown: floating, margin
editor.comments = floating
editor.pane_headers = true
editor.focused_text_body = false
editor.contextual_toolbar = true
editor.contextual_toolbar_mode = icon-and-text
# Lines one mouse-wheel notch scrolls
editor.wheel_scroll_lines = 3
# Cursor: blink; colour overrides leave empty to use the active theme cursor
editor.cursor.mode = blink
editor.cursor.active_color = ""
editor.cursor.inactive_color = ""
# Milliseconds the caret blinks without input before it holds solid; 0 blinks for as long as focused
editor.cursor.blink_timeout_ms = 10000
# Markdown rendering mode: source, split-preview, inline-lens
editor.markdown_view = source
# Default mode for new buffers: plain-text, markdown, rich-text
editor.default_document_mode = plain-text
# Word-count goal for the active document; auto means no goal is set
document.word_goal = auto
# Multi-line drop caps: render a drop-cap paragraph's first character as a large, multi-line glyph
document.drop_caps_enabled = true
# Text area insets as percentages of the central workspace
editor.text_area.left = 0.0
editor.text_area.right = 0.0
editor.text_area.top = 0.0
editor.text_area.bottom = 0.0

# Status line: comma-separated segments (position, title, language, mode, word_count, char_count,
# reading_time) or off; placement pinned (a row under the workspace), floating (a quiet row that follows the
# caret) or off. Colour and alpha overrides leave empty/auto to use the active theme's panel colours.
status.segments = "position, language, title, mode"
status.placement = pinned
status.foreground_color = ""
status.background_color = ""
status.background_alpha = auto

# Typography
typography.prose.family = SansSerif
typography.code.family = "Monaspace Neon (Bundled)"
typography.ui.family = SansSerif
typography.prose.size = 12.0
typography.code.size = 12.0
typography.ui.size = 12.0
typography.prose.ligatures = true
typography.code.ligatures = true
typography.ui.ligatures = false
# Prose line length in characters (e.g. 66ch) while the workspace is in prose mode, or off
typography.prose.measure = off
# How all text adapts to the display: auto, manual (uses the factor below), off
typography.scale.mode = auto
typography.scale.factor = 1.0

# Export and print typography (separate from the screen): preset smf-courier; paper letter or a4;
# font size, line spacing (a multiple), margin and first-line indent in points, or auto for the preset's
export.typography.preset = smf-courier
export.typography.paper = letter
export.typography.font_size = auto
export.typography.line_spacing = auto
export.typography.margin = auto
export.typography.first_line_indent = auto

# Look: interface density (compact, comfortable, spacious)
ui.density = comfortable
# How strongly a misspelled-word/diagnostic highlight's severity colour shows through (0.0-1.0)
ui.diagnostic_highlight_blend_weight = 0.45
ui.element_gap = auto
ui.outline_thickness = 2
# Where Escape in a focused panel returns focus, per app mode: editor (the active pane) or previous
# (whatever had focus before the panel)
ui.panel.escape_returns_to.code = editor
ui.panel.escape_returns_to.prose = editor
# Command runner rows and spacing; auto follows the interface density and the window height
ui.command_runner.visible_rows = auto
ui.command_runner.item_gap_rows = auto
ui.command_runner.cursor_gap_rows = auto
ui.command_runner.show_key_hints = true
# Hold or double-tap a bare modifier to peek the command runner near the cursor
ui.command_runner.cursor_peek.enabled = false
ui.command_runner.cursor_peek.modifier = meta
ui.command_runner.cursor_peek.tap_window_ms = 200
ui.command_runner.cursor_peek.placement = belowcursor
ui.render.fps = 60
# Damage granularity the renderer honours: rows redraws whole visible lines; cells honours column ranges on
# monospaced buffers only, falling back to rows for proportional or ligature-shaped text
ui.render.damage_granularity = rows
# Per-cache capacity for the renderer's bounded frame-state caches (issue #1433). Default 64 suits a
# single window; raise it for a session with many concurrently open surfaces.
ui.render.cache_capacity = 64
# Cache modal/panel layers between frames instead of repainting them (each holds a full-window image)
ui.render.layer_cache = false
# Log a [FRAME] timing summary (input, render and paint latency) to the app log every 5 seconds
ui.render.frame_timing = false
# Log a [LATENCY] line per keystroke (each stage from key event to paint) and a summary every 5 seconds
ui.render.latency_trace = false
# After the first frame, briefly exercise typing and drawing off-screen so early keystrokes are not slow
startup.warm_up = true

# Window chrome: auto uses themed chrome on Linux; native preserves OS snap/window animations; native-themed uses Windows system chrome colours; custom is themed and applies after restart
window.chrome = auto
# Preferred desktop window size. Leave empty to use the default.
window.preferred.width = ""
window.preferred.height = ""
# Editor viewport as a share of the window, with optional caps in cells
window.viewport.width_percent = 100.0
window.viewport.width_max = ""
window.viewport.height_percent = 100.0
window.viewport.height_max = ""

# LSP server overrides

# Spell-checking for prose buffers
spellcheck.enabled = true
spellcheck.languages = ["en-GB"]
spellcheck.dictionary_paths = []
spellcheck.words = []

# Hotkey overrides
hotkey.save = ["ctrl+s"]
hotkey.quit = ["ctrl+q", "eof"]
hotkey.undo = ["ctrl+z"]
hotkey.redo = ["ctrl+y", "ctrl+shift+z"]
hotkey.copy = ["ctrl+c"]
hotkey.paste = ["ctrl+v"]
hotkey.cut = ["ctrl+x"]
hotkey.select_all = ["ctrl+a"]
hotkey.toggle_syntax_highlighting = ["ctrl+shift+h"]
hotkey.open_file = ["ctrl+o"]
hotkey.command_palette = ["ctrl+p", "ctrl+ctrl"]
hotkey.contextual_toolbar = ["ctrl+shift+t"]
hotkey.new_tab = ["ctrl+t"]
hotkey.close_tab = ["ctrl+w"]
hotkey.split_pane_horizontal = ["ctrl+d"]
hotkey.split_pane_vertical = ["ctrl+shift+d"]
hotkey.close_pane = ["ctrl+shift+w"]
hotkey.file_search = ["ctrl+shift+f"]
hotkey.go_to_file = ["ctrl+e"]
hotkey.next_tab = ["ctrl+tab"]
hotkey.previous_tab = ["ctrl+shift+tab", "ctrl+reverse-tab"]
hotkey.move_tab_left = ["ctrl+shift+pageup"]
hotkey.move_tab_right = ["ctrl+shift+pagedown"]
hotkey.find = ["ctrl+f"]
hotkey.replace = ["ctrl+h"]
hotkey.go_to_line = ["ctrl+g"]
hotkey.save_as = ["ctrl+shift+s"]
hotkey.toggle_shortcuts_help = ["f1"]
hotkey.focus_left = ["alt+left"]
hotkey.focus_right = ["alt+right"]
hotkey.focus_up = ["alt+up"]
hotkey.focus_down = ["alt+down"]
hotkey.toggle_chapter_ghosts = ["ctrl+shift+g"]
hotkey.open_chapter_note = ["ctrl+shift+n"]
hotkey.toggle_notes_pin = ["ctrl+shift+l"]

# Keys for any palette command, by its id: hotkey.command.<id> = ["ctrl+alt+k"]; [] unbinds it
hotkey.command.bold = ["ctrl+b"]
hotkey.command.italic = ["ctrl+i"]
hotkey.command.underline = ["ctrl+u"]

# Focused keymap overrides
keymap.editor.page_down = pagedown
keymap.editor.extend_selection_left = "shift+left"
keymap.editor.extend_selection_right = "shift+right"
keymap.editor.extend_selection_up = "shift+up"
keymap.editor.extend_selection_down = "shift+down"
keymap.command_runner.submit = enter
keymap.modal.dismiss = escape
