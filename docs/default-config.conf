# Serenity Editor Configuration
config.version = 2

# Workspace: code or prose mode (filters which settings are shown and gates code-only tooling: LSP,
# project build/run/test/debug), and pane layout
workspace.mode = code
# Show every setting regardless of the mode filter above
workspace.show_all_settings = false
workspace.minimum_pane_width = 50

# Saving: write a file's unsaved changes to the file itself. off, after-delay, on-focus-change (switching
# buffers or leaving the window) or on-window-change (leaving the window)
files.auto_save = off
# Milliseconds after the last edit that after-delay waits before saving (at least 100)
files.auto_save_delay_ms = 1000

# Editor: what the text area shows
editor.syntax_highlighting = false
editor.smart_punctuation = false
# Large files: a file above warn_above_chars opens with a warning; above tooling_off_above_chars (while
# optimizations is on) it also goes without language servers and spell check
editor.large_file.optimizations = true
editor.large_file.warn_above_chars = 5000000
editor.large_file.tooling_off_above_chars = 20000000
# Indentation: the width of a tab, and whether Tab inserts spaces (true) or a tab character (false)
editor.tab_size = 4
editor.insert_spaces = true
editor.word_wrap = true
# A scrollbar in each editor pane: a thin overlay in the window, the last column in a terminal
editor.scrollbar = false
# The tab strip: auto shows it once two or more files are open, off never does
editor.tab_strip = off
editor.visual_line_navigation = true
# Keep the cursor's line vertically centred (typewriter scrolling), padding past the document's end
editor.typewriter_scrolling = false
# E-reader-style column layout: as many columns as fit the target width (in cells) plus the gap between them. Only takes effect while word wrap is also on
editor.column_mode = false
editor.column_target_width = 80
editor.column_gap = 2
editor.column_count = auto
editor.line_numbers = false
# Line-number placement (left, right, both) and cell spacing: margin from the panel edge to the counter, padding between the counter and the content
editor.line_number_side = left
editor.line_number_margin_left = auto
editor.line_number_margin_right = 0
editor.line_number_padding = auto
# Where document comments are shown: floating, margin
editor.comments = floating
editor.pane_headers = false
editor.focused_text_body = false
editor.contextual_toolbar = true
editor.contextual_toolbar_mode = icon-and-text
# Lines one mouse-wheel notch scrolls
editor.wheel_scroll_lines = 3
# Cursor: blink or steady; colour overrides leave empty to use the active theme cursor
editor.cursor.mode = blink
editor.cursor.active_color = ""
editor.cursor.inactive_color = ""
# Milliseconds the caret blinks without input before it holds solid; 0 blinks for as long as focused
editor.cursor.blink_timeout_ms = 10000
# Markdown rendering mode: source, split-preview, live-preview, read
editor.markdown_view = source
# Default mode for new buffers: plain-text, markdown, rich-text
editor.default_document_mode = plain-text
# Word-count goal for the active document; auto means no goal is set
document.word_goal = auto
# Name new comments and replies are written under; auto uses the operating system's user name
document.comment_author = auto
# Multi-line drop caps: render a drop-cap paragraph's first character as a large, multi-line glyph
document.drop_caps_enabled = true
# Room between the ink of a drop cap's glyph and the text beside it, in em of the body font (0-2)
document.drop_cap_gap = 0.25
# Drop cap colour: text, heading (what headings.colour gives a level 1 heading), accent or #RRGGBB
document.drop_cap_colour = accent
# Show a chapter note's overview, faded, under an empty chapter when a session starts
document.chapter_ghosts = true
# Milliseconds edits must pause before spell check re-analyses the document and the outline re-parses
document.analysis_debounce_ms = 150
document.outline_debounce_ms = 150
# Text area insets as percentages of the central workspace
editor.text_area.left = 0.0
editor.text_area.right = 0.0
editor.text_area.top = 0.0
editor.text_area.bottom = 0.0

# Status line: comma-separated segments (position, title, language, mode, word_count, char_count,
# reading_time) or off; placement pinned (a row under the workspace), floating (a quiet row that follows the
# caret) or off. Colour and alpha overrides leave empty/auto to use the active theme's panel colours.
status.segments = "position, language, title, mode"
status.placement = off
status.foreground_color = ""
status.background_color = ""
status.background_alpha = auto

# Typography
typography.prose.family = SansSerif
typography.code.family = "Monaspace Neon (Bundled)"
typography.ui.family = SansSerif
typography.prose.size = 12.0
typography.code.size = 12.0
typography.ui.size = 12.0
typography.prose.ligatures = true
typography.code.ligatures = true
typography.ui.ligatures = false
# Prose line length in characters (e.g. 66ch) while the workspace is in prose mode, or off
typography.prose.measure = off
# How all text adapts to the display: auto, manual (uses the factor below), off
typography.scale.mode = auto
typography.scale.factor = 1.0

# Export and print typography (separate from the screen): preset smf-courier; paper letter or a4;
# font size, line spacing (a multiple), margin and first-line indent in points, or auto for the preset's
export.typography.preset = smf-courier
export.typography.paper = letter
export.typography.font_size = auto
export.typography.line_spacing = auto
export.typography.margin = auto
export.typography.first_line_indent = auto

# Headings: each level's size is a multiple of the body size, and every setting is auto (the default look)
# unless set. Bold and italic take auto, true or false; align takes auto, left, centre, right or justify.
# Colour takes auto (follow headings.colour), text, heading (the theme's heading colour) or #RRGGBB.
# A paragraph's own alignment still wins. space_before and space_after are the room above the first line and
# below the last line of a heading, in em of its own font size (0-8, auto is none); a terminal rounds them to
# whole rows. No space is added above the first line of a document or a page.
headings.h1.size = auto
headings.h1.bold = auto
headings.h1.italic = auto
headings.h1.family = auto
headings.h1.colour = auto
headings.h1.align = auto
headings.h1.space_before = auto
headings.h1.space_after = auto
headings.h2.size = auto
headings.h2.bold = auto
headings.h2.italic = auto
headings.h2.family = auto
headings.h2.colour = auto
headings.h2.align = auto
headings.h2.space_before = auto
headings.h2.space_after = auto
headings.h3.size = auto
headings.h3.bold = auto
headings.h3.italic = auto
headings.h3.family = auto
headings.h3.colour = auto
headings.h3.align = auto
headings.h3.space_before = auto
headings.h3.space_after = auto
headings.h4.size = auto
headings.h4.bold = auto
headings.h4.italic = auto
headings.h4.family = auto
headings.h4.colour = auto
headings.h4.align = auto
headings.h4.space_before = auto
headings.h4.space_after = auto
headings.h5.size = auto
headings.h5.bold = auto
headings.h5.italic = auto
headings.h5.family = auto
headings.h5.colour = auto
headings.h5.align = auto
headings.h5.space_before = auto
headings.h5.space_after = auto
headings.h6.size = auto
headings.h6.bold = auto
headings.h6.italic = auto
headings.h6.family = auto
headings.h6.colour = auto
headings.h6.align = auto
headings.h6.space_before = auto
headings.h6.space_after = auto
# headings.colour is auto (rich-text headings in the text colour, Markdown headings in the heading colour),
# text or heading, for both kinds of document.
headings.colour = auto
# Above a body of damping_threshold points (before any device scale) heading sizes grow more slowly
headings.damping = true
headings.damping_threshold = 24.0

# Chapter openings: the first paragraph after each chapter title (and, per scene_break, after a scene
# break) can be set off. enabled is off by default. letter is drop, raised or hybrid (a raised letter
# that sinks hybrid_sink_lines, 2-6, lines); raised_row is grow or clamp; small_caps sets the first line
# in small capitals. epigraph is auto, never or marker (only paragraphs carrying epigraph_marker); a
# scene_break is none, small-caps or full; hand_drop_cap, for an opening that already has a hand-made
# drop cap, is hand, hand-small-caps or opening. A document can override every one of these.
openings.enabled = false
openings.letter = drop
openings.raised_row = grow
openings.hybrid_sink_lines = 2
openings.small_caps = false
openings.epigraph = auto
openings.epigraph_marker = epigraph
openings.scene_break = none
openings.hand_drop_cap = hand

# Look: interface density (compact, comfortable, spacious)
ui.density = comfortable
# How strongly a misspelled-word/diagnostic highlight's severity colour shows through (0.0-1.0)
ui.diagnostic_highlight_blend_weight = 0.45
# File dialogs for open and save: auto uses the system dialog unless GTK's schemas are missing (which would
# crash the app), then Swing's own; native always uses the system dialog; swing never does. Needs a restart
ui.file_dialog = auto
ui.element_gap = auto
ui.outline_thickness = 2
# Layout: minimal starts with line numbers, pane headers, the status bar, the tab strip and the scrollbar
# all off, conventional with all of them on. It only chooses what those start as: any of their own keys
# (editor.line_numbers, editor.pane_headers, status.placement, editor.tab_strip, editor.scrollbar) you
# set anywhere in this file still wins
ui.layout = minimal
# Menu bar in the desktop window: hidden (every command stays in the command runner), alt (shown while Alt
# is tapped on its own) or visible (always shown). Applies after restart
ui.menu_bar = hidden
# Hold a chord to show hidden chrome for as long as it is held: the modifiers below with the letter of the
# element (line numbers, status bar, tab strip, scrollbar, pane headers). Press the lock key while holding it
# to keep the element shown; press the chord again to hide it. A letter set to off has no chord. The
# terminal cannot see a key released, so there the chord shows and locks, and pressing it again hides
ui.summon.modifiers = "alt+shift"
ui.summon.lock = space
ui.summon.line_numbers = l
ui.summon.status_bar = s
ui.summon.tab_strip = t
ui.summon.scrollbar = b
ui.summon.pane_headers = h
# Where Escape in a focused panel returns focus, per app mode: editor (the active pane) or previous
# (whatever had focus before the panel)
ui.panel.escape_returns_to.code = editor
ui.panel.escape_returns_to.prose = editor
# Command runner rows and spacing; auto follows the interface density and the window height
ui.command_runner.visible_rows = auto
ui.command_runner.item_gap_rows = auto
ui.command_runner.cursor_gap_rows = auto
ui.command_runner.show_key_hints = true
# Hold or double-tap a bare modifier to peek the command runner near the cursor
ui.command_runner.cursor_peek.enabled = false
ui.command_runner.cursor_peek.modifier = meta
ui.command_runner.cursor_peek.tap_window_ms = 200
ui.command_runner.cursor_peek.placement = belowcursor
ui.render.fps = 60
# Damage granularity the renderer honours: rows redraws whole visible lines; cells honours column ranges on
# monospaced buffers only, falling back to rows for proportional or ligature-shaped text
ui.render.damage_granularity = rows
# Per-cache capacity for the renderer's bounded frame-state caches (issue #1433). Default 64 suits a
# single window; raise it for a session with many concurrently open surfaces.
ui.render.cache_capacity = 64
# Cache modal/panel layers between frames instead of repainting them (each holds a full-window image)
ui.render.layer_cache = false
# Log a [FRAME] timing summary (input, render and paint latency) to the app log every 5 seconds
ui.render.frame_timing = false
# Log a [LATENCY] line per keystroke (each stage from key event to paint) and a summary every 5 seconds
ui.render.latency_trace = false
# After the first frame, briefly exercise typing and drawing off-screen so early keystrokes are not slow
startup.warm_up = true
# Return unused heap to the operating system sooner (smaller idle memory, a little more collector work).
# Applies at startup, so a change needs a restart. Under G1 it sets MinHeapFreeRatio=10, MaxHeapFreeRatio=30
# and G1PeriodicGCInterval=30000; false leaves the JVM's launch values alone.
performance.memory.compact = true

# Window chrome: auto uses themed chrome on Linux; native preserves OS snap/window animations; native-themed uses Windows system chrome colours; custom is themed and applies after restart
window.chrome = auto
# Preferred desktop window size. Leave empty to use the default.
window.preferred.width = ""
window.preferred.height = ""
# Editor viewport as a share of the window, with optional caps in cells
window.viewport.width_percent = 100.0
window.viewport.width_max = ""
window.viewport.height_percent = 100.0
window.viewport.height_max = ""

# Theme: follow the operating system's light, dark or high-contrast setting (off by default). When on, the
# theme is re-checked at startup and on window focus; picking a theme by hand turns it off
theme.follow_system = false
theme.light = light
theme.dark = dark
theme.high_contrast = high-contrast

# LSP server overrides

# Spell-checking for prose buffers
spellcheck.enabled = true
spellcheck.languages = ["en-GB"]
spellcheck.dictionary_paths = []
spellcheck.words = []

# Hotkey overrides: only the bindings you changed are listed, as hotkey.<action> = ["ctrl+alt+k"];
# anything not listed keeps its default, and [] unbinds an action

# Keys for any palette command, by its id: hotkey.command.<id> = ["ctrl+alt+k"]; [] unbinds it

# Focused keymap overrides
keymap.editor.page_down = pagedown
keymap.editor.extend_selection_left = "shift+left"
keymap.editor.extend_selection_right = "shift+right"
keymap.editor.extend_selection_up = "shift+up"
keymap.editor.extend_selection_down = "shift+down"
keymap.command_runner.submit = enter
keymap.modal.dismiss = escape
