# Serenity Editor Configuration
config.version = 1

# Character animation style: none, quick, smooth, subtle, custom
character.animation.preset = none

# Syntax highlighting: true, false
syntax.highlighting = false

# Font configuration
font.code.family = "Monaspace Neon (Bundled)"
font.text.family = SansSerif
font.ui.family = SansSerif
font.code.size = 12.0
font.text.size = 12.0
font.ui.size = 12.0
font.scale.mode = auto
font.text_scale = 1.0
font.code.ligatures = true
font.text.ligatures = true
font.ui.ligatures = false

# Cursor colour overrides. Leave empty to use the active theme cursor.
cursor.mode = blink
cursor.active.color = ""
cursor.inactive.color = ""
# Comma-separated segment list (title, position, word_count, char_count, reading_time), or off/empty to hide
cursor.info_bar.segments = off
cursor.info_bar.placement = floating

# Interface density: compact, comfortable, spacious
interface.density = comfortable
# Window chrome: auto uses themed chrome on Linux; native preserves OS snap/window animations; native-themed uses Windows system chrome colours; custom is themed and applies after restart
window.chrome = auto
window.sitter.enabled = true
window.sitter.action = pulse
window.sitter.frames = ["·", "o", "O", "o"]
window.sitter.active_ticks = 8
window.sitter.fast_active_ticks = 16
window.sitter.fast_typing_threshold_ms = 150
# Companion sprite: a small pixel-art character idling in a pinned pane
companion.sprite.enabled = false
companion.sprite.character = pixel-wizard
companion.sprite.position = right
companion.sprite.size = 10
# Visual flair tier for purely decorative extras (companion sprite, background blur): full, reduced, off
visual.flair.level = full
ui.element_gap = 0.0
ui.corner_radius = 8
ui.outline_thickness = 2
command_runner.visible_rows = auto
command_runner.item_gap_rows = 0.0
command_runner.cursor_gap_rows = auto
command_runner.show_key_hints = true
# Hold or double-tap a bare modifier to peek the command runner near the cursor
command_runner.cursor_peek.enabled = false
command_runner.cursor_peek.modifier = meta
command_runner.cursor_peek.tap_window_ms = 200
command_runner.cursor_peek.placement = belowcursor
render.fps = 60
# Damage granularity the renderer honours: rows redraws whole visible lines; cells honours column ranges on
# monospaced buffers only, falling back to rows for proportional or ligature-shaped text
render.damage_granularity = rows
# Cursor info bar background alpha (0.0-1.0), overriding the active theme's own panel alpha for just that
# panel. auto/default keeps the theme's alpha.
display.cursor_info_bar_background_alpha = auto
display.word_wrap = true
display.visual_line_navigation = true
display.line_numbers = true
display.gutter = true
display.word_count = false
# Where document comments are shown: floating, margin
display.comments = floating
display.pane_headers = true
display.focused_text_body = false
display.contextual_toolbar = true
display.contextual_toolbar_mode = icon-and-text

# UI material and motion presets: solid, clear, frosted, crystal, custom / reduced, subtle, smooth, expressive, custom
ui.material = frosted
# Post-processing: off, scanlines, glow, scanlines-glow
ui.post_processing = off
# Draw soft shadows behind menus and panels
ui.shadows = true
# Background treatment behind panes: solid, transparent, frosted, glass-like
ui.background_style = frosted
# Blur strength behind translucent surfaces (0.0-1.0)
ui.blur_radius = 0.18
ui.motion.preset = smooth
ui.motion.accessibility = standard
ui.motion.family.cursor.enabled = true
ui.motion.family.cursor.transition = fade
ui.motion.family.cursor.animation.preset = smooth
ui.motion.family.cursor.speed_scale = 1.0
ui.motion.family.editor_text.enabled = true
ui.motion.family.editor_text.transition = fade
ui.motion.family.editor_text.animation.preset = smooth
ui.motion.family.editor_text.speed_scale = 1.0
ui.motion.family.command_surfaces.enabled = true
ui.motion.family.command_surfaces.transition = fade
ui.motion.family.command_surfaces.animation.preset = smooth
ui.motion.family.command_surfaces.speed_scale = 1.0
ui.motion.family.pinned_panels.enabled = true
ui.motion.family.pinned_panels.transition = outline
ui.motion.family.pinned_panels.animation.preset = smooth
ui.motion.family.pinned_panels.speed_scale = 1.0
ui.motion.family.pinned_panels.open_transition = outline
ui.motion.family.pinned_panels.close_transition = fade
ui.motion.family.ui_transitions.enabled = true
ui.motion.family.ui_transitions.transition = fade
ui.motion.family.ui_transitions.animation.preset = smooth
ui.motion.family.ui_transitions.speed_scale = 1.0

# Markdown rendering mode: source, split-preview, inline-lens
document.markdown_view = source

# Default mode for new buffers: plain-text, markdown, rich-text
document.default_mode = plain-text

editor.minimum_pane_width = 50
# Lines one mouse-wheel notch scrolls
input.wheel_scroll_lines = 3

# Preferred desktop window size. Leave empty to use the default.
window.preferred.width = ""
window.preferred.height = ""

# Text area insets as percentages of the central workspace.
text_area.left.percent = 0.0
text_area.right.percent = 0.0
text_area.top.percent = 0.0
text_area.bottom.percent = 0.0
viewport.width.percent = 100.0
viewport.width.max = ""
viewport.height.percent = 100.0
viewport.height.max = ""

# LSP server overrides

# Spell-checking for prose buffers
spellcheck.enabled = false
spellcheck.languages = ["en"]
spellcheck.dictionary_paths = []
spellcheck.words = []

# Hotkey overrides
hotkey.save = ["ctrl+s"]
hotkey.quit = ["ctrl+q", "eof"]
hotkey.undo = ["ctrl+z"]
hotkey.redo = ["ctrl+y"]
hotkey.copy = ["ctrl+c"]
hotkey.paste = ["ctrl+v"]
hotkey.cut = ["ctrl+x"]
hotkey.select_all = ["ctrl+a"]
hotkey.toggle_syntax_highlighting = ["ctrl+shift+h"]
hotkey.open_file = ["ctrl+o"]
hotkey.command_palette = ["ctrl+p", "ctrl+ctrl"]
hotkey.contextual_toolbar = ["ctrl+shift+t"]
hotkey.new_tab = ["ctrl+t"]
hotkey.close_tab = ["ctrl+w"]
hotkey.file_search = ["ctrl+shift+f"]
hotkey.next_tab = ["ctrl+tab"]
hotkey.previous_tab = ["ctrl+shift+tab", "ctrl+reverse-tab"]
hotkey.find = ["ctrl+f"]
hotkey.replace = ["ctrl+h"]
hotkey.go_to_line = ["ctrl+g"]
hotkey.save_as = ["ctrl+shift+s"]
hotkey.toggle_shortcuts_help = ["f1"]

# Focused keymap overrides
keymap.editor.page_down = pagedown
keymap.editor.extend_selection_left = "shift+left"
keymap.editor.extend_selection_right = "shift+right"
keymap.editor.extend_selection_up = "shift+up"
keymap.editor.extend_selection_down = "shift+down"
keymap.command_runner.submit = enter
keymap.modal.dismiss = escape
