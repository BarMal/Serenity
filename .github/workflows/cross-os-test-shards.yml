name: Cross-OS Test Shards

# One operating system's share of `sbt test`, split into shards that run in parallel (#2484). Called by Cross-OS Tests,
# whose "Test (windows)" and "Test (macos)" jobs wait for these and keep the check names branch protection lists (#2016).
# A shard runs the suites project/test-shards.tsv gives it (project/TestShards.scala); a suite the table does not list is
# placed by a hash of its name, so every suite runs in exactly one shard.
#
# Compiling the 1,100 main and 1,670 test sources takes 14 minutes of a 38-minute macOS job and needs about 3.2 GB of the
# 4 GB heap, so one `compile` job per OS does it once and the shards restore its output. The zinc analysis in that output
# is keyed by content, not by file times (checked by restoring it onto sources and dependency jars given new times:
# nothing recompiled), and runner paths are the same from job to job on one OS. If a restore ever did not match, sbt
# recompiles what changed, which is slower but correct; the shard says so in a warning.
on:
  workflow_call:
    inputs:
      os:
        description: Runner label, for example macos-latest
        required: true
        type: string
      label:
        description: Short OS name used in job and artifact names
        required: true
        type: string
      jvm_opts:
        description: Extra JVM options appended to SBT_OPTS, for example -Xmx5g, to compare GC behaviour
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  compile:
    name: Compile (${{ inputs.label }})
    runs-on: ${{ inputs.os }}
    timeout-minutes: 50

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: sbt

      - name: Set up sbt launcher
        uses: sbt/setup-sbt@v1

      - name: Compile main and test sources
        shell: bash
        # A compile that hangs holds a runner as a hanging test does, so it gets the same thread dump and stop.
        env:
          HANG_MINUTES: '40'
        run: bash .github/scripts/run-tests-with-hang-dump.sh sbt -v Test/compile

      # One archive instead of thousands of class files, so the upload is a single file and keeps the file times the
      # analysis was written with.
      - name: Archive the build output
        shell: bash
        run: tar cf compiled.tar target project/target

      - name: Upload the build output
        uses: actions/upload-artifact@v4
        with:
          name: compiled-${{ inputs.label }}
          path: compiled.tar
          retention-days: 1

  test-shard:
    name: Test (${{ inputs.label }}, shard ${{ matrix.shard }}/2)
    needs: compile
    runs-on: ${{ inputs.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: sbt

      - name: Set up sbt launcher
        uses: sbt/setup-sbt@v1

      # Tests run inside sbt's own JVM (no `fork`), so SBT_OPTS reaches them. GC and safepoint logs plus the stall
      # sampler's file (StallSampler) let a test that overshot its budget (#2016) be matched to a whole-JVM stall by
      # wall-clock time. Written outside target/ so extracting the build output into target/ cannot touch it.
      - name: Enable JVM stall diagnostics
        shell: bash
        # The extra options come last, so an -Xmx there wins over the one in .jvmopts.
        env:
          EXTRA_JVM_OPTS: ${{ inputs.jvm_opts }}
        run: |
          mkdir -p jvm-diag
          echo "SBT_OPTS=-Xlog:gc*,safepoint:file=jvm-diag/gc-safepoint.log:time,uptime,level,tags -Dserenity.test.stallLog=jvm-diag/stalls.log $EXTRA_JVM_OPTS" >> "$GITHUB_ENV"
          echo "SERENITY_TEST_SHARD=${{ matrix.shard }}/2" >> "$GITHUB_ENV"

      - name: Download the build output
        uses: actions/download-artifact@v4
        with:
          name: compiled-${{ inputs.label }}

      - name: Restore the build output
        shell: bash
        run: |
          tar xf compiled.tar
          rm compiled.tar

      # Costs a launcher start when the restore matched. When it did not, sbt recompiles here, under the hang guard and
      # before the tests start, and the warning names it.
      - name: Check the restored build output
        shell: bash
        env:
          HANG_MINUTES: '40'
        run: |
          bash .github/scripts/run-tests-with-hang-dump.sh sbt -v Test/compile 2>&1 | tee restore-check.log
          if grep -q 'compiling [0-9]* Scala source' restore-check.log; then
            echo "::warning::The restored build output did not match, so this shard recompiled; see the compiling lines above."
          fi

      # Whether a slow macOS run was paging is not visible in the JVM's own logs: the 7 GB runner holds the heap, metaspace
      # and Skia's native memory, and nothing else records free memory or swap. Detached so it outlives this step; the
      # runner removes it when the job ends. Windows and Linux runners have 16 GB and are left alone.
      - name: Sample OS memory
        if: runner.os == 'macOS'
        shell: bash
        run: nohup bash .github/scripts/sample-os-memory.sh loop jvm-diag 30 > /dev/null 2>&1 &

      - name: Run tests
        shell: bash
        # Fails with a thread dump after HANG_MINUTES instead of holding the runner for 6 hours on a hang. The script's
        # default of 40 stops a run that takes 39 minutes, so the limit is raised to sit inside the job's 60.
        env:
          HANG_MINUTES: '52'
        run: bash .github/scripts/run-tests-with-hang-dump.sh sbt -v test

      # The console log names only the failing suites (see build.sbt's Test/testOptions), so the failing tests, their
      # messages and the cancelled ones go into the step summary and one annotation each (#2557). The reports are
      # uploaded below. `python3` is not on every Windows image's PATH, hence the fallback.
      - name: Summarise test failures
        if: always()
        shell: bash
        run: |
          PYTHON="$(command -v python3 || command -v python)"
          "$PYTHON" scripts/summarize_test_failures.py target/test-reports --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ inputs.label }}-${{ matrix.shard }}
          path: target/test-reports/**
          if-no-files-found: ignore
          retention-days: 14

      # The reports above cannot be read from every environment either, so the slowest suites go into the log.
      - name: Summarise slowest test suites
        if: always()
        shell: bash
        run: bash .github/scripts/summarize-test-durations.sh target/test-reports 30 | tee -a "$GITHUB_STEP_SUMMARY"

      # The artifact below cannot be read from every environment, so the headline numbers go into the log as well.
      - name: Summarise JVM stall diagnostics
        if: always()
        shell: bash
        run: bash .github/scripts/summarize-jvm-diag.sh jvm-diag | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload JVM stall diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-diag-${{ inputs.label }}-${{ matrix.shard }}
          path: jvm-diag/**
          if-no-files-found: ignore
          retention-days: 7
