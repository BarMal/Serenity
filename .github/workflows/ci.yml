name: CI

on:
  # ready_for_review re-runs CI when a draft is marked ready, which is what starts Auto Squash Merge.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - master
  # Nightly on master, so the benchmarks still see master when no pull request carries the `perf` label (#2553).
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request supersedes its older runs; cancelling them frees runners (macOS especially) for current
# heads. Master pushes are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The source checks share one job: each is cheap, and a job slot is what the shared runner cap rations (#2553 item 6).
  # Every check after the first runs even when an earlier one failed, so one red check never hides another.
  checks:
    name: Style, architecture and notices
    runs-on: ubuntu-latest
    # The folded style job alone ran 8.7 min median, 15.4 p90 (#2553); this bounds a hang, not a normal run.
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: sbt

      - name: Set up sbt launcher
        uses: sbt/setup-sbt@v1

      - name: Apply scalafmt and scalafix
        run: sbt -v scalafmtAll "Compile / scalafix" "Test / scalafix"

      # Every test suite must run in exactly one Windows/macOS shard, and the shard table must not list a suite that no
      # longer exists (#2484).
      - name: Check the test shard table
        if: ${{ !cancelled() }}
        run: sbt -v checkTestShards

      - name: Check style tasks did not change files
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          if ! git diff --exit-code; then
            echo "::error::Style tasks changed files. Run 'sbt scalafmtAll \"Compile / scalafix\" \"Test / scalafix\"' locally and commit the result."
            exit 1
          fi

      # Reads sources directly rather than compiling. It failed silently for many commits because nothing ran it --
      # that is the reason CI runs it.
      - name: Check file and method size ratchet
        if: ${{ !cancelled() }}
        run: sbt -v architectureCheck

      # The ratchet above stops individual entries regressing, but a deliberate `writeArchitectureBaseline`
      # re-run can still grow the file (new entry, or a worsened one) without anyone having to justify it --
      # see issue #1413. This makes that growth visible and requires a same-diff justification for it.
      - name: Report architecture baseline size
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          read -r COUNT SUM < <(awk -F'\t' '
            /^[[:space:]]*#/ {next}
            NF==0 {next}
            NF==3 {count++; sum+=$3}
            END{printf "%d %d\n", count+0, sum+0}
          ' project/architecture-baseline.tsv)
          echo "Architecture baseline: $COUNT entries, $SUM total lines/hits over target." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Require justification for baseline growth
        if: github.event_name == 'pull_request' && !cancelled()
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          git fetch --depth=1 origin "$BASE_SHA"

          stats() {
            awk -F'\t' '
              /^[[:space:]]*#/ {next}
              NF==0 {next}
              NF==3 {count++; sum+=$3}
              END{printf "%d %d\n", count+0, sum+0}
            '
          }

          read -r BASE_COUNT BASE_SUM < <(git show "$BASE_SHA:project/architecture-baseline.tsv" | stats)
          read -r HEAD_COUNT HEAD_SUM < <(stats < project/architecture-baseline.tsv)
          echo "base: $BASE_COUNT entries / $BASE_SUM total  |  head: $HEAD_COUNT entries / $HEAD_SUM total"

          if [ "$HEAD_COUNT" -gt "$BASE_COUNT" ] || [ "$HEAD_SUM" -gt "$BASE_SUM" ]; then
            if ! git diff "$BASE_SHA" HEAD -- project/architecture-baseline.tsv | grep -q '^+# paydown:'; then
              echo "::error file=project/architecture-baseline.tsv::Baseline grew ($BASE_COUNT -> $HEAD_COUNT entries, $BASE_SUM -> $HEAD_SUM total) without a justification. Add a '# paydown: <why, issue link>' comment line to project/architecture-baseline.tsv explaining the new or worsened entry, then commit it alongside the change."
              exit 1
            fi
          fi

      # Reads the compiler's semanticdb output, so it reuses the classes the style step compiled. It fails on an edge from a
      # lower layer to a higher one that project/module-graph-baseline.tsv does not list (#2502).
      - name: Check module-graph ratchet
        if: ${{ !cancelled() }}
        run: sbt -v moduleGraphCheck

      - name: Require justification for module-graph baseline growth
        if: github.event_name == 'pull_request' && !cancelled()
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          git fetch --depth=1 origin "$BASE_SHA"
          python3 -m scripts.module_graph_baseline_growth "$BASE_SHA"

      # Fails when a runtime dependency has no entry in third-party/modules.tsv, or THIRD-PARTY-NOTICES.md is stale (#2019).
      - name: Check third-party notices cover every runtime dependency
        if: ${{ !cancelled() }}
        run: sbt -v checkThirdPartyNotices

  scripts:
    name: Script tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Stdlib `unittest`, no Python dependency. One module per line, sorted, so pull requests adding one merge cleanly;
      # scripts.test_ci_workflow fails if a test module is left out, listed twice or out of order.
      - name: Test the scripts
        run: |
          python3 -m unittest \
            scripts.test_abba_compare \
            scripts.test_abba_startup \
            scripts.test_aot_cache_scripts \
            scripts.test_aot_macos_workflow \
            scripts.test_aot_workflow \
            scripts.test_apt_install \
            scripts.test_bench_artifacts_workflow \
            scripts.test_bench_laptop \
            scripts.test_bench_scaling \
            scripts.test_build_outputs \
            scripts.test_check_no_dng \
            scripts.test_check_perf_regression \
            scripts.test_ci_apt_workflow \
            scripts.test_ci_jobs_workflow \
            scripts.test_ci_log_is_quiet \
            scripts.test_ci_workflow \
            scripts.test_collapsed_top_frames \
            scripts.test_combine_perf_runs \
            scripts.test_compare_perf_runs \
            scripts.test_cross_os_nightly_gate \
            scripts.test_cross_os_workflow \
            scripts.test_desktop_publish_workflow \
            scripts.test_footprint_parse \
            scripts.test_hang_dump_script \
            scripts.test_hyprland_float \
            scripts.test_key_to_screen_summary \
            scripts.test_linux_only_ci \
            scripts.test_merge_train \
            scripts.test_module_graph_baseline_growth \
            scripts.test_perf_matrix \
            scripts.test_perf_nightly \
            scripts.test_present_abba_summary \
            scripts.test_pull_nightly \
            scripts.test_regenerate_base_cds_archive \
            scripts.test_run_perf_benchmark \
            scripts.test_sample_os_memory \
            scripts.test_smoke_test_app_image \
            scripts.test_startup_rows \
            scripts.test_startup_spread \
            scripts.test_startup_variance \
            scripts.test_study_perf_gate \
            scripts.test_summarize_jvm_diag \
            scripts.test_summarize_test_durations \
            scripts.test_summarize_test_failures \
            scripts.test_ttfw \
            scripts.test_workflow_sbt_project_scope \
            scripts.test_workflow_timeouts \
            -v

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: sbt

      - name: Set up sbt launcher
        uses: sbt/setup-sbt@v1

      # Tests run inside sbt's own JVM (no `fork`), so SBT_OPTS reaches them. GC and safepoint logs plus the stall
      # sampler's file (StallSampler) let a test that overshot its budget (#2016) be matched to a whole-JVM stall by
      # wall-clock time. Written outside target/ because `clean` deletes that directory.
      - name: Enable JVM stall diagnostics
        shell: bash
        run: |
          mkdir -p jvm-diag
          echo "SBT_OPTS=-Xlog:gc*,safepoint:file=jvm-diag/gc-safepoint.log:time,uptime,level,tags -Dserenity.test.stallLog=jvm-diag/stalls.log" >> "$GITHUB_ENV"

      # Ten specs `assume` a display and were cancelled on this headless runner, so nothing on Linux ran them. The perf
      # job's virtual display, at a size that fits its largest window, lets them run; the one test that needs AWT to be
      # headless is excluded here and run by the real-boundary job (`headlessAwtTest`).
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run tests
        # Fails with a thread dump after 40 minutes instead of holding the runner for 6 hours on a hang.
        run: xvfb-run -a -s "-screen 0 1920x1200x24" sbt -v writeFrameCountBaseline

      - name: Upload regenerated baseline
        uses: actions/upload-artifact@v4
        with:
          name: frame-counts-linux
          path: src/test/resources/perf/frame-counts.tsv

      # The console log names only the failing suites (see the -u note in build.sbt), so the failing tests and their
      # messages go into the step summary and one annotation each (#2557).
      - name: Summarise test failures
        if: always()
        run: python3 scripts/summarize_test_failures.py target/test-reports --summary "$GITHUB_STEP_SUMMARY"

      # The JUnit XML is the only place a property failure's shrunk arguments and Init Seed survive in full.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-linux
          path: target/test-reports/**
          if-no-files-found: ignore
          retention-days: 14

      # The artifact below cannot be read from every environment, so the headline numbers go into the log as well.
      - name: Summarise JVM stall diagnostics
        if: always()
        shell: bash
        run: bash .github/scripts/summarize-jvm-diag.sh jvm-diag | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload JVM stall diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-diag-linux
          path: jvm-diag/**
          if-no-files-found: ignore
          retention-days: 7

      # `sbt test` excludes these specs (a real loopback socket, a real OS signal; #2030) and the heap-measurement ones
      # (they read the JVM-wide heap and force collections, which stalls and skews any suite beside them). Each runs in
      # its own sbt after the suite, on the classes it compiled, and after the suite's GC log is uploaded: a new sbt
      # JVM rewrites that file.
      - name: Run real-OS-boundary specs
        if: ${{ !cancelled() }}
        run: sbt -v realBoundaryTest

      - name: Run heap-measurement specs
        if: ${{ !cancelled() }}
        run: sbt -v heapMeasurementTest

  sdl-native:
    name: SDL3 binding against the real library
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: sbt

      - name: Set up sbt launcher
        uses: sbt/setup-sbt@v1

      - name: Build libSDL3
        id: sdl3
        uses: ./.github/actions/build-sdl3

      # ci/sdl3/layout.c prints the offsets and constants of the pinned SDL headers; the Scala binding is held against
      # the checked-in copy (SdlLayoutsSpec), so this keeps that copy honest when the pin moves.
      - name: Check the struct layouts against the SDL headers
        run: |
          cc -I "${{ steps.sdl3.outputs.directory }}/include" -o "$RUNNER_TEMP/sdl3-layout" ci/sdl3/layout.c
          "$RUNNER_TEMP/sdl3-layout" | diff -u src/test/resources/sdl3/layout.txt -

      # The GL specs run on SDL's offscreen driver, which makes an EGL context from Mesa's software rasteriser.
      # The runner cannot always resolve the Ubuntu mirrors (#2618, [ci-apt]): the downloaded packages are cached per runner
      # image and package list, and a miss fetches with retries and timeouts (ci/apt/install-packages.sh).
      - name: Name the Mesa EGL packages and the runner image
        id: mesa
        run: |
          packages="libegl1 libgl1 libgl1-mesa-dri libgles2 sway"
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          echo "packages-hash=$(printf '%s' "$packages" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Cache the Mesa EGL packages
        id: mesa-cache
        uses: actions/cache@v4
        with:
          path: ~/apt-archives/*.deb
          key: mesa-egl-${{ steps.mesa.outputs.image }}-${{ steps.mesa.outputs.packages-hash }}

      - name: Install Mesa EGL for the GL specs
        run: ci/apt/install-packages.sh "$HOME/apt-archives" "${{ steps.mesa-cache.outputs.cache-hit }}" ${{ steps.mesa.outputs.packages }}

      # `sbt test` excludes these specs (they load the library built above, on SDL's dummy and offscreen drivers).
      - name: Run the SDL native specs
        run: sbt -v -Dserenity.sdl3.library.path="${{ steps.sdl3.outputs.directory }}" sdlNativeTest

      # The same specs again with a Wayland compositor present (headless sway), so the GL window host also opens on a
      # real Wayland surface instead of canceling that spec.
      - name: Run the SDL native specs on a headless Wayland compositor
        run: ci/sdl3/with-sway.sh sbt -v -Dserenity.sdl3.library.path="${{ steps.sdl3.outputs.directory }}" sdlNativeTest

      # `sbt test` excludes these: every leg of it has a display, so a test that needs AWT to be headless was cancelled
      # on all of them. This runner has none; the flag makes that explicit rather than inferred.
      - name: Run headless-AWT specs
        env:
          SBT_OPTS: -Djava.awt.headless=true
        run: sbt -v headlessAwtTest

  perf:
    # The suite runs as two shards (contiguous slices of the suite, each judged on its own rows, see BenchmarkShard).
    # This job is the 1x pair; the 2x HiDPI pair is perf-2x below, which is gated differently.
    #
    # The timeout is a bound on a stuck job, not a budget. The unsharded 1x job took 57.3 and 58.3 minutes on runs
    # 41350271015 and 41350357868 (the benchmark warm-up on both sides, and a confirmation run of 4 minutes when a row is
    # flagged), against the previous limit of 60; 75 is the limit the owner chose for the sharded jobs (#2464).
    # Drafts skip the benchmark shards; marking a pull request ready runs them (owner decision, #2484). Once the merge
    # train is live it benchmarks each batch instead, so a pull request runs them only with the `perf` label, read at
    # its next push (#2553 item 2).
    if: (github.event_name != 'pull_request' || (!github.event.pull_request.draft && vars.MERGE_TRAIN_MODE != 'live') || contains(github.event.pull_request.labels.*.name, 'perf'))
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Performance benchmarks (shard 1/2)
            scale: 1
            screen: 1920x1200x24
            dpi: 96
            shard: 1/2
            results: perf-benchmark-results-shard-1
          - label: Performance benchmarks (shard 2/2)
            scale: 1
            screen: 1920x1200x24
            dpi: 96
            shard: 2/2
            results: perf-benchmark-results-shard-2

    steps:
      # Depth 2 so the base commit -- the PR merge commit's first parent, or master's previous commit -- is present.
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: sbt

      - name: Set up sbt launcher
        uses: sbt/setup-sbt@v1

      # The benchmark suite builds a real `SwingWindow` (`PerformanceBenchmarks.main`'s `SwingWindow.resource`), which
      # needs a display even though nothing is ever shown on screen -- a runner with no X server at all raises
      # `HeadlessException` constructing it, so this job needs a virtual one.
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # Absolute timings only compare on the same machine: GitHub's runners differ by about 2x, so a baseline recorded
      # on one runner and checked on another fails or passes by which runner each got. Instead the base commit and this
      # commit are benchmarked here, on one runner, in three back-to-back pairs that alternate which side goes first
      # (B H, H B, B H), so a slow spell on the runner or a warm cache falls on both sides alike.
      # A merge train's tip names the master commit it was built on, which is what its batch is measured against (#2553).
      - name: Check out the base commit
        shell: bash
        run: |
          set -euo pipefail
          base="$(python3 scripts/merge_train.py perf-base)"
          if [ "$base" != "HEAD^1" ]; then git fetch --depth=1 origin "$base"; fi
          git worktree add --detach "$RUNNER_TEMP/base" "$base"

      # The first benchmark run on each side compiles the whole project, about 400 s apiece (#2618). Both compiles run
      # here at once, which costs about one of them; no benchmark starts until both are done, so no measurement shares
      # the runner with a compile. A failed compile is only logged: the run below fails the way it always did, with the
      # head's raw output shown.
      - name: Compile base and head side by side
        shell: bash
        run: |
          (cd "$RUNNER_TEMP/base" && sbt -v Test/compile) > "$RUNNER_TEMP/compile-base.log" 2>&1 &
          base_compile=$!
          sbt -v Test/compile > "$RUNNER_TEMP/compile-head.log" 2>&1 &
          head_compile=$!
          wait "$base_compile" || echo "::warning::The base compile failed; its log tail follows."
          wait "$head_compile" || echo "::warning::The head compile failed; its log tail follows."
          for side in base head; do
            echo "::group::Compile of the $side, last lines"
            tail -n 5 "$RUNNER_TEMP/compile-$side.log"
            echo "::endgroup::"
          done

      # `PerformanceBenchmarks` (src/test/scala/com/serenity/perf) is a manual `main`-method runner, not a ScalaTest
      # suite -- `sbt test` never touches it.
      - name: Run performance benchmarks on base and head
        shell: bash
        env:
          SCREEN: ${{ matrix.screen }}
          DPI: ${{ matrix.dpi }}
          SCALE: ${{ matrix.scale }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          mkdir -p perf-runs
          for pair in 1 2 3; do
            if [ $((pair % 2)) -eq 1 ]; then first=base; second=head; else first=head; second=base; fi
            for side in "$first" "$second"; do
              if [ "$side" = base ]; then dir="$RUNNER_TEMP/base"; else dir="."; fi
              bash .github/scripts/run-perf-benchmark.sh "$dir" "perf-runs/$side-$pair.csv"
              if [ "$side" = head ] && [ ! -s "perf-runs/head-$pair.csv" ]; then
                echo "::error::No benchmark output from the head commit's run $pair -- it did not build or the suite failed; stopping before the remaining passes. Raw output:"
                tail -n 60 "perf-runs/head-$pair.csv.raw"
                exit 1
              fi
            done
          done

      # A benchmark whose fastest head p50 is past 1.5x the fastest base p50 (and more than 50 us above it) is only flagged here:
      # the same runner re-measures just those benchmarks in three fresh pairs (confirm-*), and the build fails only if
      # they are still past the threshold on those. A retained-heap regression fails at once. See
      # scripts/compare_perf_runs.py, and docs/performance-benchmarks.md ("Paired-ratio gate", #1731).
      - name: Check for a performance regression
        shell: bash
        env:
          SCREEN: ${{ matrix.screen }}
          DPI: ${{ matrix.dpi }}
          SCALE: ${{ matrix.scale }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          for run in perf-runs/head-1.csv perf-runs/head-2.csv perf-runs/head-3.csv; do
            if [ ! -s "$run" ]; then
              echo "::error::No benchmark output in $run -- the suite failed on this commit; see $run.raw:"
              tail -n 60 "$run.raw"
              exit 1
            fi
          done
          status=0
          python3 scripts/compare_perf_runs.py \
            --base perf-runs/base-1.csv perf-runs/base-2.csv perf-runs/base-3.csv \
            --head perf-runs/head-1.csv perf-runs/head-2.csv perf-runs/head-3.csv \
            --write-flagged perf-runs/flagged.txt || status=$?
          if [ "$status" -ne 2 ]; then exit "$status"; fi
          echo "::group::Confirming $(wc -l < perf-runs/flagged.txt) flagged benchmark(s) on fresh pairs"
          cat perf-runs/flagged.txt
          mapfile -t flagged < perf-runs/flagged.txt
          for pair in 1 2 3; do
            if [ $((pair % 2)) -eq 1 ]; then first=base; second=head; else first=head; second=base; fi
            for side in "$first" "$second"; do
              if [ "$side" = base ]; then dir="$RUNNER_TEMP/base"; else dir="."; fi
              bash .github/scripts/run-perf-benchmark.sh "$dir" "perf-runs/confirm-$side-$pair.csv" "${flagged[@]}"
            done
          done
          echo "::endgroup::"
          python3 scripts/compare_perf_runs.py \
            --base perf-runs/confirm-base-1.csv perf-runs/confirm-base-2.csv perf-runs/confirm-base-3.csv \
            --head perf-runs/confirm-head-1.csv perf-runs/confirm-head-2.csv perf-runs/confirm-head-3.csv \
            --only perf-runs/flagged.txt

      - name: Archive benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.results }}
          path: perf-runs/
          retention-days: 90

  perf-2x:
    # The same two shards at 2x: a HiDPI virtual display with Java2D at 2x, matching the target laptop, so Swing's present
    # path paints at the scale users actually see. They cost two jobs and about 40 minutes per batch, so they run nightly
    # on master and on pull requests that carry the `perf` label, not on merge trains, master pushes or unlabelled pull
    # requests (owner decision, #2618). A failed nightly run is written on #2643, since nobody opens a red scheduled run.
    # Keep the steps identical to perf's: scripts/test_ci_workflow.py fails when they drift.
    #
    # The timeout is a bound on a stuck job, not a budget. The unsharded 1x job took 57.3 and 58.3 minutes on runs
    # 41350271015 and 41350357868 (the benchmark warm-up on both sides, and a confirmation run of 4 minutes when a row is
    # flagged), against the previous limit of 60; 75 is the limit the owner chose for the sharded jobs (#2464).
    # Drafts skip the benchmark shards; marking a pull request ready runs them (owner decision, #2484). Once the merge
    # train is live it benchmarks each batch instead, so a pull request runs them only with the `perf` label, read at
    # its next push (#2553 item 2).
    if: (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/heads/train/')) || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'perf')))
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Performance benchmarks (2x HiDPI, shard 1/2)
            scale: 2
            screen: 3840x2400x24
            dpi: 192
            shard: 1/2
            results: perf-benchmark-results-2x-shard-1
          - label: Performance benchmarks (2x HiDPI, shard 2/2)
            scale: 2
            screen: 3840x2400x24
            dpi: 192
            shard: 2/2
            results: perf-benchmark-results-2x-shard-2

    steps:
      # Depth 2 so the base commit -- the PR merge commit's first parent, or master's previous commit -- is present.
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: sbt

      - name: Set up sbt launcher
        uses: sbt/setup-sbt@v1

      # The benchmark suite builds a real `SwingWindow` (`PerformanceBenchmarks.main`'s `SwingWindow.resource`), which
      # needs a display even though nothing is ever shown on screen -- a runner with no X server at all raises
      # `HeadlessException` constructing it, so this job needs a virtual one.
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # Absolute timings only compare on the same machine: GitHub's runners differ by about 2x, so a baseline recorded
      # on one runner and checked on another fails or passes by which runner each got. Instead the base commit and this
      # commit are benchmarked here, on one runner, in three back-to-back pairs that alternate which side goes first
      # (B H, H B, B H), so a slow spell on the runner or a warm cache falls on both sides alike.
      # A merge train's tip names the master commit it was built on, which is what its batch is measured against (#2553).
      - name: Check out the base commit
        shell: bash
        run: |
          set -euo pipefail
          base="$(python3 scripts/merge_train.py perf-base)"
          if [ "$base" != "HEAD^1" ]; then git fetch --depth=1 origin "$base"; fi
          git worktree add --detach "$RUNNER_TEMP/base" "$base"

      # The first benchmark run on each side compiles the whole project, about 400 s apiece (#2618). Both compiles run
      # here at once, which costs about one of them; no benchmark starts until both are done, so no measurement shares
      # the runner with a compile. A failed compile is only logged: the run below fails the way it always did, with the
      # head's raw output shown.
      - name: Compile base and head side by side
        shell: bash
        run: |
          (cd "$RUNNER_TEMP/base" && sbt -v Test/compile) > "$RUNNER_TEMP/compile-base.log" 2>&1 &
          base_compile=$!
          sbt -v Test/compile > "$RUNNER_TEMP/compile-head.log" 2>&1 &
          head_compile=$!
          wait "$base_compile" || echo "::warning::The base compile failed; its log tail follows."
          wait "$head_compile" || echo "::warning::The head compile failed; its log tail follows."
          for side in base head; do
            echo "::group::Compile of the $side, last lines"
            tail -n 5 "$RUNNER_TEMP/compile-$side.log"
            echo "::endgroup::"
          done

      # `PerformanceBenchmarks` (src/test/scala/com/serenity/perf) is a manual `main`-method runner, not a ScalaTest
      # suite -- `sbt test` never touches it.
      - name: Run performance benchmarks on base and head
        shell: bash
        env:
          SCREEN: ${{ matrix.screen }}
          DPI: ${{ matrix.dpi }}
          SCALE: ${{ matrix.scale }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          mkdir -p perf-runs
          for pair in 1 2 3; do
            if [ $((pair % 2)) -eq 1 ]; then first=base; second=head; else first=head; second=base; fi
            for side in "$first" "$second"; do
              if [ "$side" = base ]; then dir="$RUNNER_TEMP/base"; else dir="."; fi
              bash .github/scripts/run-perf-benchmark.sh "$dir" "perf-runs/$side-$pair.csv"
              if [ "$side" = head ] && [ ! -s "perf-runs/head-$pair.csv" ]; then
                echo "::error::No benchmark output from the head commit's run $pair -- it did not build or the suite failed; stopping before the remaining passes. Raw output:"
                tail -n 60 "perf-runs/head-$pair.csv.raw"
                exit 1
              fi
            done
          done

      # A benchmark whose fastest head p50 is past 1.5x the fastest base p50 (and more than 50 us above it) is only flagged here:
      # the same runner re-measures just those benchmarks in three fresh pairs (confirm-*), and the build fails only if
      # they are still past the threshold on those. A retained-heap regression fails at once. See
      # scripts/compare_perf_runs.py, and docs/performance-benchmarks.md ("Paired-ratio gate", #1731).
      - name: Check for a performance regression
        shell: bash
        env:
          SCREEN: ${{ matrix.screen }}
          DPI: ${{ matrix.dpi }}
          SCALE: ${{ matrix.scale }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          for run in perf-runs/head-1.csv perf-runs/head-2.csv perf-runs/head-3.csv; do
            if [ ! -s "$run" ]; then
              echo "::error::No benchmark output in $run -- the suite failed on this commit; see $run.raw:"
              tail -n 60 "$run.raw"
              exit 1
            fi
          done
          status=0
          python3 scripts/compare_perf_runs.py \
            --base perf-runs/base-1.csv perf-runs/base-2.csv perf-runs/base-3.csv \
            --head perf-runs/head-1.csv perf-runs/head-2.csv perf-runs/head-3.csv \
            --write-flagged perf-runs/flagged.txt || status=$?
          if [ "$status" -ne 2 ]; then exit "$status"; fi
          echo "::group::Confirming $(wc -l < perf-runs/flagged.txt) flagged benchmark(s) on fresh pairs"
          cat perf-runs/flagged.txt
          mapfile -t flagged < perf-runs/flagged.txt
          for pair in 1 2 3; do
            if [ $((pair % 2)) -eq 1 ]; then first=base; second=head; else first=head; second=base; fi
            for side in "$first" "$second"; do
              if [ "$side" = base ]; then dir="$RUNNER_TEMP/base"; else dir="."; fi
              bash .github/scripts/run-perf-benchmark.sh "$dir" "perf-runs/confirm-$side-$pair.csv" "${flagged[@]}"
            done
          done
          echo "::endgroup::"
          python3 scripts/compare_perf_runs.py \
            --base perf-runs/confirm-base-1.csv perf-runs/confirm-base-2.csv perf-runs/confirm-base-3.csv \
            --head perf-runs/confirm-head-1.csv perf-runs/confirm-head-2.csv perf-runs/confirm-head-3.csv \
            --only perf-runs/flagged.txt

      - name: Archive benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.results }}
          path: perf-runs/
          retention-days: 90

      # A red scheduled run is one nobody opens, so a failed nightly 2x shard also lands on the ledger issue (#2643).
      - name: Report a failed nightly 2x run
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHARD: ${{ matrix.label }}
          RESULTS: ${{ matrix.results }}
          COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment 2643 --body "$SHARD failed on the nightly run of $COMMIT: $RUN_URL . The flagged rows are in that step's log and in the $RESULTS artifact."

  # GITHUB_TOKEN-created runs raise no workflow_run event, so a train's own CI and Cross-OS runs cannot wake the merge
  # train when they finish. This last job does, on train branches only; the token may start a workflow_dispatch run.
  wake-train:
    name: Wake the merge train
    needs: [checks, scripts, test, sdl-native, perf, perf-2x]
    if: always() && startsWith(github.ref, 'refs/heads/train/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Start a merge train step
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # A dispatch can meet a GitHub API error (HTTP 500 on train 17), and a red wake job reddens its whole run.
        run: |
          for attempt in 1 2 3 4; do
            gh workflow run merge-train.yml --ref master && exit 0
            echo "::warning::Starting a merge train step failed (try $attempt of 4)"
            [ "$attempt" -lt 4 ] && sleep $((attempt * 5))
          done
          exit 1
