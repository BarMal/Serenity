name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR supersedes the older run. Auto Squash Merge only acts on a successful run for the PR's
# current head, so cancelling a stale one loses nothing. Master pushes are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  style:
    name: Scalafmt and Scalafix
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt

      - name: Set up sbt launcher
        uses: sbt/setup-sbt@v1

      - name: Apply scalafmt and scalafix
        run: sbt -v scalafmtAll "Compile / scalafix" "Test / scalafix"

      - name: Check style tasks did not change files
        shell: bash
        run: |
          if ! git diff --exit-code; then
            echo "::error::Style tasks changed files. Run 'sbt scalafmtAll \"Compile / scalafix\" \"Test / scalafix\"' locally and commit the result."
            exit 1
          fi

  architecture:
    name: Architecture ratchet
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt

      - name: Set up sbt launcher
        uses: sbt/setup-sbt@v1

      # Reads sources directly rather than compiling, so this is the cheapest job here. It failed
      # silently for many commits because nothing ran it -- that is the reason it is a job now.
      - name: Check file and method size ratchet
        run: sbt -v architectureCheck

      # The ratchet above stops individual entries regressing, but a deliberate `writeArchitectureBaseline`
      # re-run can still grow the file (new entry, or a worsened one) without anyone having to justify it --
      # see issue #1413. This makes that growth visible and requires a same-diff justification for it.
      - name: Report architecture baseline size
        shell: bash
        run: |
          set -euo pipefail
          read -r COUNT SUM < <(awk -F'\t' '
            /^[[:space:]]*#/ {next}
            NF==0 {next}
            NF==3 {count++; sum+=$3}
            END{printf "%d %d\n", count+0, sum+0}
          ' project/architecture-baseline.tsv)
          echo "Architecture baseline: $COUNT entries, $SUM total lines/hits over target." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Require justification for baseline growth
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          git fetch --depth=1 origin "$BASE_SHA"

          stats() {
            awk -F'\t' '
              /^[[:space:]]*#/ {next}
              NF==0 {next}
              NF==3 {count++; sum+=$3}
              END{printf "%d %d\n", count+0, sum+0}
            '
          }

          read -r BASE_COUNT BASE_SUM < <(git show "$BASE_SHA:project/architecture-baseline.tsv" | stats)
          read -r HEAD_COUNT HEAD_SUM < <(stats < project/architecture-baseline.tsv)
          echo "base: $BASE_COUNT entries / $BASE_SUM total  |  head: $HEAD_COUNT entries / $HEAD_SUM total"

          if [ "$HEAD_COUNT" -gt "$BASE_COUNT" ] || [ "$HEAD_SUM" -gt "$BASE_SUM" ]; then
            if ! git diff "$BASE_SHA" HEAD -- project/architecture-baseline.tsv | grep -q '^+# paydown:'; then
              echo "::error file=project/architecture-baseline.tsv::Baseline grew ($BASE_COUNT -> $HEAD_COUNT entries, $BASE_SUM -> $HEAD_SUM total) without a justification. Add a '# paydown: <why, issue link>' comment line to project/architecture-baseline.tsv explaining the new or worsened entry, then commit it alongside the change."
              exit 1
            fi
          fi

  third-party-notices:
    name: Third-party notices
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt

      - name: Set up sbt launcher
        uses: sbt/setup-sbt@v1

      # Fails when a runtime dependency has no entry in third-party/modules.tsv, or THIRD-PARTY-NOTICES.md is stale (#2019).
      - name: Check third-party notices cover every runtime dependency
        run: sbt -v checkThirdPartyNotices

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt

      - name: Set up sbt launcher
        uses: sbt/setup-sbt@v1

      - name: Run tests
        run: sbt -v clean test

  perf:
    # The 2x entry runs the suite on a HiDPI virtual display with Java2D at 2x, matching the target laptop, so Swing's
    # present path paints at the scale users actually see.
    name: ${{ matrix.scale == 1 && 'Performance benchmarks' || 'Performance benchmarks (2x HiDPI)' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - scale: 1
            screen: 1920x1200x24
            dpi: 96
            results: perf-benchmark-results
          - scale: 2
            screen: 3840x2400x24
            dpi: 192
            results: perf-benchmark-results-2x

    steps:
      # Depth 2 so the base commit -- the PR merge commit's first parent, or master's previous commit -- is present.
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt

      - name: Set up sbt launcher
        uses: sbt/setup-sbt@v1

      # Stdlib `unittest`, no Python dependency to install.
      - name: Test the benchmark comparison scripts
        run: python3 -m unittest scripts.test_check_perf_regression scripts.test_combine_perf_runs -v

      # The benchmark suite builds a real `SwingWindow` (`PerformanceBenchmarks.main`'s `SwingWindow.resource`), which
      # needs a display even though nothing is ever shown on screen -- a runner with no X server at all raises
      # `HeadlessException` constructing it, so this job needs a virtual one.
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # Absolute timings only compare on the same machine: GitHub's runners differ by about 2x, so a baseline recorded
      # on one runner and checked on another fails or passes by which runner each got. Instead the base commit and this
      # commit are benchmarked here, on one runner, twice each in ABBA order so a slow spell on the runner hits both.
      # A benchmark fails only when every head run is past the threshold against every base run -- the head's fastest
      # against the base's slowest (`combine_perf_runs.py`) -- since some swing 2x between runs of one commit.
      - name: Check out the base commit
        run: git worktree add --detach "$RUNNER_TEMP/base" HEAD^1

      # `PerformanceBenchmarks` (src/test/scala/com/serenity/perf) is a manual `main`-method runner, not a ScalaTest
      # suite -- `sbt test` never touches it.
      - name: Run performance benchmarks on base and head
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p perf-runs
          # sbt prefixes every line of runMain's stdout with "[info] " and `sbt -v` wraps it in ANSI colour escapes;
          # strip both, keeping from the suite's own title line onward so earlier sbt log noise is excluded. A run that
          # crashes leaves an empty CSV, which the combine step skips or reports.
          bench() {
            local dir="$1" out="$2"
            (cd "$dir" && xvfb-run -a -s "-screen 0 ${{ matrix.screen }} -dpi ${{ matrix.dpi }}" \
              sbt -v 'set Test / run / javaOptions += "-Dsun.java2d.uiScale=${{ matrix.scale }}"' \
              "Test/runMain com.serenity.perf.PerformanceBenchmarks") > "$out.raw" 2>&1 || true
            sed -E 's/\x1b\[[0-9;]*[a-zA-Z]//g' "$out.raw" \
              | sed -n '/^\[info\] Serenity performance benchmarks$/,$p' \
              | sed 's/^\[info\] //' > "$out"
            echo "$out: $(grep -c . "$out" || true) lines"
          }
          # ABBA order, so whatever favours the first or last run of the job (warm caches, runner drift) falls on both
          # sides equally instead of always on the base.
          bench "$RUNNER_TEMP/base" perf-runs/base-1.csv
          bench . perf-runs/head-1.csv
          bench . perf-runs/head-2.csv
          bench "$RUNNER_TEMP/base" perf-runs/base-2.csv

      - name: Check for a performance regression
        run: |
          set -euo pipefail
          for run in perf-runs/head-1.csv perf-runs/head-2.csv; do
            if [ ! -s "$run" ]; then
              echo "::error::No benchmark output in $run -- the suite failed on this commit; see $run.raw:"
              tail -n 60 "$run.raw"
              exit 1
            fi
          done
          python3 scripts/combine_perf_runs.py --pick slowest perf-base.csv perf-runs/base-1.csv perf-runs/base-2.csv
          python3 scripts/combine_perf_runs.py perf-results.csv perf-runs/head-1.csv perf-runs/head-2.csv
          python3 scripts/check_perf_regression.py perf-base.csv perf-results.csv --threshold 2.0

      - name: Archive benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.results }}
          path: |
            perf-results.csv
            perf-base.csv
            perf-runs/
          retention-days: 90
