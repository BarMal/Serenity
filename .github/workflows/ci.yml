name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  style:
    name: Scalafmt and Scalafix
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt

      - name: Set up sbt launcher
        uses: sbt/setup-sbt@v1

      - name: Apply scalafmt and scalafix
        run: sbt -v scalafmtAll "Compile / scalafix" "Test / scalafix"

      - name: Check style tasks did not change files
        shell: bash
        run: |
          if ! git diff --exit-code; then
            echo "::error::Style tasks changed files. Run 'sbt scalafmtAll \"Compile / scalafix\" \"Test / scalafix\"' locally and commit the result."
            exit 1
          fi

  architecture:
    name: Architecture ratchet
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt

      - name: Set up sbt launcher
        uses: sbt/setup-sbt@v1

      # Reads sources directly rather than compiling, so this is the cheapest job here. It failed
      # silently for many commits because nothing ran it -- that is the reason it is a job now.
      - name: Check file and method size ratchet
        run: sbt -v architectureCheck

      # The ratchet above stops individual entries regressing, but a deliberate `writeArchitectureBaseline`
      # re-run can still grow the file (new entry, or a worsened one) without anyone having to justify it --
      # see issue #1413. This makes that growth visible and requires a same-diff justification for it.
      - name: Report architecture baseline size
        shell: bash
        run: |
          set -euo pipefail
          read -r COUNT SUM < <(awk -F'\t' '
            /^[[:space:]]*#/ {next}
            NF==0 {next}
            NF==3 {count++; sum+=$3}
            END{printf "%d %d\n", count+0, sum+0}
          ' project/architecture-baseline.tsv)
          echo "Architecture baseline: $COUNT entries, $SUM total lines/hits over target." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Require justification for baseline growth
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          git fetch --depth=1 origin "$BASE_SHA"

          stats() {
            awk -F'\t' '
              /^[[:space:]]*#/ {next}
              NF==0 {next}
              NF==3 {count++; sum+=$3}
              END{printf "%d %d\n", count+0, sum+0}
            '
          }

          read -r BASE_COUNT BASE_SUM < <(git show "$BASE_SHA:project/architecture-baseline.tsv" | stats)
          read -r HEAD_COUNT HEAD_SUM < <(stats < project/architecture-baseline.tsv)
          echo "base: $BASE_COUNT entries / $BASE_SUM total  |  head: $HEAD_COUNT entries / $HEAD_SUM total"

          if [ "$HEAD_COUNT" -gt "$BASE_COUNT" ] || [ "$HEAD_SUM" -gt "$BASE_SUM" ]; then
            if ! git diff "$BASE_SHA" HEAD -- project/architecture-baseline.tsv | grep -q '^+# paydown:'; then
              echo "::error file=project/architecture-baseline.tsv::Baseline grew ($BASE_COUNT -> $HEAD_COUNT entries, $BASE_SUM -> $HEAD_SUM total) without a justification. Add a '# paydown: <why, issue link>' comment line to project/architecture-baseline.tsv explaining the new or worsened entry, then commit it alongside the change."
              exit 1
            fi
          fi

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt

      - name: Set up sbt launcher
        uses: sbt/setup-sbt@v1

      - name: Run tests
        run: sbt -v clean test

  perf:
    # The 1x entry keeps the original check name and baseline. The 2x entry runs the suite on a HiDPI virtual display
    # with Java2D at 2x, matching the target laptop, so Swing's present path paints at the scale users actually see.
    name: ${{ matrix.scale == 1 && 'Performance benchmarks' || 'Performance benchmarks (2x HiDPI)' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - scale: 1
            screen: 1920x1200x24
            dpi: 96
            baseline: perf-baseline
            results: perf-benchmark-results
          - scale: 2
            screen: 3840x2400x24
            dpi: 192
            baseline: perf-baseline-2x
            results: perf-benchmark-results-2x

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt

      - name: Set up sbt launcher
        uses: sbt/setup-sbt@v1

      # Unit tests for the regression-check script's own logic (threshold comparison, cache-cold handling) --
      # stdlib `unittest`, no Python dependency to install.
      - name: Test the regression-check script
        run: python3 -m unittest scripts.test_check_perf_regression -v

      # The benchmark suite builds a real `SwingWindow` (`PerformanceBenchmarks.main`'s `SwingWindow.resource`), which
      # needs a display even though nothing is ever shown on screen -- a runner with no X server at all raises
      # `HeadlessException` constructing it, so this job needs a virtual one.
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # `PerformanceBenchmarks` (src/test/scala/com/serenity/perf) is a manual `main`-method runner, not a ScalaTest
      # suite -- `sbt test` never touches it. Running it here and archiving its CSV is issue #1453's "at minimum
      # periodically run and archive the CSV output for trend tracking"; the regression check below is its "or wire a
      # subset into CI with a regression threshold" half.
      - name: Run performance benchmarks
        # A screen large enough for `LaptopFrameBenchmarks`' 1500x1000 window; xvfb-run's default is 1280x1024.
        run: >-
          xvfb-run -a -s "-screen 0 ${{ matrix.screen }} -dpi ${{ matrix.dpi }}"
          sbt -v 'set Test / run / javaOptions += "-Dsun.java2d.uiScale=${{ matrix.scale }}"'
          "Test/runMain com.serenity.perf.PerformanceBenchmarks"
          | tee perf-results-raw.txt

      - name: Extract benchmark CSV from sbt output
        shell: bash
        run: |
          set -euo pipefail
          # sbt prefixes every line of runMain's stdout with "[info] "; strip that back off, then keep from the
          # benchmark suite's own title line onward so any earlier sbt log noise is excluded. `sbt -v` also emits ANSI
          # colour escapes around/inside that prefix (e.g. "\e[0m[\e[0minfo\e[0m] \e[0mSerenity ..."), which breaks a
          # plain `[info] ` match -- strip those escapes first.
          sed -E 's/\x1b\[[0-9;]*[a-zA-Z]//g' perf-results-raw.txt \
            | sed -n '/^\[info\] Serenity performance benchmarks$/,$p' \
            | sed 's/^\[info\] //' \
            > perf-results.csv
          if [ ! -s perf-results.csv ]; then
            echo "::error::No benchmark output found in sbt's runMain log -- see perf-results-raw.txt"
            exit 1
          fi

      # A baseline from the *previous* run on this same runner type -- not a value committed to the repo, since an
      # absolute millisecond figure only means anything measured on comparable hardware. Restored (never saved) on a
      # pull request, so a PR is compared against master's last recorded numbers without a PR run ever overwriting
      # them; saved only by a master run, so the baseline only ever advances from a trusted, merged state. Auto Squash
      # Merge merges with the workflow token, whose pushes start no workflows, so it dispatches that master run itself.
      - name: Restore previous benchmark baseline
        id: restore-baseline
        uses: actions/cache/restore@v4
        with:
          path: perf-baseline.csv
          key: ${{ matrix.baseline }}-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ${{ matrix.baseline }}-${{ runner.os }}-

      # A cache-cold run (first run on a branch, or the cache evicted) has no baseline to restore. Only the run that
      # is about to establish a fresh baseline itself -- a push to master, per the steps below -- is allowed to treat
      # that as expected; every other run (in particular a PR) fails loudly instead of silently passing with nothing
      # actually compared.
      - name: Check for a performance regression
        run: |
          set -euo pipefail
          ARGS=(--threshold 2.0)
          if [ "${{ github.event_name }}" != "pull_request" ] && [ "${{ github.ref }}" = "refs/heads/master" ]; then
            ARGS+=(--allow-missing-baseline)
          elif [ "${{ matrix.scale }}" != "1" ] && [ "${{ steps.restore-baseline.outputs.cache-matched-key }}" = "" ]; then
            # The 2x baseline only exists once master has run this entry; until then a PR has nothing to compare.
            echo "::warning::No 2x HiDPI baseline yet; it is recorded by the next push to master."
            ARGS+=(--allow-missing-baseline)
          fi
          python3 scripts/check_perf_regression.py perf-baseline.csv perf-results.csv "${ARGS[@]}"

      - name: Archive benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.results }}
          path: perf-results.csv
          retention-days: 90

      - name: Update benchmark baseline
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        run: cp perf-results.csv perf-baseline.csv

      - name: Save benchmark baseline
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/cache/save@v4
        with:
          path: perf-baseline.csv
          key: ${{ matrix.baseline }}-${{ runner.os }}-${{ github.run_id }}
