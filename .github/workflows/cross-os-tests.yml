name: Cross-OS Tests

# Runs the test suite on Windows and macOS for every pull request and master push. Kept out of the CI workflow while
# known Windows/macOS failures remain (#2016), because Auto Squash Merge merges on CI's overall conclusion; it moves
# into CI once both entries are green.
on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

# A new push to a pull request supersedes its older runs; cancelling them frees runners (macOS especially) for current
# heads. Master pushes are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-cross-os:
    name: Test (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
          - os: macos-latest
            label: macos

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt

      - name: Set up sbt launcher
        uses: sbt/setup-sbt@v1

      - name: Run tests
        shell: bash
        # Fails with a thread dump after 40 minutes instead of holding the runner for 6 hours on a hang.
        run: bash .github/scripts/run-tests-with-hang-dump.sh sbt -v clean test

      # The console log of a Windows/macOS run can drop the assertion text (see build.sbt's Test/testOptions), so the
      # JUnit XML reports are printed and uploaded as well, as Desktop Publish does.
      - name: Print test failure detail
        if: failure()
        shell: bash
        run: |
          set -uo pipefail
          shopt -s nullglob
          for report in target/test-reports/*.xml; do
            if grep -q -e '<failure' -e '<error' "$report"; then
              echo "::group::$report"
              cat "$report"
              echo "::endgroup::"
            fi
          done

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.label }}
          path: target/test-reports/**
          if-no-files-found: ignore
          retention-days: 14

