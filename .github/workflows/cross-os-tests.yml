name: Cross-OS Tests

# Runs the test suite on Windows and macOS for every ready pull request, master pushes, nightly, and on demand. Drafts
# skip it, required checks included, and marking a pull request ready starts it: draft pushes were starving the shared
# runners (owner decision, #2484). Each OS runs its tests as two parallel shards (cross-os-test-shards.yml, #2484); the
# "Test (windows)" and "Test (macos)" jobs below wait for their shards and are what branch protection lists as required
# checks: renaming one un-requires it, so change them only together with the repository's required-check settings (#2016).
# Once the merge train is live (repository variable MERGE_TRAIN_MODE=live) pull requests skip it too: the train runs it
# once per batch on its train/* branch, before anything merges (#2553 item 3).
# Auto Squash Merge waits for these checks before merging, as for every other check on the pull request.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - master
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      jvm_opts:
        description: Extra JVM options appended to SBT_OPTS for this run, for example -Xmx5g, to compare GC behaviour
        required: false
        default: ''

permissions:
  contents: read

# On a pull request only the newest commit matters, so a newer push cancels the older run (macOS runners especially).
# Master, nightly and dispatched runs are never cancelled: cancelling them left master with no completed Windows or macOS
# result after the 11-02 nightly (#2557). GitHub still keeps one waiting run per group and replaces it with a newer one,
# so the nightly has its own group, or a merge would replace it while it waits.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ github.event_name == 'schedule' && '-nightly' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shards-windows:
    if: (github.event_name != 'pull_request' || (!github.event.pull_request.draft && vars.MERGE_TRAIN_MODE != 'live'))
    uses: ./.github/workflows/cross-os-test-shards.yml
    with:
      os: windows-latest
      label: windows
      jvm_opts: ${{ inputs.jvm_opts }}

  shards-macos:
    if: (github.event_name != 'pull_request' || (!github.event.pull_request.draft && vars.MERGE_TRAIN_MODE != 'live'))
    uses: ./.github/workflows/cross-os-test-shards.yml
    with:
      os: macos-latest
      label: macos
      jvm_opts: ${{ inputs.jvm_opts }}

  # Reports each OS's shards as the one required check, passing only when every shard did: a cancelled or skipped shard
  # is not a pass.
  test-windows:
    name: Test (windows)
    needs: shards-windows
    if: always() && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && vars.MERGE_TRAIN_MODE != 'live'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every shard to have passed
        env:
          RESULT: ${{ needs.shards-windows.result }}
        run: test "$RESULT" = success

  test-macos:
    name: Test (macos)
    needs: shards-macos
    if: always() && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && vars.MERGE_TRAIN_MODE != 'live'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every shard to have passed
        env:
          RESULT: ${{ needs.shards-macos.result }}
        run: test "$RESULT" = success
