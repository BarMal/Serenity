name: Cross-OS Tests

# Runs the test suite on Windows and macOS for master pushes, nightly, and on demand. It does not run on pull requests:
# macOS runners are scarce, and Auto Squash Merge waits on every check, so a queued or hung macOS job stalled every PR
# for hours. A Windows/macOS regression shows up on the next master push or nightly run and is fixed forward. Kept out
# of the CI workflow while known Windows/macOS failures remain (#2016).
on:
  push:
    branches:
      - master
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Only the newest master commit matters here; a newer push cancels the older run so runs don't queue behind each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-cross-os:
    name: Test (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
          - os: macos-latest
            label: macos

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt

      - name: Set up sbt launcher
        uses: sbt/setup-sbt@v1

      # Tests run inside sbt's own JVM (no `fork`), so SBT_OPTS reaches them. GC and safepoint logs plus the stall
      # sampler's file (StallSampler) let a test that overshot its budget (#2016) be matched to a whole-JVM stall by
      # wall-clock time. Written outside target/ because `clean` deletes that directory.
      - name: Enable JVM stall diagnostics
        shell: bash
        run: |
          mkdir -p jvm-diag
          echo "SBT_OPTS=-Xlog:gc*,safepoint:file=jvm-diag/gc-safepoint.log:time,uptime,level,tags -Dserenity.test.stallLog=jvm-diag/stalls.log" >> "$GITHUB_ENV"

      - name: Run tests
        shell: bash
        # Fails with a thread dump after 40 minutes instead of holding the runner for 6 hours on a hang.
        run: bash .github/scripts/run-tests-with-hang-dump.sh sbt -v clean test

      # The console log of a Windows/macOS run can drop the assertion text (see build.sbt's Test/testOptions), so the
      # JUnit XML reports are printed and uploaded as well, as Desktop Publish does.
      - name: Print test failure detail
        if: failure()
        shell: bash
        run: |
          set -uo pipefail
          shopt -s nullglob
          for report in target/test-reports/*.xml; do
            if grep -q -e '<failure' -e '<error' "$report"; then
              echo "::group::$report"
              cat "$report"
              echo "::endgroup::"
            fi
          done

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.label }}
          path: target/test-reports/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload JVM stall diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-diag-${{ matrix.label }}
          path: jvm-diag/**
          if-no-files-found: ignore
          retention-days: 7
