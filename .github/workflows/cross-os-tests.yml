name: Cross-OS Tests

# Runs the test suite on Windows and macOS for every ready pull request, master pushes, nightly, and on demand. Drafts
# skip it, required checks included, and marking a pull request ready starts it: draft pushes were starving the shared
# runners (owner decision, #2484). Each OS runs its tests as two parallel shards (cross-os-test-shards.yml, #2484); the
# "Test (windows)" and "Test (macos)" jobs below wait for their shards and are what branch protection lists as required
# checks: renaming one un-requires it, so change them only together with the repository's required-check settings (#2016).
# Auto Squash Merge waits for these checks before merging, as for every other check on the pull request.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - master
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      jvm_opts:
        description: Extra JVM options appended to SBT_OPTS for this run, for example -Xmx5g, to compare GC behaviour
        required: false
        default: ''

permissions:
  contents: read

# Only the newest commit of a branch or pull request matters here; a newer push cancels the older run so runs don't queue
# behind each other (macOS runners especially).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shards-windows:
    if: (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    uses: ./.github/workflows/cross-os-test-shards.yml
    with:
      os: windows-latest
      label: windows
      jvm_opts: ${{ inputs.jvm_opts }}

  shards-macos:
    if: (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    uses: ./.github/workflows/cross-os-test-shards.yml
    with:
      os: macos-latest
      label: macos
      jvm_opts: ${{ inputs.jvm_opts }}

  # Reports each OS's shards as the one required check, passing only when every shard did: a cancelled or skipped shard
  # is not a pass.
  test-windows:
    name: Test (windows)
    needs: shards-windows
    if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every shard to have passed
        env:
          RESULT: ${{ needs.shards-windows.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # `needs` carries one result for all of an OS's shards, not one per shard, so the message points at the run.
        run: |
          if [ "$RESULT" != success ]; then
            echo "::error title=Test (windows)::The shards finished with result '$RESULT'. Look for the jobs named 'Test (windows, shard N/2)' that did not succeed; their step summaries list the failing tests: $RUN_URL"
          fi
          test "$RESULT" = success

  test-macos:
    name: Test (macos)
    needs: shards-macos
    if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every shard to have passed
        env:
          RESULT: ${{ needs.shards-macos.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # `needs` carries one result for all of an OS's shards, not one per shard, so the message points at the run.
        run: |
          if [ "$RESULT" != success ]; then
            echo "::error title=Test (macos)::The shards finished with result '$RESULT'. Look for the jobs named 'Test (macos, shard N/2)' that did not succeed; their step summaries list the failing tests: $RUN_URL"
          fi
          test "$RESULT" = success
