name: nojbr KDT spike (throwaway, never merge)

on:
  workflow_dispatch:
  push:
    branches:
      - ccr-157ed55f-u6khhf-nojbr-kdt-spike

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - name: Install build dependencies
        timeout-minutes: 12
        env: { DEBIAN_FRONTEND: noninteractive, NEEDRESTART_MODE: a }
        run: |
          sudo -E apt-get update -q
          sudo -E apt-get install -y -q --no-install-recommends build-essential pkg-config cmake clang curl git \
            libwayland-dev libxkbcommon-dev libdbus-1-dev libegl1-mesa-dev libgl1-mesa-dev libssl-dev \
            libgtk-3-dev libgtk-4-dev libadwaita-1-dev libglib2.0-dev libcairo2-dev libpango1.0-dev libgdk-pixbuf-2.0-dev libfontconfig-dev
      - name: Rustup
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Clone kotlin-desktop-toolkit and add the spike module
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/JetBrains/kotlin-desktop-toolkit.git kdt
          echo "KDT commit: $(git -C kdt rev-parse HEAD) $(git -C kdt log -1 --format=%cI)" | tee kdt-commit.txt
          echo "rust-toolchain: $(cat kdt/native/rust-toolchain)"
          mkdir -p kdt/spike/src/main/kotlin/org/jetbrains/desktop/sample/linux
          cp bench/nojbr/kdt/KdtSpike.kt kdt/spike/src/main/kotlin/org/jetbrains/desktop/sample/linux/KdtSpike.kt
          cp bench/nojbr/kdt/spike.build.gradle.kts kdt/spike/build.gradle.kts
          printf '\ninclude("spike")\n' >> kdt/settings.gradle.kts
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            kdt/native/target
            ~/.gradle/caches
          key: kdt-build-${{ runner.os }}-${{ hashFiles('kdt-commit.txt') }}
          restore-keys: kdt-build-${{ runner.os }}-
      - name: Build (Rust cdylib + jextract bindings + Kotlin) and print paths
        run: |
          set -o pipefail
          cd kdt
          ./gradlew --no-daemon --no-configuration-cache --console=plain :spike:printKdtPaths 2>&1 | tee ../gradle.log | tail -n 120
      - name: Bundle
        run: |
          set -euo pipefail
          CP="$(grep '^KDT_CP=' gradle.log | head -1 | cut -d= -f2-)"
          NATIVE="$(grep '^KDT_NATIVE=' gradle.log | head -1 | cut -d= -f2-)"
          grep '^KDT_PROFILE=' gradle.log
          mkdir -p bundle/cp bundle/native
          i=0; IFS=':' read -ra ELEMS <<< "$CP"
          for e in "${ELEMS[@]}"; do i=$((i+1)); [ -e "$e" ] || { echo "skip missing $e"; continue; }; if [ -d "$e" ]; then mkdir -p "bundle/cp/${i}-dir"; cp -r "$e"/. "bundle/cp/${i}-dir/"; else cp "$e" "bundle/cp/${i}-$(basename "$e")"; fi; done
          echo "--- native libraries built by the Rust crates"
          find kdt -name 'libdesktop_linux*' -type f -not -path '*/deps/*' -not -path '*/incremental/*' -not -path '*/build/*/*/*.d' | sort | tee native-libs.txt
          # the loader looks for libdesktop_linux_x64.so (release) next to -Dkdt.library.folder.path
          while read -r f; do cp "$f" bundle/native/; done < <(grep -E 'libdesktop_linux_(x64|arm64)(\+debug)?\.so$' native-libs.txt || true)
          if ! ls bundle/native/libdesktop_linux_x64.so >/dev/null 2>&1; then
            f="$(grep -E 'libdesktop_linux\.so$' native-libs.txt | grep -v debug | head -1 || true)"
            [ -n "$f" ] && cp "$f" bundle/native/libdesktop_linux_x64.so
          fi
          echo "--- classpath"; ls -l bundle/cp
          echo "--- native"; ls -l bundle/native
          du -sh bundle bundle/native
          cp kdt-commit.txt bundle/
      - uses: actions/upload-artifact@v4
        with: { name: kdt-bundle, path: bundle, retention-days: 3 }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: kdt-build-log, path: gradle.log, retention-days: 3 }

  gates:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 1080p-s1,  mode: 1920x1080, scale: '1',   debug: '0' }
          - { name: 1080p-s2,  mode: 3840x2160, scale: '2',   debug: '0' }
          - { name: 1440p-s1,  mode: 2560x1440, scale: '1',   debug: '0' }
          - { name: 1440p-s2,  mode: 5120x2880, scale: '2',   debug: '0' }
          - { name: frac-s1.5, mode: 1920x1080, scale: '1.5', debug: '0' }
          - { name: wire-s1.5, mode: 1920x1080, scale: '1.5', debug: '1' }
          - { name: wire-s1,   mode: 1920x1080, scale: '1',   debug: '1' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - uses: actions/download-artifact@v4
        with: { name: kdt-bundle, path: bundle }
      - name: Install
        timeout-minutes: 12
        env: { DEBIAN_FRONTEND: noninteractive, NEEDRESTART_MODE: a }
        run: |
          sudo -E apt-get update -q
          sudo -E apt-get install -y -q --no-install-recommends sway grim wtype wl-clipboard python3-pil gcc libc6-dev libwayland-dev wayland-protocols adwaita-icon-theme libxkbcommon0 libdbus-1-3
      - name: Build the virtual pointer
        run: |
          set -euo pipefail
          cd bench/nojbr/kdt
          curl -fsSL -o wlr-virtual-pointer-unstable-v1.xml https://raw.githubusercontent.com/swaywm/wlr-protocols/master/unstable/wlr-virtual-pointer-unstable-v1.xml
          wayland-scanner client-header wlr-virtual-pointer-unstable-v1.xml wlr-virtual-pointer-unstable-v1-client-protocol.h
          wayland-scanner private-code wlr-virtual-pointer-unstable-v1.xml wlr-virtual-pointer-unstable-v1-protocol.c
          gcc -O1 -o "$GITHUB_WORKSPACE/vptr" vptr.c wlr-virtual-pointer-unstable-v1-protocol.c -lwayland-client
      - name: Run gates (${{ matrix.name }})
        run: |
          mkdir -p out
          export VPTR="$PWD/vptr"
          export APP_LAUNCH='"$JAVA_HOME/bin/java" --enable-native-access=ALL-UNNAMED -Dstdout.encoding=UTF-8 -Dfile.encoding=UTF-8 -Djava.awt.headless=true -Dkdt.library.folder.path='"$PWD"'/bundle/native -Dkdt.native.log.path="$OUT/native.log" -Dspike.out="$OUT" -cp "'"$PWD"'/bundle/cp/*" org.jetbrains.desktop.sample.linux.KdtSpikeKt'
          bash bench/nojbr/kdt/run_gate.sh "$PWD/out/${{ matrix.name }}" "${{ matrix.mode }}" "${{ matrix.scale }}" "${{ matrix.debug }}" 2>&1 | tee "out/${{ matrix.name }}.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'nojbr-kdt-${{ matrix.name }}', path: out, retention-days: 3 }
      - name: Summary (gates)
        if: always()
        run: |
          echo "=== SUMMARY ${{ matrix.name }} ==="
          cat bundle/kdt-commit.txt || true
          grep -E 'JAVA |DRIVER|SCALE|SURFACE|IDLE|GATE1|GATE5|GATE6|GATE4 mouse|TIMING|COEXIST|WARN|FAIL|WIRE count|WIRE set_shape|WIRE sample|sway outputs|text_editing|text_input_availability' "out/${{ matrix.name }}.txt" | sed -E 's/^[0-9TZ:.-]+ //' || true
          echo "repeat-like key downs: $(grep -c 'key down' "out/${{ matrix.name }}/app.log" || true)"
          tail -n 25 "out/${{ matrix.name }}/app.log" || true
          echo "=== END SUMMARY ==="

  ime:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - uses: actions/download-artifact@v4
        with: { name: kdt-bundle, path: bundle }
      - name: Install
        timeout-minutes: 12
        env: { DEBIAN_FRONTEND: noninteractive, NEEDRESTART_MODE: a }
        run: |
          sudo -E apt-get update -q
          sudo -E apt-get install -y -q --no-install-recommends sway grim wtype wl-clipboard fcitx5 fcitx5-chinese-addons dbus-x11 adwaita-icon-theme libxkbcommon0
      - name: Pre-edit from a real input method (fcitx5 + pinyin)
        run: |
          mkdir -p out
          export APP_LAUNCH='"$JAVA_HOME/bin/java" --enable-native-access=ALL-UNNAMED -Dstdout.encoding=UTF-8 -Dfile.encoding=UTF-8 -Djava.awt.headless=true -Dspike.mode=ime -Dkdt.library.folder.path='"$PWD"'/bundle/native -Dkdt.native.log.path="$OUT/native.log" -Dspike.out="$OUT" -cp "'"$PWD"'/bundle/cp/*" org.jetbrains.desktop.sample.linux.KdtSpikeKt'
          bash bench/nojbr/kdt/ime_kdt.sh "$PWD/out/ime" 2>&1 | tee out/ime.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: nojbr-kdt-ime, path: out, retention-days: 3 }
