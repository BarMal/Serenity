name: Typing While Indexing

# Measures how much typing slows while a cold walk of the 100,000-file synthetic tree runs (#2420, item 7). Manual only,
# and it never touches the CI perf gate: it reports numbers and sets no threshold. See TypingWhileIndexingProfile.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to measure
        required: true
        default: master
      keys:
        description: Keystrokes per block; four blocks run (idle, loaded, loaded, idle)
        required: false
        default: '300'

run-name: Typing while indexing for ${{ inputs.ref }}

permissions:
  contents: read

jobs:
  measure:
    name: Measure typing idle and while indexing
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: sbt

      - name: Set up sbt launcher
        uses: sbt/setup-sbt@v1

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Measure
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1920x1200x24" \
            sbt -batch "Test/runMain com.serenity.perf.TypingWhileIndexingProfile --keys=${{ inputs.keys }}" \
            | tee measure.raw
          sed -E 's/\x1b\[[0-9;]*[a-zA-Z]//g; s/^\[info\] //' measure.raw \
            | grep -E '^(typing_while_indexing|tree |RESULT )' > measure.txt
          {
            echo '### Typing idle and while a cold walk runs'
            echo '```'
            cat measure.txt
            echo '```'
            echo "Runner: $(nproc) CPUs, $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | xargs)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the figures
        uses: actions/upload-artifact@v4
        with:
          name: typing-while-indexing
          path: measure.txt
          if-no-files-found: error
