name: Auto Squash Merge

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  checks: read
  contents: write
  pull-requests: write
  statuses: read

concurrency:
  group: auto-squash-merge-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  auto-squash-merge:
    name: Auto squash merge
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Squash merge PR after checks pass
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          REPO: ${{ github.repository }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${PR_NUMBER}" ] || [ "${PR_NUMBER}" = "null" ]; then
            echo "No pull request is associated with this workflow run."
            exit 0
          fi

          pr_json="$(gh pr view "${PR_NUMBER}" --repo "${REPO}" --json headRefOid,isDraft,state,url)"
          pr_state="$(jq -r '.state' <<<"${pr_json}")"
          pr_draft="$(jq -r '.isDraft' <<<"${pr_json}")"
          pr_head_sha="$(jq -r '.headRefOid' <<<"${pr_json}")"
          pr_url="$(jq -r '.url' <<<"${pr_json}")"

          if [ "${pr_state}" != "OPEN" ]; then
            echo "PR ${PR_NUMBER} is ${pr_state}; nothing to merge."
            exit 0
          fi

          if [ "${pr_draft}" = "true" ]; then
            echo "PR ${PR_NUMBER} is a draft; skipping auto-merge."
            exit 0
          fi

          if [ "${pr_head_sha}" != "${WORKFLOW_HEAD_SHA}" ]; then
            echo "Workflow head ${WORKFLOW_HEAD_SHA} is stale for PR head ${pr_head_sha}; skipping."
            exit 0
          fi

          while true; do
            checks_json="$(gh pr checks "${PR_NUMBER}" --repo "${REPO}" --json bucket,name,workflow)"

            failed_checks="$(
              jq -r '.[] | select(.workflow != "Auto Squash Merge" and (.bucket == "fail" or .bucket == "cancel")) | "\(.workflow): \(.name) [\(.bucket)]"' <<<"${checks_json}"
            )"

            if [ -n "${failed_checks}" ]; then
              echo "PR ${PR_NUMBER} has failed or cancelled checks:"
              echo "${failed_checks}"
              exit 1
            fi

            pending_checks="$(
              jq -r '.[] | select(.workflow != "Auto Squash Merge" and .bucket == "pending") | "\(.workflow): \(.name) [\(.bucket)]"' <<<"${checks_json}"
            )"

            if [ -z "${pending_checks}" ]; then
              break
            fi

            echo "PR ${PR_NUMBER} is waiting for checks:"
            echo "${pending_checks}"
            sleep 10
          done

          gh pr merge "${pr_url}" \
            --repo "${REPO}" \
            --squash \
            --delete-branch \
            --match-head-commit "${pr_head_sha}"
