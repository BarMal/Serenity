name: Skiko Natives

# Builds the Skiko natives Serenity ships without the Adobe DNG SDK (#2028): Skia and Skiko from the pinned upstream tags in
# ci/skiko/pins.env, with the reviewed patches beside it. Each build is scanned for DNG, and the scan itself is proved on a
# stock library first. Publishing adds attested jars to the Maven repository on the `skiko-maven` branch, which GitHub Pages
# serves; see DEVELOPMENT.md for the rebuild-on-bump procedure.
#
# A pull request builds all four runner groups (Skia is cached by pin and patch, so a warm run takes about ten minutes); a manual run chooses its targets and whether to publish.
on:
  pull_request:
    paths:
      - '.github/workflows/skiko-natives.yml'
      - 'ci/skiko/**'
      - 'scripts/check_no_dng.py'
  workflow_dispatch:
    inputs:
      groups:
        description: 'Runner groups to build (comma separated: linux-x64, linux-arm64, macos, windows) or all'
        required: true
        default: 'all'
      publish:
        description: 'Attest and publish the result to the skiko-maven branch (needs every group)'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      linux_x64: ${{ steps.pick.outputs.linux_x64 }}
      linux_arm64: ${{ steps.pick.outputs.linux_arm64 }}
      macos: ${{ steps.pick.outputs.macos }}
      windows: ${{ steps.pick.outputs.windows }}
      publish: ${{ steps.pick.outputs.publish }}
    steps:
      - id: pick
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          GROUPS_INPUT: ${{ inputs.groups }}
          PUBLISH_INPUT: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          wanted="linux-x64,linux-arm64,macos,windows"
          if [ "${EVENT}" = workflow_dispatch ]; then wanted="${GROUPS_INPUT}"; fi
          has() { [ "${wanted}" = all ] || [[ ",${wanted// /}," == *",$1,"* ]]; }
          for group in linux-x64 linux-arm64 macos windows; do
            if has "${group}"; then value=true; else value=false; fi
            echo "${group//-/_}=${value}" >> "${GITHUB_OUTPUT}"
          done
          publish=false
          if [ "${EVENT}" = workflow_dispatch ] && [ "${PUBLISH_INPUT}" = true ] && [ "${wanted}" = all ]; then publish=true; fi
          echo "publish=${publish}" >> "${GITHUB_OUTPUT}"

  # Each build job mirrors how JetBrains builds the same artefacts: Skia as in JetBrains/skia's build_for_skiko.yml, then Skiko
  # as in JetBrains/skiko's publish-dry-run.yml (on Linux inside its own Amazon Linux 2 image, so the library keeps its glibc
  # 2.26 compatibility). The Skia archives, what Skiko itself downloads for a stock build, are cached by pin and patch, so
  # a failure in the Skiko step costs minutes. Each build is then scanned (ci/skiko/scan-natives.sh): the scan is first
  # proved on stock libraries, which carry the DNG SDK on Linux and macOS, and only then run on what was just built.
  build-linux-x64:
    name: Build linux-x64
    needs: plan
    if: needs.plan.outputs.linux_x64 == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Free up space on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h
      - name: Fetch Skiko and patch it
        timeout-minutes: 15
        run: ci/skiko/build-natives.sh linux-x64 "$GITHUB_WORKSPACE/work" "$GITHUB_WORKSPACE/repo" fetch-skiko
      - name: Restore the cached Skia archives
        id: skia-cache
        uses: actions/cache/restore@v4
        with:
          path: work/skia-zips
          key: skia-zips-linux-x64-${{ hashFiles('ci/skiko/pins.env', 'ci/skiko/skia-no-dng.patch') }}
      - name: Fetch Skia and patch it
        if: steps.skia-cache.outputs.cache-hit != 'true'
        timeout-minutes: 30
        run: ci/skiko/build-natives.sh linux-x64 "$GITHUB_WORKSPACE/work" "$GITHUB_WORKSPACE/repo" fetch-skia
      - name: Build and archive Skia in ubuntu:20.04
        if: steps.skia-cache.outputs.cache-hit != 'true'
        timeout-minutes: 240
        run: docker run --rm -e DEBIAN_FRONTEND=noninteractive -v "$GITHUB_WORKSPACE:/w" -w /w ubuntu:20.04 bash ci/skiko/build-natives.sh linux-x64 /w/work /w/repo skia-linux-inside
      - name: Save the Skia archives
        if: steps.skia-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: work/skia-zips
          key: skia-zips-linux-x64-${{ hashFiles('ci/skiko/pins.env', 'ci/skiko/skia-no-dng.patch') }}
      - name: Build the image Skiko builds its Linux natives in
        timeout-minutes: 45
        run: docker build -t skiko-linux-compat work/skiko/skiko/docker/linux-compat
      - name: Build the Skiko runtime jars
        timeout-minutes: 90
        run: docker run --rm -v "$GITHUB_WORKSPACE:/w" -w /w skiko-linux-compat bash ci/skiko/build-natives.sh linux-x64 /w/work /w/repo skiko
      - name: Collect the repository tree
        timeout-minutes: 10
        run: ci/skiko/build-natives.sh linux-x64 "$GITHUB_WORKSPACE/work" "$GITHUB_WORKSPACE/repo" collect
      - name: Scan
        timeout-minutes: 20
        run: ci/skiko/scan-natives.sh linux-x64 "$GITHUB_WORKSPACE/repo"
      - uses: actions/upload-artifact@v4
        with:
          name: maven-linux-x64
          path: repo
          if-no-files-found: error

  build-linux-arm64:
    name: Build linux-arm64
    needs: plan
    if: needs.plan.outputs.linux_arm64 == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Free up space on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h
      - name: Fetch Skiko and patch it
        timeout-minutes: 15
        run: ci/skiko/build-natives.sh linux-arm64 "$GITHUB_WORKSPACE/work" "$GITHUB_WORKSPACE/repo" fetch-skiko
      - name: Restore the cached Skia archives
        id: skia-cache
        uses: actions/cache/restore@v4
        with:
          path: work/skia-zips
          key: skia-zips-linux-arm64-${{ hashFiles('ci/skiko/pins.env', 'ci/skiko/skia-no-dng.patch') }}
      - name: Fetch Skia and patch it
        if: steps.skia-cache.outputs.cache-hit != 'true'
        timeout-minutes: 30
        run: ci/skiko/build-natives.sh linux-arm64 "$GITHUB_WORKSPACE/work" "$GITHUB_WORKSPACE/repo" fetch-skia
      - name: Build and archive Skia in ubuntu:20.04
        if: steps.skia-cache.outputs.cache-hit != 'true'
        timeout-minutes: 240
        run: docker run --rm -e DEBIAN_FRONTEND=noninteractive -v "$GITHUB_WORKSPACE:/w" -w /w ubuntu:20.04 bash ci/skiko/build-natives.sh linux-arm64 /w/work /w/repo skia-linux-inside
      - name: Save the Skia archives
        if: steps.skia-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: work/skia-zips
          key: skia-zips-linux-arm64-${{ hashFiles('ci/skiko/pins.env', 'ci/skiko/skia-no-dng.patch') }}
      - name: Build the image Skiko builds its Linux natives in
        timeout-minutes: 45
        run: docker build -t skiko-linux-compat work/skiko/skiko/docker/linux-compat
      - name: Build the Skiko runtime jars
        timeout-minutes: 90
        run: docker run --rm -v "$GITHUB_WORKSPACE:/w" -w /w skiko-linux-compat bash ci/skiko/build-natives.sh linux-arm64 /w/work /w/repo skiko
      - name: Collect the repository tree
        timeout-minutes: 10
        run: ci/skiko/build-natives.sh linux-arm64 "$GITHUB_WORKSPACE/work" "$GITHUB_WORKSPACE/repo" collect
      - name: Scan
        timeout-minutes: 20
        run: ci/skiko/scan-natives.sh linux-arm64 "$GITHUB_WORKSPACE/repo"
      - uses: actions/upload-artifact@v4
        with:
          name: maven-linux-arm64
          path: repo
          if-no-files-found: error

  build-macos:
    name: Build macos
    needs: plan
    if: needs.plan.outputs.macos == 'true'
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
      - name: Install LLVM, as Skiko's own workflow does
        run: brew install llvm
      - name: Fetch Skiko and patch it
        timeout-minutes: 15
        run: ci/skiko/build-natives.sh macos "$GITHUB_WORKSPACE/work" "$GITHUB_WORKSPACE/repo" fetch-skiko
      - name: Restore the cached Skia archives
        id: skia-cache
        uses: actions/cache/restore@v4
        with:
          path: work/skia-zips
          key: skia-zips-macos-${{ hashFiles('ci/skiko/pins.env', 'ci/skiko/skia-no-dng.patch') }}
      - name: Fetch Skia and patch it
        if: steps.skia-cache.outputs.cache-hit != 'true'
        timeout-minutes: 30
        run: ci/skiko/build-natives.sh macos "$GITHUB_WORKSPACE/work" "$GITHUB_WORKSPACE/repo" fetch-skia
      - name: Build and archive Skia
        if: steps.skia-cache.outputs.cache-hit != 'true'
        timeout-minutes: 240
        run: ci/skiko/build-natives.sh macos "$GITHUB_WORKSPACE/work" "$GITHUB_WORKSPACE/repo" skia
      - name: Save the Skia archives
        if: steps.skia-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: work/skia-zips
          key: skia-zips-macos-${{ hashFiles('ci/skiko/pins.env', 'ci/skiko/skia-no-dng.patch') }}
      - name: Build the Skiko runtime jars
        timeout-minutes: 90
        run: ci/skiko/build-natives.sh macos "$GITHUB_WORKSPACE/work" "$GITHUB_WORKSPACE/repo" skiko
      - name: Collect the repository tree
        timeout-minutes: 10
        run: ci/skiko/build-natives.sh macos "$GITHUB_WORKSPACE/work" "$GITHUB_WORKSPACE/repo" collect
      - name: Scan
        timeout-minutes: 20
        run: ci/skiko/scan-natives.sh macos "$GITHUB_WORKSPACE/repo"
      - uses: actions/upload-artifact@v4
        with:
          name: maven-macos
          path: repo
          if-no-files-found: error

  build-windows:
    name: Build windows
    needs: plan
    if: needs.plan.outputs.windows == 'true'
    runs-on: windows-2022
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      SKIKO_VSBT_PATH: C:\Program Files\Microsoft Visual Studio\2022\Enterprise
    steps:
      - run: git config --global core.autocrlf input
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
      - uses: microsoft/setup-msbuild@v1
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MSYS
          update: false
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-libc++
            make
            patch
          path-type: inherit
      - name: Tell the build where MSYS2 is
        run: echo "MSYS2_LOCATION=${{ steps.msys2.outputs.msys2-location }}" >> "$GITHUB_ENV"
      - name: Cache the Vulkan SDK installer
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\VulkanSDK-1.4.357.0.exe
          key: vulkan-sdk-installer-${{ runner.os }}-${{ runner.arch }}-1.4.357.0
      - name: Install the Vulkan SDK, as Skiko's own workflow does
        shell: pwsh
        run: |
          $installer = "$env:RUNNER_TEMP\VulkanSDK-1.4.357.0.exe"
          if (-not (Test-Path $installer)) {
            Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/1.4.357.0/windows/vulkan_sdk.exe?Human=true" -OutFile $installer
          }
          Start-Process -Wait -FilePath $installer -ArgumentList '--accept-licenses', '--default-answer', '--confirm-command', 'install', 'com.lunarg.vulkan.arm64'
          $sdk = "C:\VulkanSDK\1.4.357.0"
          "VULKAN_SDK=$sdk" >> $env:GITHUB_ENV
          "$sdk\Bin" >> $env:GITHUB_PATH
      - name: Fetch Skiko and patch it
        timeout-minutes: 15
        run: ci/skiko/build-natives.sh windows "$GITHUB_WORKSPACE/work" "$GITHUB_WORKSPACE/repo" fetch-skiko
      - name: Restore the cached Skia archives
        id: skia-cache
        uses: actions/cache/restore@v4
        with:
          path: work/skia-zips
          key: skia-zips-windows-${{ hashFiles('ci/skiko/pins.env', 'ci/skiko/skia-no-dng.patch') }}
      - name: Fetch Skia and patch it
        if: steps.skia-cache.outputs.cache-hit != 'true'
        timeout-minutes: 30
        run: ci/skiko/build-natives.sh windows "$GITHUB_WORKSPACE/work" "$GITHUB_WORKSPACE/repo" fetch-skia
      - name: Build and archive Skia
        if: steps.skia-cache.outputs.cache-hit != 'true'
        timeout-minutes: 240
        run: ci/skiko/build-natives.sh windows "$GITHUB_WORKSPACE/work" "$GITHUB_WORKSPACE/repo" skia
      - name: Save the Skia archives
        if: steps.skia-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: work/skia-zips
          key: skia-zips-windows-${{ hashFiles('ci/skiko/pins.env', 'ci/skiko/skia-no-dng.patch') }}
      - name: Build the Skiko runtime jars
        timeout-minutes: 90
        run: ci/skiko/build-natives.sh windows "$GITHUB_WORKSPACE/work" "$GITHUB_WORKSPACE/repo" skiko
      - name: Collect the repository tree
        timeout-minutes: 10
        run: ci/skiko/build-natives.sh windows "$GITHUB_WORKSPACE/work" "$GITHUB_WORKSPACE/repo" collect
      - name: Scan
        timeout-minutes: 20
        run: ci/skiko/scan-natives.sh windows "$GITHUB_WORKSPACE/repo"
      - uses: actions/upload-artifact@v4
        with:
          name: maven-windows
          path: repo
          if-no-files-found: error

  merge:
    name: Merge and scan all six jars
    needs: [build-linux-x64, build-linux-arm64, build-macos, build-windows]
    if: needs.build-linux-x64.result == 'success' && needs.build-linux-arm64.result == 'success' && needs.build-macos.result == 'success' && needs.build-windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: maven-*
          path: incoming
      - name: Merge the groups into one repository tree and scan all six jars
        run: |
          set -euo pipefail
          . ci/skiko/pins.env
          mkdir -p repo
          for dir in incoming/maven-*; do cp -R "${dir}/." repo/; done
          jars=$(find repo -name "skiko-awt-runtime-*-${NATIVES_VERSION}.jar" | sort)
          echo "${jars}"
          test "$(echo "${jars}" | wc -l)" -eq 6
          python3 scripts/check_no_dng.py ${jars}
      - uses: actions/upload-artifact@v4
        with:
          name: maven-merged
          path: repo
          if-no-files-found: error

  publish:
    name: Publish
    needs: [plan, merge]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: maven-merged
          path: repo
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'repo/**/*.jar'
      - name: Add the tree to the skiko-maven branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin skiko-maven >/dev/null; then
            git fetch --depth 1 origin skiko-maven
            git worktree add site FETCH_HEAD
            git -C site checkout -B skiko-maven
          else
            git worktree add --orphan -b skiko-maven site
          fi
          cp -R repo/. site/
          touch site/.nojekyll
          git -C site add -A
          git -C site commit -m "Add the DNG-free Skiko natives ${GITHUB_SHA::10}" || echo "nothing new to publish"
          git -C site push origin skiko-maven
