name: Desktop Publish

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: desktop-publish
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.artifact_suffix }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_suffix: linux-x64
          - os: windows-latest
            artifact_suffix: windows-x64
          - os: macos-latest
            artifact_suffix: macos-arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt

      - name: Set up sbt launcher
        uses: sbt/setup-sbt@v1

      - name: Test and build runnable JAR
        shell: bash
        run: sbt -v clean test assembly

      - name: Prepare app image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package-input dist
          cp target/scala-*/Serenity.jar package-input/Serenity.jar
          APP_ARGS=(
            --type app-image
            --name Serenity
            --input package-input
            --main-jar Serenity.jar
            --main-class Main
            --app-version "1.0.${GITHUB_RUN_NUMBER:-0}"
            --vendor "BarMal"
            --dest dist
          )
          if [ "$(uname -s)" = "Darwin" ]; then
            APP_ARGS+=(--mac-package-identifier "com.barmal.serenity")
          fi
          if [ "${RUNNER_OS:-}" = "Windows" ]; then
            APP_ARGS+=(--icon "$GITHUB_WORKSPACE/src/main/resources/icons/serenity.ico")
          fi
          cp package-input/Serenity.jar dist/Serenity.jar
          jpackage "${APP_ARGS[@]}"

      - name: Verify Windows launcher process model
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $launcherPath = (Resolve-Path 'dist/Serenity/Serenity.exe').Path
          $launcher = Start-Process -FilePath $launcherPath -PassThru
          $observed = @()
          $processIds = @()
          $normalExit = $false

          try {
            Start-Sleep -Seconds 5
            $launcher.Refresh()
            if ($launcher.HasExited) {
              throw "The Serenity launcher exited before the application was running."
            }

            $processes = Get-CimInstance Win32_Process
            $launcherProcesses = @($processes | Where-Object { $_.ProcessId -eq $launcher.Id })
            $applicationProcesses = @($processes | Where-Object {
              $_.ParentProcessId -eq $launcher.Id -and $_.Name -ieq 'Serenity.exe' -and $_.ExecutablePath -ieq $launcherPath
            })
            if ($launcherProcesses.Count -ne 1 -or $applicationProcesses.Count -ne 1) {
              throw "Expected a Serenity.exe launcher with one Serenity.exe child; observed $($launcherProcesses.Count) launchers and $($applicationProcesses.Count) application children."
            }
            $observed = @($launcherProcesses + $applicationProcesses)

            $observed | ForEach-Object {
              $runtime = Get-Process -Id $_.ProcessId -ErrorAction SilentlyContinue
              [pscustomobject]@{
                ProcessId = $_.ProcessId
                ParentProcessId = $_.ParentProcessId
                Name = $_.Name
                ExecutablePath = $_.ExecutablePath
                CommandLine = $_.CommandLine
                CpuSeconds = if ($null -eq $runtime) { $null } else { $runtime.CPU }
                WorkingSetMiB = [math]::Round([double]$_.WorkingSetSize / 1MB, 2)
              }
            } | Format-List
            $processIds = @($observed | ForEach-Object ProcessId | Sort-Object -Descending -Unique)
            $application = Get-Process -Id $applicationProcesses[0].ProcessId -ErrorAction Stop
            if (-not $application.CloseMainWindow()) {
              throw "The Serenity application child did not accept a normal window-close request."
            }
            if (-not $application.WaitForExit(15000) -or -not $launcher.WaitForExit(15000)) {
              throw "Serenity launcher processes did not exit after a normal window-close request."
            }
            $remaining = Get-Process -Id $processIds -ErrorAction SilentlyContinue
            if ($null -ne $remaining) {
              throw "Serenity launcher processes remained after normal shutdown: $($remaining.Id -join ', ')."
            }
            $normalExit = $true
          }
          finally {
            if (-not $normalExit) {
              $processIds = @($launcher.Id) + $processIds
              $processIds | ForEach-Object {
                Stop-Process -Id $_ -Force -ErrorAction SilentlyContinue
              }
            }
          }

      - name: Import macOS Developer ID certificate
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${MACOS_CERTIFICATE_BASE64:-}" ]; then
            echo "No macOS Developer ID certificate configured; ad-hoc signing will be used."
            exit 0
          fi

          if [ -z "${MACOS_CERTIFICATE_PASSWORD:-}" ] || [ -z "${MACOS_KEYCHAIN_PASSWORD:-}" ]; then
            echo "::error::Set MACOS_DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD and MACOS_KEYCHAIN_PASSWORD when configuring Developer ID signing."
            exit 1
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/serenity-signing.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id-application.p12"

          if ! printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH" 2>/dev/null; then
            printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          fi

          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Sign macOS app image
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64 }}
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${MACOS_CERTIFICATE_BASE64:-}" ]; then
            codesign --force --deep --sign - dist/Serenity.app
            exit 0
          fi

          IDENTITY="${MACOS_CODESIGN_IDENTITY:-}"
          if [ -z "$IDENTITY" ]; then
            IDENTITY="$(security find-identity -v -p codesigning | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n 1)"
          fi

          if [ -z "$IDENTITY" ]; then
            echo "::error::No Developer ID Application signing identity was found."
            security find-identity -v -p codesigning
            exit 1
          fi

          codesign --force --deep --options runtime --timestamp --sign "$IDENTITY" dist/Serenity.app
          codesign --verify --deep --strict --verbose=2 dist/Serenity.app

      - name: Archive Windows app image
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/Serenity -DestinationPath dist/Serenity-${{ matrix.artifact_suffix }}.zip -Force

      - name: Archive Unix app image
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          if [ -d Serenity.app ]; then
            ditto -c -k --sequesterRsrc --keepParent Serenity.app Serenity-${{ matrix.artifact_suffix }}.zip
          else
            zip -r Serenity-${{ matrix.artifact_suffix }}.zip Serenity
          fi

      - name: Notarize macOS app image
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64 }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${MACOS_CERTIFICATE_BASE64:-}" ]; then
            echo "No macOS Developer ID certificate configured; notarization will be skipped."
            exit 0
          fi

          if [ -z "${MACOS_NOTARY_APPLE_ID:-}" ] || [ -z "${MACOS_NOTARY_TEAM_ID:-}" ] || [ -z "${MACOS_NOTARY_PASSWORD:-}" ]; then
            echo "::error::Set MACOS_NOTARY_APPLE_ID, MACOS_NOTARY_TEAM_ID, and MACOS_NOTARY_PASSWORD to notarize the macOS artifact."
            exit 1
          fi

          ARCHIVE="dist/Serenity-${{ matrix.artifact_suffix }}.zip"
          xcrun notarytool submit "$ARCHIVE" \
            --apple-id "$MACOS_NOTARY_APPLE_ID" \
            --team-id "$MACOS_NOTARY_TEAM_ID" \
            --password "$MACOS_NOTARY_PASSWORD" \
            --wait
          xcrun stapler staple dist/Serenity.app
          xcrun stapler validate dist/Serenity.app

          cd dist
          rm -f Serenity-${{ matrix.artifact_suffix }}.zip
          ditto -c -k --sequesterRsrc --keepParent Serenity.app Serenity-${{ matrix.artifact_suffix }}.zip

      - name: Upload runnable JAR artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: Serenity-jar
          path: dist/Serenity.jar
          if-no-files-found: error
          retention-days: 1

      - name: Upload app image artifact
        uses: actions/upload-artifact@v4
        with:
          name: Serenity-${{ matrix.artifact_suffix }}
          path: dist/Serenity-${{ matrix.artifact_suffix }}.zip
          if-no-files-found: error
          retention-days: 1

      - name: Generate release notes
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          BUILD_SHA="$(git rev-parse HEAD)"
          {
            echo "Desktop debug build for commit \`${BUILD_SHA}\`."
            echo
            echo "Built from branch \`${GITHUB_REF_NAME}\`."
            echo
            echo "### Assets"
            echo "- Serenity.jar: runnable JVM fat JAR"
            echo "- Serenity-linux-x64.zip: Linux app image"
            echo "- Serenity-windows-x64.zip: Windows app image"
            echo "- Serenity-macos-arm64.zip: macOS Apple Silicon app image"
            echo
            if [ -f CHANGELOG.md ]; then
              echo "### Changelog"
              awk '
                /^## / {
                  if (capturing) {
                    exit
                  }
                  capturing = 1
                  print "#### " substr($0, 4)
                  next
                }
                capturing {
                  print
                }
              ' CHANGELOG.md
              echo
            fi
            echo "### Recent changes"
            git log -10 --pretty=format:'- %s (%h)'
            echo
          } > dist/release-notes.md

      - name: Upload release notes artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: Serenity-release-notes
          path: dist/release-notes.md
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish latest desktop release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish latest desktop release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          PUBLISH_SHA="$(git rev-parse HEAD)"

          git tag -f desktop-latest "$PUBLISH_SHA"
          git push -f origin desktop-latest

          if gh release view desktop-latest >/dev/null 2>&1; then
            gh release upload desktop-latest \
              dist/Serenity.jar \
              dist/Serenity-linux-x64.zip \
              dist/Serenity-windows-x64.zip \
              dist/Serenity-macos-arm64.zip \
              --clobber
            gh release edit desktop-latest \
              --title "Latest desktop build" \
              --notes-file dist/release-notes.md \
              --prerelease \
              --target "$PUBLISH_SHA"
          else
            gh release create desktop-latest \
              dist/Serenity.jar \
              dist/Serenity-linux-x64.zip \
              dist/Serenity-windows-x64.zip \
              dist/Serenity-macos-arm64.zip \
              --title "Latest desktop build" \
              --notes-file dist/release-notes.md \
              --prerelease \
              --target "$PUBLISH_SHA"
          fi
