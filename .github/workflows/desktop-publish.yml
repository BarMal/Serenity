name: Desktop Publish

# Two channels share this build. The nightly schedule (or a manual dispatch on master) republishes the rolling
# `desktop-latest` pre-release; a master push does not, because a three-OS build on every merge kept the publish job
# red and queued behind scarce macOS runners (#2016, #2141). Pushing a `vX.Y.Z` (or `vX.Y.Z-rc.N`) tag publishes a
# versioned, immutable GitHub release named for that version, with SHA256SUMS and the matching CHANGELOG section as its
# notes. See DEVELOPMENT.md, "Releasing".
on:
  schedule:
    # After the 03:17 UTC Cross-OS Tests nightly, so a red test run is visible before the build that republishes.
    - cron: '43 4 * * *'
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:

# Keyed by ref so a tag build is never cancelled by a nightly or manual run on master (or the reverse); only a newer
# run of the same ref supersedes an older one, and a tag run is never cancelled at all.
concurrency:
  group: desktop-publish-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.artifact_suffix }}
    runs-on: ${{ matrix.os }}
    # Each OS image and jar carries only its own Skiko natives (#2028); build.sbt reads this to pick the runtime jar.
    env:
      SERENITY_SKIKO_TARGET: ${{ matrix.artifact_suffix }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_suffix: linux-x64
          - os: windows-latest
            artifact_suffix: windows-x64
          - os: macos-latest
            artifact_suffix: macos-arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      # A release tag must name a plain X.Y.Z[-pre] version and sit on master, so a stray tag on a side branch cannot
      # publish. The tag is the single source of truth: sbt-dynver derives BuildInfo.version from it, PackageVersion
      # derives the jpackage --app-version from it, and the steps below fail the build if the three ever disagree.
      - name: Validate release tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$GITHUB_REF_NAME" =~ ^v([1-9][0-9]*\.[0-9]+\.[0-9]+)(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not vX.Y.Z or vX.Y.Z-pre with a first component of 1 or more."
            exit 1
          fi
          git fetch --no-tags origin master:refs/remotes/origin/master
          if ! git merge-base --is-ancestor HEAD origin/master; then
            echo "::error::Tag $GITHUB_REF_NAME is not on master; release tags must point at a commit master contains."
            exit 1
          fi

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: sbt

      - name: Set up sbt launcher
        uses: sbt/setup-sbt@v1

      - name: Test and build runnable JAR
        shell: bash
        env:
          # Branch builds are the nightly channel; a tag build leaves this off so PackageVersion reports release.
          SERENITY_NIGHTLY: ${{ github.ref_type == 'tag' && 'false' || 'true' }}
        run: sbt -v clean test assembly writePackageVersion

      - name: Verify tag, package version and BuildInfo agree
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          NUMERIC="${TAG_VERSION%%-*}"
          PACKAGE_VERSION="$(cat target/package/app-version.txt)"
          if [ "$PACKAGE_VERSION" != "$NUMERIC" ]; then
            echo "::error::Tag $GITHUB_REF_NAME gives jpackage --app-version $PACKAGE_VERSION, expected $NUMERIC."
            exit 1
          fi
          REPORTED="$(java -jar target/scala-*/Serenity.jar --version)"
          echo "Serenity --version: $REPORTED"
          case "$REPORTED" in
            *"$TAG_VERSION"*) ;;
            *)
              echo "::error::The assembled jar reports '$REPORTED', which does not name $TAG_VERSION (is the tree dirty?)."
              exit 1
              ;;
          esac

      # The console log capture for this workflow's Windows/macOS jobs has repeatedly dropped the actual assertion
      # message and stack trace for a failing test, surfacing only a bare suite-name summary -- true even with
      # ScalaTest's "-oF" full-stack-trace flag (see build.sbt's Test/testOptions comment), and the JUnit XML artifact
      # uploaded below isn't reachable from every environment that reads this log. Print each report's own <failure>
      # element straight into this step's own console output on failure, so the real diagnostic text survives
      # whatever the log relay does to the test step's own output.
      - name: Print test failure detail
        if: failure()
        shell: bash
        run: |
          set -uo pipefail
          shopt -s nullglob
          reports=(target/test-reports/*.xml)
          if [ ${#reports[@]} -eq 0 ]; then
            echo "::warning::No JUnit XML test reports found under target/test-reports/"
            exit 0
          fi
          for report in "${reports[@]}"; do
            if grep -q '<failure' "$report" || grep -q '<error' "$report"; then
              echo "::group::$report"
              cat "$report"
              echo "::endgroup::"
            fi
          done

      # Windows/macOS `sbt test` failures on this workflow have repeatedly come back from the GitHub Actions API as a
      # bare suite-name summary with no assertion message or stack trace, even with ScalaTest's "-oF" full-stack-trace
      # flag -- see build.sbt's Test/testOptions comment. The JUnit XML report configured there is a second sink for
      # the same failure detail that survives independently of console log capture; upload it unconditionally so a
      # failing run's full diagnostics are recoverable as a build artifact.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.artifact_suffix }}
          path: target/test-reports/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Build libSDL3 (Linux)
        id: sdl3
        if: runner.os == 'Linux'
        uses: ./.github/actions/build-sdl3

      - name: Prepare app image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package-input dist
          cp target/scala-*/Serenity.jar package-input/Serenity.jar
          # Skiko loads its native library from app/natives (-Dskiko.library.path below), never from the jar: a Mach-O
          # file inside a jar cannot carry our signature, and Skiko would otherwise unpack it into ~/.skiko (#2028).
          # The runnable jar published beside the image keeps its natives; only the copy the image ships is stripped.
          cp package-input/Serenity.jar "dist/Serenity-${{ matrix.artifact_suffix }}.jar"
          java scripts/SkikoNatives.java package-input/Serenity.jar package-input/natives "${{ matrix.artifact_suffix }}"
          # GPL-3.0-or-later requires the licence to travel with every copy (#2019); jpackage copies the whole input
          # directory into the app image, so these land beside the jar inside the signed bundle on macOS too.
          cp LICENSE THIRD-PARTY-NOTICES.md package-input/
          APP_ARGS=(
            --type app-image
            --name Serenity
            --input package-input
            --main-jar Serenity.jar
            --main-class Main
            --app-version "$(cat target/package/app-version.txt)"
            --vendor "BarMal"
            --dest dist
          )
          if [ "$(uname -s)" = "Darwin" ]; then
            APP_ARGS+=(--mac-package-identifier "com.barmal.serenity")
          fi
          if [ "${RUNNER_OS:-}" = "Windows" ]; then
            APP_ARGS+=(--icon "$GITHUB_WORKSPACE/src/main/resources/icons/serenity.ico")
          fi
          # The Wayland window library (#2380): the copy built from the pinned SDL tag travels beside the jar, and the
          # launcher tells the binding where it is. jpackage expands $APPDIR in --java-options.
          if [ "${RUNNER_OS:-}" = "Linux" ]; then
            mkdir -p package-input/natives
            cp "${{ steps.sdl3.outputs.directory }}/libSDL3.so.0" "${{ steps.sdl3.outputs.directory }}/LICENSE-SDL.txt" package-input/natives/
            APP_ARGS+=(--java-options '-Dserenity.sdl3.library.path=$APPDIR/natives')
          fi
          # Heap policy (see DEVELOPMENT.md), on every OS. A cap of a quarter of RAM stops an editor that is left open
          # from growing to the JVM default of a quarter-to-a-half of the machine. G1 is named explicitly because the
          # JVM falls back to Serial on small machines, which would ignore the periodic flag. Every 60 s of idleness
          # G1 runs a collection and returns freed heap to the OS: long enough not to disturb typing or rendering,
          # short enough that a closed large file stops costing memory within a minute.
          APP_ARGS+=(
            --java-options '-XX:+UseG1GC'
            --java-options '-XX:MaxRAMPercentage=25'
            --java-options '-XX:G1PeriodicGCInterval=60000'
            --java-options '-Dskiko.library.path=$APPDIR/natives'
          )
          # JDK 24+ warns on every native library load (Skiko, JNA, JLine) and a later JDK will block it unless native
          # access is granted, so the launcher grants it. The other warning is sun.misc.Unsafe: Scala's lazy vals
          # (scala.runtime.LazyVals, still so in Scala 3.10) call Unsafe.objectFieldOffset, which JDK 24+ reports on the
          # first call. "allow" keeps the output as quiet as on JDK 21 until Scala drops that call. The smoke test in
          # scripts/smoke-test-app-image.sh fails when either warning comes back.
          APP_ARGS+=(
            --java-options '--enable-native-access=ALL-UNNAMED'
            --java-options '--sun-misc-unsafe-memory-access=allow'
          )
          # Class-data sharing (see DEVELOPMENT.md). The runtime always gets its base archive from jlink; a dynamic
          # archive needs it, and jlink needs the java launcher left in the image to generate one. macOS has neither:
          # writing into the signed bundle would break its signature. Windows maps an AppCDS archive kept beside the
          # jar and written on the first exit. Linux ships a JDK 25 AOT cache instead, written by the training step
          # below; the JVM refuses -XX:AOTCache together with the AppCDS options, so Linux sets only one of them.
          if [ "$(uname -s)" != "Darwin" ]; then
            APP_ARGS+=(--jlink-options "--strip-debug --no-man-pages --no-header-files --generate-cds-archive")
          fi
          if [ "${RUNNER_OS:-}" = "Windows" ]; then
            APP_ARGS+=(
              --java-options '-XX:SharedArchiveFile=$APPDIR/serenity.jsa'
              --java-options '-XX:+AutoCreateSharedArchive'
            )
          fi
          jpackage "${APP_ARGS[@]}"
          # jlink dumped the base archive without --enable-native-access, which the launcher passes: the JVM would log a
          # mismatch on every start and drop its archived module graph (#2407).
          if [ "$(uname -s)" != "Darwin" ]; then
            scripts/regenerate-base-cds-archive.sh dist/Serenity
          fi
          if [ -z "$(find dist -type f -path "*/app/natives/*skiko-*" -print -quit)" ]; then
            echo "App image is missing the Skiko native library under app/natives" >&2
            exit 1
          fi
          IMAGE_JAR="$(find dist -type f -path "*/app/Serenity.jar" -print -quit)"
          if jar tf "$IMAGE_JAR" | grep -E 'skiko-(linux|macos|windows)-' >/dev/null; then
            echo "App image Serenity.jar still contains a Skiko native library" >&2
            exit 1
          fi
          for notice in LICENSE THIRD-PARTY-NOTICES.md; do
            if [ -z "$(find dist -type f -path "*/app/$notice" -print -quit)" ]; then
              echo "App image is missing $notice" >&2
              exit 1
            fi
          done

      - name: Verify Windows launcher process model
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify-windows-launcher.ps1

      # The class-data archive disagreements (and the JVM's native-access warnings) only show when the packaged image is
      # launched; the script runs under Git Bash on the Windows runner.
      - name: Smoke-test Windows app image
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: bash
        run: scripts/smoke-test-app-image.sh dist/Serenity/Serenity.exe 120

      # Launches the packaged image itself (not the jar) so a broken jlink runtime, launcher or missing resource fails
      # here rather than on a user's machine (#2030). The script starts it with --smoke-test, which prints a ready line
      # after the first painted frame and quits; it fails on a non-zero exit, crash log or timeout.
      - name: Smoke-test Linux app image
        if: runner.os == 'Linux'
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb
          # The Wayland window library must be in the image, and be the library the binding asks the loader for.
          sdl="$(find dist -type f -path '*/app/natives/libSDL3.so.0' -print -quit)"
          if [ -z "$sdl" ] || ! readelf -d "$sdl" | grep -q 'SONAME.*libSDL3.so.0'; then
            echo "App image is missing natives/libSDL3.so.0" >&2
            exit 1
          fi
          xvfb-run -a -s "-screen 0 1280x800x24" scripts/smoke-test-app-image.sh dist/Serenity/bin/Serenity 120

      # The cache is written from a run of the finished image, so it follows the smoke test that proves the image
      # starts. The check then proves a missing or stale cache (jar changed after training) still starts the app.
      - name: Train and check Linux AOT cache
        if: runner.os == 'Linux'
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          echo "Image before training: $(du -sh dist/Serenity | cut -f1) on disk, $(tar czf - dist/Serenity | wc -c) bytes gzipped"
          xvfb-run -a -s "-screen 0 1280x800x24" scripts/train-aot-cache.sh dist/Serenity 120
          xvfb-run -a -s "-screen 0 1280x800x24" scripts/check-aot-cache.sh dist/Serenity 120
          ls -l dist/Serenity/lib/app/serenity.aot
          echo "Image after training: $(du -sh dist/Serenity | cut -f1) on disk, $(tar czf - dist/Serenity | wc -c) bytes gzipped"

      - name: Import macOS Developer ID certificate
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${MACOS_CERTIFICATE_BASE64:-}" ]; then
            echo "No macOS Developer ID certificate configured; ad-hoc signing will be used."
            exit 0
          fi

          if [ -z "${MACOS_CERTIFICATE_PASSWORD:-}" ] || [ -z "${MACOS_KEYCHAIN_PASSWORD:-}" ]; then
            echo "::error::Set MACOS_DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD and MACOS_KEYCHAIN_PASSWORD when configuring Developer ID signing."
            exit 1
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/serenity-signing.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id-application.p12"

          if ! printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH" 2>/dev/null; then
            printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          fi

          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Sign macOS app image
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64 }}
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${MACOS_CERTIFICATE_BASE64:-}" ]; then
            scripts/sign-macos-app.sh dist/Serenity.app -
            exit 0
          fi

          IDENTITY="${MACOS_CODESIGN_IDENTITY:-}"
          if [ -z "$IDENTITY" ]; then
            IDENTITY="$(security find-identity -v -p codesigning | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n 1)"
          fi

          if [ -z "$IDENTITY" ]; then
            echo "::error::No Developer ID Application signing identity was found."
            security find-identity -v -p codesigning
            exit 1
          fi

          scripts/sign-macos-app.sh dist/Serenity.app "$IDENTITY"

      - name: Smoke-test macOS app image
        if: runner.os == 'macOS'
        timeout-minutes: 5
        shell: bash
        run: scripts/smoke-test-app-image.sh dist/Serenity.app/Contents/MacOS/Serenity 120

      - name: Archive Windows app image
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/Serenity -DestinationPath dist/Serenity-${{ matrix.artifact_suffix }}.zip -Force

      - name: Archive Unix app image
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          if [ -d Serenity.app ]; then
            ditto -c -k --sequesterRsrc --keepParent Serenity.app Serenity-${{ matrix.artifact_suffix }}.zip
          else
            zip -r Serenity-${{ matrix.artifact_suffix }}.zip Serenity
          fi

      - name: Notarize macOS app image
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64 }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${MACOS_CERTIFICATE_BASE64:-}" ]; then
            echo "No macOS Developer ID certificate configured; notarization will be skipped."
            exit 0
          fi

          if [ -z "${MACOS_NOTARY_APPLE_ID:-}" ] || [ -z "${MACOS_NOTARY_TEAM_ID:-}" ] || [ -z "${MACOS_NOTARY_PASSWORD:-}" ]; then
            echo "::error::Set MACOS_NOTARY_APPLE_ID, MACOS_NOTARY_TEAM_ID, and MACOS_NOTARY_PASSWORD to notarize the macOS artifact."
            exit 1
          fi

          ARCHIVE="dist/Serenity-${{ matrix.artifact_suffix }}.zip"
          xcrun notarytool submit "$ARCHIVE" \
            --apple-id "$MACOS_NOTARY_APPLE_ID" \
            --team-id "$MACOS_NOTARY_TEAM_ID" \
            --password "$MACOS_NOTARY_PASSWORD" \
            --wait
          xcrun stapler staple dist/Serenity.app
          xcrun stapler validate dist/Serenity.app

          cd dist
          rm -f Serenity-${{ matrix.artifact_suffix }}.zip
          ditto -c -k --sequesterRsrc --keepParent Serenity.app Serenity-${{ matrix.artifact_suffix }}.zip

      - name: Upload runnable JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: Serenity-jar-${{ matrix.artifact_suffix }}
          path: dist/Serenity-${{ matrix.artifact_suffix }}.jar
          if-no-files-found: error
          retention-days: 1

      - name: Upload app image artifact
        uses: actions/upload-artifact@v4
        with:
          name: Serenity-${{ matrix.artifact_suffix }}
          path: dist/Serenity-${{ matrix.artifact_suffix }}.zip
          if-no-files-found: error
          retention-days: 1

      # CycloneDX SBOM of the runtime classpath the jar is assembled from (#2017). A release without one is not
      # published; the rolling nightly tolerates a failure here so a plugin or network hiccup cannot stall it.
      - name: Generate SBOM
        id: sbom
        if: runner.os == 'Linux'
        continue-on-error: ${{ github.ref_type != 'tag' }}
        shell: bash
        run: |
          set -euo pipefail
          sbt -v makeBom
          cp target/Serenity.cdx.json dist/Serenity.cdx.json
          python3 - dist/Serenity.cdx.json <<'PY'
          import json, os, sys
          bom = json.load(open(sys.argv[1]))
          assert bom["bomFormat"] == "CycloneDX" and bom["components"], "empty or malformed SBOM"
          if os.environ["GITHUB_REF_TYPE"] == "tag":
              reported = bom["metadata"]["component"]["version"]
              expected = os.environ["GITHUB_REF_NAME"].lstrip("v")
              assert reported == expected, f"SBOM names version {reported}, expected {expected}"
          print("SBOM components:", len(bom["components"]))
          PY

      - name: Upload SBOM artifact
        if: runner.os == 'Linux' && steps.sbom.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Serenity-sbom
          path: dist/Serenity.cdx.json
          if-no-files-found: error
          retention-days: 1

      - name: Generate release notes
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            # The release notes are the tag's own CHANGELOG section; the step fails, and nothing is published, when
            # that section is missing, empty or the changelog is malformed.
            sbt "Test/runMain com.serenity.release.ChangelogNotes CHANGELOG.md ${GITHUB_REF_NAME#v} dist/release-notes.md"
            exit 0
          fi
          BUILD_SHA="$(git rev-parse HEAD)"
          {
            echo "Nightly desktop build for commit \`${BUILD_SHA}\`. This is not a release: it is rebuilt from \`master\` every night and replaced in place. Download a versioned release for anything you intend to keep."
            echo
            echo "Built from branch \`${GITHUB_REF_NAME}\`."
            echo
            echo "### Assets"
            echo "- Serenity-linux-x64.jar, Serenity-windows-x64.jar, Serenity-macos-arm64.jar: runnable JVM fat JARs, each with the Skia natives of its own OS only"
            echo "- Serenity-linux-x64.zip: Linux app image"
            echo "- Serenity-windows-x64.zip: Windows app image"
            echo "- Serenity-macos-arm64.zip: macOS Apple Silicon app image"
            echo "- Serenity.cdx.json: CycloneDX software bill of materials for the runtime dependencies"
            echo "- SHA256SUMS: SHA-256 checksums of the files above"
            echo
            if [ -f CHANGELOG.md ]; then
              echo "### Unreleased changes"
              awk '
                /^## / {
                  if (capturing) {
                    exit
                  }
                  capturing = 1
                  next
                }
                capturing {
                  print
                }
              ' CHANGELOG.md
              echo
            fi
            echo "### Recent changes"
            git log -10 --pretty=format:'- %s (%h)'
            echo
          } > dist/release-notes.md

      - name: Upload release notes artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: Serenity-release-notes
          path: dist/release-notes.md
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish ${{ github.ref_type == 'tag' && 'versioned release' || 'nightly desktop build' }}
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          ASSETS=(
            Serenity-linux-x64.jar Serenity-windows-x64.jar Serenity-macos-arm64.jar
            Serenity-linux-x64.zip Serenity-windows-x64.zip Serenity-macos-arm64.zip
          )
          if [ -f Serenity.cdx.json ]; then
            ASSETS+=(Serenity.cdx.json)
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "::error::A release must carry an SBOM, but Serenity.cdx.json was not built."
            exit 1
          else
            echo "::warning::No SBOM for this nightly build; publishing without Serenity.cdx.json."
          fi
          sha256sum "${ASSETS[@]}" > SHA256SUMS
          cat SHA256SUMS

      - name: Publish versioned release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::error::Release $GITHUB_REF_NAME already exists; releases are immutable. Delete it and the tag deliberately, or tag a new version."
            exit 1
          fi
          CHANNEL_FLAGS=(--latest)
          if [[ "$VERSION" == *-* ]]; then
            CHANNEL_FLAGS=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            dist/Serenity-linux-x64.jar \
            dist/Serenity-windows-x64.jar \
            dist/Serenity-macos-arm64.jar \
            dist/Serenity-linux-x64.zip \
            dist/Serenity-windows-x64.zip \
            dist/Serenity-macos-arm64.zip \
            dist/Serenity.cdx.json \
            dist/SHA256SUMS \
            --title "Serenity $VERSION" \
            --notes-file dist/release-notes.md \
            --verify-tag \
            "${CHANNEL_FLAGS[@]}"

      # Only master feeds the nightly channel (a scheduled run is always on the default branch); a manual dispatch from
      # another branch still builds and tests.
      - name: Publish nightly desktop build
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          PUBLISH_SHA="$(git rev-parse HEAD)"
          ASSETS=(
            dist/Serenity-linux-x64.jar dist/Serenity-windows-x64.jar dist/Serenity-macos-arm64.jar
            dist/Serenity-linux-x64.zip dist/Serenity-windows-x64.zip dist/Serenity-macos-arm64.zip
          )
          if [ -f dist/Serenity.cdx.json ]; then
            ASSETS+=(dist/Serenity.cdx.json)
          fi
          ASSETS+=(dist/SHA256SUMS)

          git tag -f desktop-latest "$PUBLISH_SHA"
          git push -f origin desktop-latest

          if gh release view desktop-latest >/dev/null 2>&1; then
            gh release upload desktop-latest "${ASSETS[@]}" --clobber
            gh release edit desktop-latest \
              --title "Nightly desktop build" \
              --notes-file dist/release-notes.md \
              --prerelease \
              --latest=false \
              --target "$PUBLISH_SHA"
          else
            gh release create desktop-latest "${ASSETS[@]}" \
              --title "Nightly desktop build" \
              --notes-file dist/release-notes.md \
              --prerelease \
              --target "$PUBLISH_SHA"
          fi
