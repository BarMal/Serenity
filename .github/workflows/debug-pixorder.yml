name: Debug pixel order

on:
  push:
    branches:
      - ccr-157ed55f-u6khhf-pixorder-debug

permissions:
  contents: read

jobs:
  spec:
    name: Pixel order (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - shell: bash
        run: sbt "testOnly com.serenity.ui.skia.SkiaPixelOrderSpec"
