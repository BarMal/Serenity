name: Debug Skia Windows

on:
  push:
    branches:
      - ccr-157ed55f-u6khhf-windebug

permissions:
  contents: read

jobs:
  specs:
    name: Skia pixel specs (${{ matrix.label }})
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: head-with-experiments
            ref: ''
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref || github.sha }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt

      - name: Set up sbt launcher
        uses: sbt/setup-sbt@v1

      - name: Run the Skia pixel specs
        shell: bash
        run: sbt -v "testOnly com.serenity.SkiaChromeRepaintPixelsSpec com.serenity.SkiaScrollReusePixelsSpec com.serenity.SkiaFontDebugSpec com.serenity.SkiaColdWarmDebugSpec"

      - name: Print mismatch dumps
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          for dump in target/test-reports/frame-mismatches/*.txt; do
            echo "::group::$dump"
            cat "$dump"
            echo "::endgroup::"
          done
