name: Platform probe

on:
  push:
    branches:
      - ccr-157ed55f-u6khhf-platform-probe3

permissions:
  contents: read

jobs:
  probe:
    name: Probe (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
          - os: macos-latest
            label: macos

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: sbt

      - uses: sbt/setup-sbt@v1

      - name: Layer and benchmark specs
        shell: bash
        run: |
          sbt -batch "testOnly com.serenity.ui.skia.SkiaLayerHostSpec com.serenity.ui.skia.SkiaLayerWindowSpec com.serenity.ui.skia.SkiaLayerRedrawSpec com.serenity.ui.skia.SkiaRasterWindowSpec com.serenity.ui.benchmark.RenderBenchmarkRunnerSpec com.serenity.ui.benchmark.RenderBenchmarkSpec" 2>&1 | grep -E "^\[info\] - |FAILED|was not|Tests:|PROBE" | head -80 || true
          for report in target/test-reports/*.xml; do
            if grep -q -e '<failure' -e '<error' "$report"; then
              echo "== $report"
              grep -B2 -A8 -e '<failure' -e '<error' "$report" | cut -c1-400 | head -60
            fi
          done
