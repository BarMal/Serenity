name: Debug Java 25 CDS mismatch

on:
  push:
    branches:
      - ccr-157ed55f-u6khhf-java25-cdsmm

permissions:
  contents: read

jobs:
  mismatch:
    name: CDS mismatch ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: linux, os: ubuntu-latest, cfg: lib/app/Serenity.cfg, rt: lib/runtime, exe: bin/Serenity, java: bin/java, base: lib/server/classes.jsa }
          - { label: windows, os: windows-latest, cfg: app/Serenity.cfg, rt: runtime, exe: Serenity.exe, java: bin/java.exe, base: bin/server/classes.jsa }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Build the app image with the release command
        run: |
          set -euo pipefail
          sbt -v clean assembly writePackageVersion
          mkdir -p package-input dist
          cp target/scala-*/Serenity.jar package-input/Serenity.jar
          cp LICENSE THIRD-PARTY-NOTICES.md package-input/
          ICON=()
          if [ "$RUNNER_OS" = Windows ]; then ICON=(--icon "$GITHUB_WORKSPACE/src/main/resources/icons/serenity.ico"); fi
          jpackage --type app-image --name Serenity --input package-input --main-jar Serenity.jar --main-class Main \
            --app-version "$(cat target/package/app-version.txt)" --vendor BarMal --dest dist "${ICON[@]}" \
            --java-options '-XX:+UseG1GC' --java-options '-XX:MaxRAMPercentage=25' --java-options '-XX:G1PeriodicGCInterval=60000' \
            --java-options '--enable-native-access=ALL-UNNAMED' --java-options '--sun-misc-unsafe-memory-access=allow' \
            --jlink-options "--strip-debug --no-man-pages --no-header-files --generate-cds-archive" \
            --java-options '-XX:SharedArchiveFile=$APPDIR/serenity.jsa' --java-options '-XX:+AutoCreateSharedArchive'
          cat dist/Serenity/${{ matrix.cfg }}
      - name: Start a display (Linux)
        if: runner.os == 'Linux'
        run: |
          Xvfb :99 -screen 0 1280x800x24 >/dev/null 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          sleep 3
      - name: Experiments
        run: |
          set +e -uo pipefail
          root="$PWD"; CFG='${{ matrix.cfg }}'; RT='${{ matrix.rt }}'; EXE='${{ matrix.exe }}'; JAVA='${{ matrix.java }}'
          PY=python; command -v python >/dev/null || PY=python3
          PAT='mismatch|disabling|optimized module|adapter|codecache|stubs|\[warning\]|\[error\]'
          say() { echo; echo "##### $*"; }
          fresh() { rm -rf "$1" && mkdir "$1" && cp -r dist/Serenity "$1/Serenity"; }
          launch() {
            ( cd "$(mktemp -d)" && JAVA_TOOL_OPTIONS="$2" "$root/$1/Serenity/$EXE" --smoke-test --safe-mode > out.txt 2>&1; echo "exit=$?"
              grep -v "Picked up" out.txt | grep -v "Skipping" | grep -iE "$PAT" | head -n 20; echo "(matching lines: $(grep -v 'Picked up' out.txt | grep -v Skipping | grep -ciE "$PAT"))" )
          }
          train() { # <image>: drop AppCDS options, write the AOT cache, point the launcher at it
            $PY bench/java25/cfgtool.py "$1/Serenity/$CFG" "drop:SharedArchiveFile" "drop:AutoCreateSharedArchive"
            AOT="$(cd $1/Serenity/${CFG%/*} && pwd)/serenity.aot"; [ "$RUNNER_OS" = Windows ] && AOT="$(cygpath -m "$AOT")"
            ( cd "$(mktemp -d)" && JAVA_TOOL_OPTIONS="-XX:AOTCacheOutput=$AOT" "$root/$1/Serenity/$EXE" --smoke-test --safe-mode > train.txt 2>&1; echo "training exit=$?"
              grep -v "Picked up" train.txt | grep -v Skipping | grep -iE "$PAT" | head -n 10 )
            $PY bench/java25/cfgtool.py "$1/Serenity/$CFG" 'add:-XX:AOTCache=$APPDIR/serenity.aot'
          }
          say "F1. AOT cache trained on today's image (jlink base archive): run 1, run 2"
          fresh e; train e; launch e "-Xlog:aot*=info -Xlog:cds=info"; launch e "-Xlog:aot*=info -Xlog:cds=info"
          say "F2. AOT cache trained after regenerating the base archive with --enable-native-access"
          fresh f; "f/Serenity/$RT/$JAVA" -Xshare:dump -Xlog:cds=warning --enable-native-access=ALL-UNNAMED 2>&1 | grep -v "Picked up" | tail -n 3
          train f; launch f "-Xlog:aot*=info -Xlog:cds=info"; launch f "-Xlog:aot*=info -Xlog:cds=info"
          say "F3. time to first frame of both AOT images (warm-up discarded, n=10)"
          $PY bench/ttfw.py "e/Serenity/$EXE" 10 "AOT, jlink base"
          $PY bench/ttfw.py "f/Serenity/$EXE" 10 "AOT, regenerated base"
          echo "--- cpu:"; (lscpu 2>/dev/null | grep -iE "model name" | cut -c1-200) || true
