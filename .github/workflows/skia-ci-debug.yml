name: Skia CI debug
on:
  push:
    branches:
      - ccr-157ed55f-u6khhf-skia-ci-debug
permissions:
  contents: read
jobs:
  spec-only:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Run the spec three times
        run: |
          for i in 1 2 3; do
            xvfb-run -a -s "-screen 0 1920x1200x24" sbt -batch "testOnly com.serenity.ui.skia.SkiaLayerHostSpec" || true
            grep -l "<failure\|<error" target/test-reports/*.xml 2>/dev/null | while read f; do echo "== $f"; grep -B2 -A12 "<failure\|<error" "$f" | cut -c1-600 | head -60; done
          done
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Run all tests
        run: xvfb-run -a -s "-screen 0 1920x1200x24" sbt -batch test || true
      - name: Print failures
        run: |
          grep -l "<failure\|<error" target/test-reports/*.xml 2>/dev/null | while read f; do echo "== $f"; grep -B2 -A14 "<failure\|<error" "$f" | cut -c1-700 | head -80; done
