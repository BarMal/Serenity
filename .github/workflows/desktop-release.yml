name: Desktop Package Check

# Packaging is built for every master push by Desktop Publish. On pull requests the three-OS jpackage build only runs
# when something that shapes the package changes; ordinary code is covered by CI and Cross-OS Tests, and building
# installers on every PR starved the shared runners (jobs cancelled after queueing).
on:
  pull_request:
    paths:
      - build.sbt
      - project/**
      - .jvmopts
      - scripts/**
      - src/main/resources/icons/**
      - .github/workflows/desktop-*.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.artifact_suffix }}
    if: "!startsWith(github.head_ref, 'claude/')"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_suffix: linux-x64
          - os: windows-latest
            artifact_suffix: windows-x64
          - os: macos-latest
            artifact_suffix: macos-arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt

      - name: Set up sbt launcher
        uses: sbt/setup-sbt@v1

      - name: Build runnable JAR
        shell: bash
        run: sbt -v clean assembly

      - name: Verify assembled JAR service providers
        shell: bash
        run: ./scripts/check-assembled-jar.sh target/scala-*/Serenity.jar

      - name: Prepare app image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package-input dist
          cp target/scala-*/Serenity.jar package-input/Serenity.jar
          # GPL-3.0-or-later requires the licence to travel with every copy (#2019); jpackage copies the whole input
          # directory into the app image, so these land beside the jar inside the signed bundle on macOS too.
          cp LICENSE THIRD-PARTY-NOTICES.md package-input/
          APP_ARGS=(
            --type app-image
            --name Serenity
            --input package-input
            --main-jar Serenity.jar
            --main-class Main
            --app-version "1.0.${GITHUB_RUN_NUMBER:-0}"
            --vendor "BarMal"
            --dest dist
          )
          if [ "$(uname -s)" = "Darwin" ]; then
            APP_ARGS+=(--mac-package-identifier "com.barmal.serenity")
          fi
          if [ "${RUNNER_OS:-}" = "Windows" ]; then
            APP_ARGS+=(--icon "$GITHUB_WORKSPACE/src/main/resources/icons/serenity.ico")
          fi
          # Heap policy (see DEVELOPMENT.md), on every OS. A cap of a quarter of RAM stops an editor that is left open
          # from growing to the JVM default of a quarter-to-a-half of the machine. G1 is named explicitly because the
          # JVM falls back to Serial on small machines, which would ignore the periodic flag. Every 60 s of idleness
          # G1 runs a collection and returns freed heap to the OS: long enough not to disturb typing or rendering,
          # short enough that a closed large file stops costing memory within a minute.
          APP_ARGS+=(
            --java-options '-XX:+UseG1GC'
            --java-options '-XX:MaxRAMPercentage=25'
            --java-options '-XX:G1PeriodicGCInterval=60000'
          )
          # AppCDS (see DEVELOPMENT.md): the launcher maps a class-data archive kept beside the jar and written on the
          # first exit. A dynamic archive needs the runtime's own base archive, and jlink needs the java launcher left
          # in the image to generate one. Not on macOS, where writing into the signed bundle would break its signature.
          if [ "$(uname -s)" != "Darwin" ]; then
            APP_ARGS+=(
              --jlink-options "--strip-debug --no-man-pages --no-header-files --generate-cds-archive"
              --java-options '-XX:SharedArchiveFile=$APPDIR/serenity.jsa'
              --java-options '-XX:+AutoCreateSharedArchive'
            )
          fi
          cp package-input/Serenity.jar dist/Serenity.jar
          jpackage "${APP_ARGS[@]}"
          for notice in LICENSE THIRD-PARTY-NOTICES.md; do
            if [ -z "$(find dist -type f -path "*/app/$notice" -print -quit)" ]; then
              echo "App image is missing $notice" >&2
              exit 1
            fi
          done

      - name: Verify Windows launcher process model
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $launcherPath = (Resolve-Path 'dist/Serenity/Serenity.exe').Path
          $launcher = Start-Process -FilePath $launcherPath -PassThru
          $observed = @()
          $processIds = @()
          $normalExit = $false

          try {
            Start-Sleep -Seconds 5
            $launcher.Refresh()
            if ($launcher.HasExited) {
              throw "The Serenity launcher exited before the application was running."
            }

            $processes = Get-CimInstance Win32_Process
            $launcherProcesses = @($processes | Where-Object { $_.ProcessId -eq $launcher.Id })
            $applicationProcesses = @($processes | Where-Object {
              $_.ParentProcessId -eq $launcher.Id -and $_.Name -ieq 'Serenity.exe' -and $_.ExecutablePath -ieq $launcherPath
            })
            if ($launcherProcesses.Count -ne 1 -or $applicationProcesses.Count -ne 1) {
              throw "Expected a Serenity.exe launcher with one Serenity.exe child; observed $($launcherProcesses.Count) launchers and $($applicationProcesses.Count) application children."
            }
            $observed = @($launcherProcesses + $applicationProcesses)

            $observed | ForEach-Object {
              $runtime = Get-Process -Id $_.ProcessId -ErrorAction SilentlyContinue
              [pscustomobject]@{
                ProcessId = $_.ProcessId
                ParentProcessId = $_.ParentProcessId
                Name = $_.Name
                ExecutablePath = $_.ExecutablePath
                CommandLine = $_.CommandLine
                CpuSeconds = if ($null -eq $runtime) { $null } else { $runtime.CPU }
                WorkingSetMiB = [math]::Round([double]$_.WorkingSetSize / 1MB, 2)
              }
            } | Format-List
            $processIds = @($observed | ForEach-Object ProcessId | Sort-Object -Descending -Unique)
            $application = Get-Process -Id $applicationProcesses[0].ProcessId -ErrorAction Stop
            if (-not $application.CloseMainWindow()) {
              throw "The Serenity application child did not accept a normal window-close request."
            }
            if (-not $application.WaitForExit(15000) -or -not $launcher.WaitForExit(15000)) {
              throw "Serenity launcher processes did not exit after a normal window-close request."
            }
            $remaining = Get-Process -Id $processIds -ErrorAction SilentlyContinue
            if ($null -ne $remaining) {
              throw "Serenity launcher processes remained after normal shutdown: $($remaining.Id -join ', ')."
            }
            $normalExit = $true
          }
          finally {
            if (-not $normalExit) {
              $processIds = @($launcher.Id) + $processIds
              $processIds | ForEach-Object {
                Stop-Process -Id $_ -Force -ErrorAction SilentlyContinue
              }
            }
          }

      - name: Sign macOS app image
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          codesign --force --deep --sign - dist/Serenity.app

      - name: Archive Windows app image
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/Serenity -DestinationPath dist/Serenity-${{ matrix.artifact_suffix }}.zip -Force

      - name: Archive Unix app image
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          if [ -d Serenity.app ]; then
            ditto -c -k --sequesterRsrc --keepParent Serenity.app Serenity-${{ matrix.artifact_suffix }}.zip
          else
            zip -r Serenity-${{ matrix.artifact_suffix }}.zip Serenity
          fi

      - name: Upload runnable JAR artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: Serenity-jar
          path: dist/Serenity.jar
          if-no-files-found: error
          retention-days: 1

      - name: Upload app image artifact
        uses: actions/upload-artifact@v4
        with:
          name: Serenity-${{ matrix.artifact_suffix }}
          path: dist/Serenity-${{ matrix.artifact_suffix }}.zip
          if-no-files-found: error
          retention-days: 1
