name: Desktop Package Check

# Packaging is built nightly, and for every release tag, by Desktop Publish. On pull requests the three-OS jpackage build only runs
# when something that shapes the package changes; ordinary code is covered by CI and Cross-OS Tests, and building
# installers on every PR starved the shared runners (jobs cancelled after queueing).
on:
  pull_request:
    paths:
      - build.sbt
      - project/**
      - .jvmopts
      - scripts/**
      - src/main/resources/icons/**
      - .github/workflows/desktop-*.yml
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request supersedes its older runs; cancelling them frees runners (macOS especially) for current
# heads. Master pushes are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build ${{ matrix.artifact_suffix }}
    if: "!startsWith(github.head_ref, 'claude/')"
    runs-on: ${{ matrix.os }}
    # Each OS image and jar carries only its own Skiko natives (#2028); build.sbt reads this to pick the runtime jar.
    env:
      SERENITY_SKIKO_TARGET: ${{ matrix.artifact_suffix }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_suffix: linux-x64
          - os: windows-latest
            artifact_suffix: windows-x64
          - os: macos-latest
            artifact_suffix: macos-arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: sbt

      - name: Set up sbt launcher
        uses: sbt/setup-sbt@v1

      - name: Build runnable JAR
        shell: bash
        run: sbt -v clean assembly writePackageVersion

      - name: Verify assembled JAR service providers
        shell: bash
        run: ./scripts/check-assembled-jar.sh target/scala-*/Serenity.jar

      - name: Prepare app image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package-input dist
          cp target/scala-*/Serenity.jar package-input/Serenity.jar
          # Skiko loads its native library from app/natives (-Dskiko.library.path below), never from the jar: a Mach-O
          # file inside a jar cannot carry our signature, and Skiko would otherwise unpack it into ~/.skiko (#2028).
          # The runnable jar published beside the image keeps its natives; only the copy the image ships is stripped.
          cp package-input/Serenity.jar "dist/Serenity-${{ matrix.artifact_suffix }}.jar"
          java scripts/SkikoNatives.java package-input/Serenity.jar package-input/natives "${{ matrix.artifact_suffix }}"
          # GPL-3.0-or-later requires the licence to travel with every copy (#2019); jpackage copies the whole input
          # directory into the app image, so these land beside the jar inside the signed bundle on macOS too.
          cp LICENSE THIRD-PARTY-NOTICES.md package-input/
          APP_ARGS=(
            --type app-image
            --name Serenity
            --input package-input
            --main-jar Serenity.jar
            --main-class Main
            --app-version "$(cat target/package/app-version.txt)"
            --vendor "BarMal"
            --dest dist
          )
          if [ "$(uname -s)" = "Darwin" ]; then
            APP_ARGS+=(--mac-package-identifier "com.barmal.serenity")
          fi
          if [ "${RUNNER_OS:-}" = "Windows" ]; then
            APP_ARGS+=(--icon "$GITHUB_WORKSPACE/src/main/resources/icons/serenity.ico")
          fi
          # Heap policy (see DEVELOPMENT.md), on every OS. A cap of a quarter of RAM stops an editor that is left open
          # from growing to the JVM default of a quarter-to-a-half of the machine. G1 is named explicitly because the
          # JVM falls back to Serial on small machines, which would ignore the periodic flag. Every 60 s of idleness
          # G1 runs a collection and returns freed heap to the OS: long enough not to disturb typing or rendering,
          # short enough that a closed large file stops costing memory within a minute.
          APP_ARGS+=(
            --java-options '-XX:+UseG1GC'
            --java-options '-XX:MaxRAMPercentage=25'
            --java-options '-XX:G1PeriodicGCInterval=60000'
            --java-options '-Dskiko.library.path=$APPDIR/natives'
          )
          # JDK 24+ warns on every native library load (Skiko, JNA, JLine) and a later JDK will block it unless native
          # access is granted, so the launcher grants it. The other warning is sun.misc.Unsafe: Scala's lazy vals
          # (scala.runtime.LazyVals, still so in Scala 3.10) call Unsafe.objectFieldOffset, which JDK 24+ reports on the
          # first call. "allow" keeps the output as quiet as on JDK 21 until Scala drops that call. The smoke test in
          # scripts/smoke-test-app-image.sh fails when either warning comes back.
          APP_ARGS+=(
            --java-options '--enable-native-access=ALL-UNNAMED'
            --java-options '--sun-misc-unsafe-memory-access=allow'
          )
          # Class-data sharing (see DEVELOPMENT.md). The runtime always gets its base archive from jlink; a dynamic
          # archive needs it, and jlink needs the java launcher left in the image to generate one. macOS has neither:
          # writing into the signed bundle would break its signature. Windows maps an AppCDS archive kept beside the
          # jar and written on the first exit. Linux ships a JDK 25 AOT cache instead, written by the training step
          # below; the JVM refuses -XX:AOTCache together with the AppCDS options, so Linux sets only one of them.
          if [ "$(uname -s)" != "Darwin" ]; then
            APP_ARGS+=(--jlink-options "--strip-debug --no-man-pages --no-header-files --generate-cds-archive")
          fi
          if [ "${RUNNER_OS:-}" = "Windows" ]; then
            APP_ARGS+=(
              --java-options '-XX:SharedArchiveFile=$APPDIR/serenity.jsa'
              --java-options '-XX:+AutoCreateSharedArchive'
            )
          fi
          jpackage "${APP_ARGS[@]}"
          if [ -z "$(find dist -type f -path "*/app/natives/*skiko-*" -print -quit)" ]; then
            echo "App image is missing the Skiko native library under app/natives" >&2
            exit 1
          fi
          IMAGE_JAR="$(find dist -type f -path "*/app/Serenity.jar" -print -quit)"
          if jar tf "$IMAGE_JAR" | grep -E 'skiko-(linux|macos|windows)-' >/dev/null; then
            echo "App image Serenity.jar still contains a Skiko native library" >&2
            exit 1
          fi
          for notice in LICENSE THIRD-PARTY-NOTICES.md; do
            if [ -z "$(find dist -type f -path "*/app/$notice" -print -quit)" ]; then
              echo "App image is missing $notice" >&2
              exit 1
            fi
          done

      # The JVM's own warnings (native access, sun.misc.Unsafe) only show when the packaged image is launched, so the
      # package check launches it too, not only the nightly publish.
      - name: Smoke-test Linux app image
        if: runner.os == 'Linux'
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb
          xvfb-run -a -s "-screen 0 1280x800x24" scripts/smoke-test-app-image.sh dist/Serenity/bin/Serenity 120

      # The cache is written from a run of the finished image, so it follows the smoke test that proves the image
      # starts. The check then proves a missing or stale cache (jar changed after training) still starts the app.
      - name: Train and check Linux AOT cache
        if: runner.os == 'Linux'
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          echo "Image before training: $(du -sh dist/Serenity | cut -f1) on disk, $(tar czf - dist/Serenity | wc -c) bytes gzipped"
          xvfb-run -a -s "-screen 0 1280x800x24" scripts/train-aot-cache.sh dist/Serenity 120
          xvfb-run -a -s "-screen 0 1280x800x24" scripts/check-aot-cache.sh dist/Serenity 120
          ls -l dist/Serenity/lib/app/serenity.aot
          echo "Image after training: $(du -sh dist/Serenity | cut -f1) on disk, $(tar czf - dist/Serenity | wc -c) bytes gzipped"

      - name: Test the window-wait helper
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/WindowWait.Tests.ps1

      - name: Verify Windows launcher process model
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify-windows-launcher.ps1

      - name: Sign macOS app image
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          scripts/sign-macos-app.sh dist/Serenity.app -

      - name: Archive Windows app image
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/Serenity -DestinationPath dist/Serenity-${{ matrix.artifact_suffix }}.zip -Force

      - name: Archive Unix app image
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          if [ -d Serenity.app ]; then
            ditto -c -k --sequesterRsrc --keepParent Serenity.app Serenity-${{ matrix.artifact_suffix }}.zip
          else
            zip -r Serenity-${{ matrix.artifact_suffix }}.zip Serenity
          fi

      # Loads the natives from where the image ships them, after signing, with the stripped jar: a pass means the
      # app/natives layout works and, on macOS, that the re-signed dylib is still accepted by the loader (#2028).
      - name: Probe Skiko natives in the app image
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR="$(dirname "$(find dist -type f -path '*/app/Serenity.jar' -print -quit)")"
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y xvfb libgl1 libfontconfig1
            PROBE=(xvfb-run -a java)
          else
            PROBE=(java)
          fi
          "${PROBE[@]}" -Dskiko.library.path="$APP_DIR/natives" -cp "$APP_DIR/Serenity.jar" scripts/SkikoProbe.java | tee probe.log
          grep -q '^SKIKO_PROBE_OK ' probe.log

      - name: Upload runnable JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: Serenity-jar-${{ matrix.artifact_suffix }}
          path: dist/Serenity-${{ matrix.artifact_suffix }}.jar
          if-no-files-found: error
          retention-days: 1

      - name: Upload app image artifact
        uses: actions/upload-artifact@v4
        with:
          name: Serenity-${{ matrix.artifact_suffix }}
          path: dist/Serenity-${{ matrix.artifact_suffix }}.zip
          if-no-files-found: error
          retention-days: 1
