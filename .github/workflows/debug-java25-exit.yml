name: Debug Java 25 exit

on:
  push:
    branches:
      - ccr-157ed55f-u6khhf-java25-exithang

permissions:
  contents: read

jobs:
  control:
    name: Control ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: temurin21, jdk: temurin21 }
          - { label: jbr21, jdk: jbr21 }
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - if: matrix.jdk == 'temurin21'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt
      - if: matrix.jdk == 'jbr21'
        name: Install JBR 21
        run: |
          home="$(SERIES=21 PLAT=linux-x64 bash bench/java25/fetch-jbr.sh "$RUNNER_TEMP/jbr21")"
          echo "JAVA_HOME=$home" >> "$GITHUB_ENV"
          echo "$home/bin" >> "$GITHUB_PATH"
          echo "JBR tag: $(cat "$RUNNER_TEMP/jbr21/TAG")"
      - uses: sbt/setup-sbt@v1
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: sbt test (same invocation as ci.yml)
        id: t
        continue-on-error: true
        run: |
          java -version
          xvfb-run -a -s "-screen 0 1920x1200x24" bash .github/scripts/run-tests-with-hang-dump.sh sbt -v clean test > test.log 2>&1
          echo "rc=$?"
      - name: Summary
        if: always()
        run: |
          echo "CONTROL ${{ matrix.label }}"
          java -version 2>&1 | head -n 3
          grep -E "Run completed in|Total number of tests|Tests: succeeded|All tests passed|TESTS FAILED|Total time:" test.log | sed 's/\x1b\[[0-9;]*m//g' | head -n 12
          echo "FAILED SUITES:"; sed 's/\x1b\[[0-9;]*m//g' test.log | grep -E "^\[error\] 	com\.serenity" | head -n 40
