name: Debug Java 25 exit

on:
  push:
    branches:
      - ccr-157ed55f-u6khhf-java25-exithang

permissions:
  contents: read

jobs:
  exit:
    name: Exit ${{ matrix.java }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        java: ['25', '21']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: sbt test, then watch the process exit
        shell: bash
        run: |
          set +e
          rm -f exit.txt
          ( xvfb-run -a -s "-screen 0 1920x1200x24" sbt -v test > test.log 2>&1; echo "SBT_EXIT=$?" > exit.txt ) &
          for i in $(seq 1 1500); do
            grep -qE "\[(success|error)\] Total time" test.log && break
            [ -f exit.txt ] && break
            sleep 2
          done
          echo "HANGDIAG java=${{ matrix.java }} tests-finished-marker at $(date -u +%T)"
          grep -E "Tests: succeeded|All tests passed|Total time" test.log | tail -n 4
          t0=$(date +%s)
          for i in $(seq 1 90); do [ -f exit.txt ] && break; sleep 2; done
          if [ -f exit.txt ]; then
            echo "HANGDIAG EXITED after $(( $(date +%s) - t0 ))s: $(cat exit.txt)"
          else
            echo "HANGDIAG STILL ALIVE after $(( $(date +%s) - t0 ))s"
            ps -eo pid,ppid,stat,etime,cmd | grep -E "java|sbt|Xvfb|xvfb" | grep -v grep | cut -c1-200
            for pid in $(pgrep -f sbt-launch); do
              echo "HANGDIAG ---- jcmd Thread.print for $pid"
              jcmd $pid Thread.print -l > dump-$pid.txt 2>&1
              grep -c '^"' dump-$pid.txt
              echo "HANGDIAG non-daemon threads:"
              grep -E '^"' dump-$pid.txt | grep -v " daemon " | cut -c1-200
              echo "HANGDIAG deadlock:"; grep -A20 "Found one Java-level deadlock" dump-$pid.txt | head -40
            done
            for pid in $(pgrep -f sbt-launch); do
              echo "HANGDIAG ---- full stacks of non-daemon, non-runnable-idle threads for $pid"
              awk 'BEGIN{RS="\n\n"} /^"/ && $0 !~ / daemon / {print $0 "\n"}' dump-$pid.txt | head -n 400
              echo "HANGDIAG ---- shutdown related stacks"
              grep -n -B2 -A18 -E "ApplicationShutdownHooks|Shutdown\.|Runtime\.exit|System\.exit|DestroyJavaVM" dump-$pid.txt | head -n 200
            done
            pkill -f sbt-launch; pkill Xvfb
          fi
