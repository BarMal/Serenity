name: Debug JBR measure

on:
  push:
    branches:
      - ccr-157ed55f-u6khhf-jbr-measure

permissions:
  contents: read

jobs:
  jar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - run: sbt -v clean assembly writePackageVersion
      - run: |
          mkdir -p out
          cp target/scala-*/Serenity.jar out/Serenity.jar
          cp LICENSE THIRD-PARTY-NOTICES.md out/
          cp target/package/app-version.txt out/
      - uses: actions/upload-artifact@v4
        with:
          name: jar
          path: out/*
          retention-days: 1

  measure:
    needs: jar
    name: Measure ${{ matrix.plat }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, plat: linux-x64 }
          - { os: ubuntu-24.04-arm, plat: linux-aarch64 }
          - { os: windows-latest, plat: windows-x64 }
          - { os: macos-latest, plat: osx-aarch64 }
    env:
      GH_TOKEN: ${{ github.token }}
      PLAT: ${{ matrix.plat }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: jar
          path: package-input
      - name: Fetch JBR 21 flavours
        shell: bash
        run: |
          set -euo pipefail
          TAG="$(gh release list -R JetBrains/JetBrainsRuntime --limit 200 --json tagName,publishedAt --jq '[.[] | select(.tagName | startswith("jbr-release-21"))] | sort_by(.publishedAt) | last | .tagName')"
          echo "JBR tag: $TAG"
          echo "$TAG" > jbr-tag.txt
          gh release view "$TAG" -R JetBrains/JetBrainsRuntime --json assets --jq ".assets[] | select(.name | contains(\"-$PLAT-\")) | \"\(.name) \(.size)\"" | tee jbr-assets.txt
          mkdir -p jbr
          for flavour in jbrsdk jbrsdk_jcef jbr jbr_jcef; do
            name="$(awk '{print $1}' jbr-assets.txt | grep -E "^${flavour}-21[0-9.]*-${PLAT}-b[0-9.]+\.tar\.gz$" | head -n1 || true)"
            if [ -z "$name" ]; then echo "no asset for $flavour"; continue; fi
            gh release download "$TAG" -R JetBrains/JetBrainsRuntime -p "$name" -D jbr
            mkdir -p "jbr/$flavour"
            tar -xzf "jbr/$name" -C "jbr/$flavour"
            echo "$flavour -> $name"
          done
      - name: Measure
        shell: bash
        run: |
          set -uo pipefail
          size_of() { du -sk "$1" 2>/dev/null | awk '{printf "%.1f MB", $1/1024}'; }
          report=measure-report.txt
          : > "$report"
          say() { echo "$@" | tee -a "$report"; }
          home_of() {
            # the directory holding bin/java (macOS: .../Contents/Home)
            find "$1" -maxdepth 6 -type f \( -name java -o -name java.exe \) -path '*bin*' | head -n1 | xargs -I{} dirname {} | xargs -I{} dirname {}
          }
          cp LICENSE THIRD-PARTY-NOTICES.md package-input/ 2>/dev/null || true
          run_one() {
            label="$1"; jhome="$2"
            say "=== $label  ($jhome)"
            say "unpacked JDK: $(size_of "$jhome")"
            say "java -version: $("$jhome/bin/java" -version 2>&1 | tr '\n' ' ')"
            say "modules (count): $("$jhome/bin/java" --list-modules | wc -l)"
            say "jmods dir: $([ -d "$jhome/jmods" ] && echo "yes $(size_of "$jhome/jmods")" || echo no)"
            say "has jlink: $([ -x "$jhome/bin/jlink" ] || [ -x "$jhome/bin/jlink.exe" ] && echo yes || echo no)  has jpackage: $([ -x "$jhome/bin/jpackage" ] || [ -x "$jhome/bin/jpackage.exe" ] && echo yes || echo no)"
            if [ -x "$jhome/bin/jimage" ] || [ -x "$jhome/bin/jimage.exe" ]; then
              say "WLToolkit in image: $("$jhome/bin/jimage" list "$jhome/lib/modules" 2>/dev/null | grep -c 'sun/awt/wl/WLToolkit.class')"
            fi
            out="dist-$label"; rm -rf "$out"; mkdir -p "$out"
            args=(--type app-image --name Serenity --input package-input --main-jar Serenity.jar --main-class Main
                  --app-version "$(cat package-input/app-version.txt)" --vendor BarMal --dest "$out"
                  --java-options -XX:+UseG1GC --java-options -XX:MaxRAMPercentage=25 --java-options -XX:G1PeriodicGCInterval=60000)
            if [ "$(uname -s)" != "Darwin" ]; then
              args+=(--jlink-options "--strip-debug --no-man-pages --no-header-files --generate-cds-archive"
                     --java-options '-XX:SharedArchiveFile=$APPDIR/serenity.jsa' --java-options -XX:+AutoCreateSharedArchive)
            fi
            if [ "${RUNNER_OS:-}" = "Windows" ]; then args+=(--icon "$GITHUB_WORKSPACE/src/main/resources/icons/serenity.ico"); fi
            start=$(date +%s)
            if "$jhome/bin/jpackage" "${args[@]}" > "jpackage-$label.log" 2>&1; then
              say "jpackage: ok in $(( $(date +%s) - start )) s"
              app="$out/Serenity"; [ -d "$out/Serenity.app" ] && app="$out/Serenity.app"
              say "app image: $(size_of "$app")"
              rt="$(find "$app" -maxdepth 4 -type d -name runtime | head -n1)"
              say "runtime dir: $(size_of "$rt")  ($rt)"
              say "jlinked modules: $(tr -d '"' < "$rt/release" 2>/dev/null | grep '^MODULES' | tr ' ' '\n' | grep -c . )"
              say "base CDS archive: $(find "$rt" -name 'classes*.jsa' | head -n3 | tr '\n' ' ')"
              python3 -c "import shutil,sys,os; p=shutil.make_archive('zip-$label','zip',os.path.dirname(sys.argv[1]),os.path.basename(sys.argv[1])); print(os.path.getsize(p)/1048576)" "$app" > zipsize.txt
              say "zip (as released): $(cat zipsize.txt | awk '{printf "%.1f MB", $1}')"
              # run the launched app image headless to see it start and to let AppCDS write its archive
              exe="$app/bin/Serenity"; [ -d "$out/Serenity.app" ] && exe="$app/Contents/MacOS/Serenity"; [ "${RUNNER_OS:-}" = "Windows" ] && exe="$app/Serenity.exe"
              say "launch --version: $(timeout 60 "$exe" --version 2>&1 | head -n3 | tr '\n' ' ')"
              say "serenity.jsa after run: $(find "$app" -name serenity.jsa -exec du -k {} + 2>/dev/null | awk '{printf "%.1f MB", $1/1024}')"
            else
              say "jpackage: FAILED"; tail -n 25 "jpackage-$label.log" | tee -a "$report"
            fi
          }
          run_one temurin "$JAVA_HOME"
          for flavour in jbrsdk jbrsdk_jcef jbr jbr_jcef; do
            if [ -d "jbr/$flavour" ]; then
              jh="$(home_of "jbr/$flavour")"
              if [ -n "$jh" ]; then run_one "$flavour" "$jh"; else say "=== $flavour: no bin/java found"; fi
            fi
          done
          echo "---- assets"; cat jbr-assets.txt | tee -a "$report"
          echo "JBR tag: $(cat jbr-tag.txt)" | tee -a "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-${{ matrix.plat }}
          path: |
            measure-report.txt
            jpackage-*.log
            jbr-assets.txt
