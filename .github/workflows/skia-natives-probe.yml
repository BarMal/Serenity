name: Skia Natives Probe

# Proves the packaged Skiko layout loads on the OSes Serenity ships (#2028): the jar is assembled for the target, its
# natives are moved out with scripts/SkikoNatives.java, and scripts/SkikoProbe.java then loads them through
# -Dskiko.library.path and renders into a 1x1 raster surface. The macOS image is covered by Desktop Package Check, which
# probes the signed app image itself.
on:
  pull_request:
    paths:
      - build.sbt
      - third-party/**
      - ci/**
      - scripts/Skiko*.java
      - scripts/sign-macos-app.sh
      - .github/workflows/skia-natives-probe.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    name: Probe Windows natives
    runs-on: windows-latest
    env:
      SERENITY_SKIKO_TARGET: windows-x64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: sbt

      - name: Set up sbt launcher
        uses: sbt/setup-sbt@v1

      - name: Assemble the jar and move the natives out of it
        shell: bash
        run: |
          set -euo pipefail
          sbt -v assembly
          mkdir -p probe
          cp target/scala-*/Serenity.jar probe/Serenity.jar
          java scripts/SkikoNatives.java probe/Serenity.jar probe/natives windows-x64
          ls -l probe/natives

      - name: Probe the Skiko DLL and icudtl.dat
        shell: bash
        run: |
          set -euo pipefail
          java -Dskiko.library.path=probe/natives -cp probe/Serenity.jar scripts/SkikoProbe.java | tee probe.log
          grep -q '^SKIKO_PROBE_OK ' probe.log

      - name: Probe fails when the natives are missing
        shell: bash
        run: |
          set -uo pipefail
          if java -Dskiko.library.path=probe/missing -cp probe/Serenity.jar scripts/SkikoProbe.java; then
            echo "::error::The probe passed without the natives; it is not testing the shipped layout."
            exit 1
          fi

  linux:
    name: Probe Linux natives under Xvfb and Mesa
    runs-on: ubuntu-latest
    env:
      SERENITY_SKIKO_TARGET: linux-x64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: sbt

      - name: Set up sbt launcher
        uses: sbt/setup-sbt@v1

      - name: Install Xvfb and software OpenGL
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1 libgl1-mesa-dri libfontconfig1

      - name: Assemble the jar and move the natives out of it
        shell: bash
        run: |
          set -euo pipefail
          sbt -v assembly
          mkdir -p probe
          cp target/scala-*/Serenity.jar probe/Serenity.jar
          java scripts/SkikoNatives.java probe/Serenity.jar probe/natives linux-x64
          ls -l probe/natives
          jar tf probe/Serenity.jar | { ! grep -E 'skiko-(linux|macos|windows)-'; }

      - name: Probe with the default render API
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1280x800x24" java -Dskiko.library.path=probe/natives -cp probe/Serenity.jar scripts/SkikoProbe.java | tee probe.log
          grep -q '^SKIKO_PROBE_OK ' probe.log

      - name: Probe with software rendering requested
        shell: bash
        env:
          SKIKO_RENDER_API: SOFTWARE_FAST
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1280x800x24" java -Dskiko.library.path=probe/natives -cp probe/Serenity.jar scripts/SkikoProbe.java | tee probe.log
          grep -q '^SKIKO_PROBE_OK SOFTWARE_FAST' probe.log

      - name: Probe fails when the natives are missing
        shell: bash
        run: |
          set -uo pipefail
          if xvfb-run -a java -Dskiko.library.path=probe/missing -cp probe/Serenity.jar scripts/SkikoProbe.java; then
            echo "::error::The probe passed without the natives; it is not testing the shipped layout."
            exit 1
          fi
