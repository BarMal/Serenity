name: Debug Java 25 JBR ABBA relaxed

on:
  push:
    branches:
      - ccr-157ed55f-u6khhf-java25-abbajbr

permissions:
  contents: read

jobs:
  jar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - run: |
          cp bench/ci/perf-assembly.sbt perf-assembly.sbt
          sbt -v clean assembly "Test / assembly" writePackageVersion
          mkdir -p out
          cp target/scala-*/Serenity.jar target/scala-*/serenity-perf.jar out/
          cp LICENSE THIRD-PARTY-NOTICES.md out/
          cp target/package/app-version.txt out/
      - uses: actions/upload-artifact@v4
        with:
          name: jars
          path: out/*
          retention-days: 3

  abba:
    name: ABBA ${{ matrix.name }}
    needs: jar
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: t21-vs-jbr25, a: t21, b: jbr25, a_opts: "", b_opts: "" }
    env:
      GH_TOKEN: ${{ github.token }}
      PLAT: linux-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: echo "T25=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: echo "T21=$JAVA_HOME" >> "$GITHUB_ENV"
      - name: Install JBR 25 and Xvfb
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          echo "JBR25=$(bash bench/java25/fetch-jbr25.sh "$RUNNER_TEMP/jbr25")" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: jars
          path: jars
      - name: ABBA (${{ matrix.name }})
        shell: bash
        run: |
          set -uo pipefail
          home_of() { case "$1" in t21) echo "$T21";; t25) echo "$T25";; jbr25) echo "$JBR25";; esac; }
          export JAR="$PWD/jars/serenity-perf.jar" OUT="$PWD/abba-out"
          export A_JAVA="$(home_of '${{ matrix.a }}')/bin/java" B_JAVA="$(home_of '${{ matrix.b }}')/bin/java"
          base="-XX:+UseG1GC -XX:MaxRAMPercentage=25 -XX:G1PeriodicGCInterval=60000"
          export A_OPTS="$base ${{ matrix.a_opts }}" B_OPTS="$base ${{ matrix.b_opts }}"
          "$A_JAVA" -version; "$B_JAVA" -version
          nproc; free -m | head -2
          bash bench/java25/abba-jdk.sh laptop. render. footprint. layout. 2>&1 | tail -n 120 | tee abba-summary.txt || true
          for f in abba-out/b-1.csv.err; do echo "=== $f"; head -n 20 "$f" || true; done
          python3 bench/java25/abba-table.py "$OUT" | tee abba-table.txt || true
          {
            echo "## ABBA ${{ matrix.name }} (A=${{ matrix.a }} ${{ matrix.a_opts }}, B=${{ matrix.b }} ${{ matrix.b_opts }})"
            echo '```'; cat abba-summary.txt; echo '--- table'; cat abba-table.txt; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: abba-${{ matrix.name }}
          path: |
            abba-out/**
            abba-summary.txt
            abba-table.txt
          retention-days: 14
